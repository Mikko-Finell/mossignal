schema_version: "0.1"
id: mossignal.runtime.stateful_reaction_foundation
title: Previous-and-proposed stateful reaction foundation
kind: family
status: reviewed

source_baseline:
  commit: 8ea64824a2ac4f984502879fea938bfac41e0b4a
  working_tree: dirty

summary: >-
  Stateful reactions read one previous committed state vector, expose settled
  current outputs in the same reaction, stage at most one successor per state
  cell, and commit every successor atomically only after complete settlement.

scope:
  includes:
    - previous committed and proposed successor state semantics
    - declared-state initialization and ready-machine state ownership
    - compiled state-family slots and runtime staging
    - same-reaction visibility, atomic commitment, and state inspection
  excludes:
    - node-specific state schemas and transition laws
    - pending temporal obligations and diagnostic-episode state
    - snapshot encoding, restoration, replay, and topology-state migration
    - optimized incremental settlement and inspection subscriptions

known_uncovered:
  - Canonical persistence and digest encoding for stateful machine state
  - Topology-patch compatibility and migration of state cells

aliases:
  - previous committed state
  - proposed successor state
  - state cell
  - atomic state commitment

requirements:
  - id: previous-and-proposed-state
    kind: semantic
    statement: >-
      Every stateful reaction reads the same previous committed value for each
      state cell and may stage at most one proposed successor for that cell.
      Proposed state is not visible as stored state or fed back into the same
      reaction, and no cell performs repeated same-time transitions.
    sources: [builtin-transducer, runtime-reaction-equations, runtime-state-storage]

  - id: current-output-and-causality
    kind: semantic
    statement: >-
      A stateful operation computes its settled current output from previous
      state and settled current inputs. That output is available to downstream
      operations in the same reaction, so every possible current input-to-output
      influence remains in the conservative acyclic reaction graph. The
      proposed successor is a terminal product and a causality barrier.
    sources: [builtin-dependencies, api-causality, runtime-causality]

  - id: declared-state-initialization
    kind: lifecycle
    statement: >-
      Every stateful node declares explicit initial state. A spawned
      AwaitingInitialization machine owns that declared state but no fabricated
      settled runtime values. The first ordinary reaction reads declared state
      as previous state, may produce a different current output and successor,
      and atomically installs the successor when initialization succeeds.
    sources: [builtin-initialization, api-lifecycle, testing-initialization]

  - id: family-partitioned-state-layout
    kind: lifecycle
    statement: >-
      Compilation assigns each state cell to a descriptor and state-family slot
      of the correct schema. Each spawned machine owns an independent mutable
      state store, while CompiledNetwork remains immutable and free of runtime
      state. Dense layout and slot identity remain private and revision-local.
    sources: [runtime-compilation, runtime-invariants, runtime-family-storage, api-machine]

  - id: complete-stateful-settlement
    kind: semantic
    statement: >-
      Full topological evaluation computes settled outputs and a private set of
      proposed state transitions after all reaction predecessors settle. It may
      not overwrite committed state during evaluation, expose evaluator-order
      glitches, or make one operation observe another operation's proposal.
    sources: [runtime-full-evaluation, runtime-glitch-freedom, runtime-state-storage]

  - id: atomic-successor-commit
    kind: system_effect
    statement: >-
      All proposed successors commit together with settled signals, output
      baselines, provenance, and the rest of the prepared machine at the single
      transaction publication point. Any structured rejection preserves every
      prior node-state value and publishes no partial state or output change.
    sources: [api-settlement, runtime-transition, runtime-commit, testing-failure-atomicity]

  - id: committed-state-inspection
    kind: public_surface
    statement: >-
      Owned node inspection identifies the observed revision and logical time
      and distinguishes internal committed state from current port values,
      reaction-scoped pulse history, pending work, diagnostics, and causal
      facts. Before initialization, structural inspection may expose declared
      initial state, while current runtime inspection fails as not initialized.
    sources: [builtin-inspection, api-inspection, concrete-inspection, testing-preinit-inspection]

  - id: stateful-foundation-verification
    kind: verification
    statement: >-
      Verification covers both lifecycle phases, declared state as the first
      reaction's previous state, current downstream visibility, at most one
      proposal per cell, atomic multi-cell commitment, equivalence across valid
      reaction work orders and same-time input permutations, complete failure
      atomicity, and deterministic compiled state-slot correspondence.
    sources: [testing-current-state, testing-stateful-chain, testing-work-order, testing-input-order, testing-failure-atomicity, testing-reference-path]

recommendations:
  - id: semantic-family-storage
    statement: >-
      Runtime state should be grouped by semantic family rather than represented
      by one heap-allocated trait object per node.
    sources: [runtime-family-storage]

implementation_freedom:
  - Private state-slot widths, family tables, descriptor fields, staging maps, and clone-and-swap decomposition are free when stable identity, state isolation, and atomic publication are preserved.
  - The first foundation may expose the smallest owned node-inspection value that distinguishes declared or committed state and its applicable causal fact; broader query planning, subscriptions, and history remain outside scope.
  - StateChange collection shape is optional in this opening slice because the API specification makes it a recommendation; committed state must still be directly inspectable and failure-atomic.

open_questions: []

