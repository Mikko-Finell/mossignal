schema_version: "0.1"
id: mossignal.node.level_controlled_pulse
title: Level-controlled pulse primitive family
kind: family
status: reviewed

source_baseline:
  commit: 566d221497c1a9288ef51e487654bf6dd278e483
  working_tree: dirty

summary: >-
  PulseGate, PulseSelect, and PulseRoute are stateless combinational primitives
  that use fully settled current Level controls to pass, select, or route complete
  reaction-local Pulse multiplicities without consumption, buffering, or hidden
  ordering.

scope:
  includes:
    - fixed typed port shapes, control polarity, and pulse-multiplicity laws
    - typed and dynamic authoring, structural validation, and stable port roles
    - current-reaction causality, compilation, settlement, and event provenance
    - bounded conformance and pre-stability network and module identity integration
  excludes:
    - edge-sensitive, stateful, and temporal behavior
    - low-enabled aliases, temporal windows, callbacks, and host effects
    - general inspection subscriptions, explanation rendering, and graph queries
    - persistence codecs, replay, and topology-patch execution

known_uncovered:
  - Exact public current-inspection, current-explanation, and why-not projections for passed, selected, routed, and suppressed pulse counts
  - Topology-patch compatibility and persistence representation beyond semantic fingerprinting

aliases:
  - PulseGate
  - PulseSelect
  - PulseRoute
  - level-controlled pulse flow
  - pulse routing

requirements:
  - id: settled-current-control
    kind: semantic
    statement: >-
      The family is stateless and non-temporal. Every control input uses its
      fully settled Level value in the current reaction, every Pulse input is a
      complete simultaneous count for that reaction, and no pulse count or
      enable state is retained for a later reaction.
    sources: [node-categories, current-controls, simultaneous-batches, pulse-state]

  - id: pulse-gate-law
    kind: semantic
    statement: >-
      PulseGate has one Pulse input named pulses, one Level input named enable,
      and one Pulse output. High passes the complete input count unchanged and
      Low yields zero. High is the sole canonical enabled polarity; low-enabled
      behavior is explicit Not composition rather than another gate kind.
    sources: [pulse-gate, pulse-fanout, pulse-multiplicity]

  - id: pulse-select-law
    kind: semantic
    statement: >-
      PulseSelect has a Level selector, distinct when-low and when-high Pulse
      inputs, and one Pulse output. Low yields the complete when-low count and
      High yields the complete when-high count; the unselected count is
      suppressed, is not consumed from its source, and is not remembered.
    sources: [pulse-select, pulse-fanout, pulse-multiplicity]

  - id: pulse-route-law
    kind: semantic
    statement: >-
      PulseRoute has a Level selector, one Pulse input, and distinct when-low
      and when-high Pulse outputs. Low sends the complete count only to
      when-low, High sends it only to when-high, and the other output is zero.
      The two output roles are semantic even though their signal kinds match.
    sources: [pulse-route, added-node-handles, semantic-fingerprint]
    basis: derived

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      NetworkBuilder and ModuleBuilder expose direct typed constructors and
      explicit stable-keyed forms for all three primitives. PulseRoute returns
      a node-specific PulseRouteOutputs value with when_low and when_high
      Signal<Pulse> fields. Dynamic definitions use the corresponding closed
      NodeKind variants, stable typed ports, semantic roles, and ordinary
      connections; signal-accepting constructors reject foreign builder scope.
    sources: [added-node-handles, builder-keyed, constructor-family, module-builder, dynamic-node-kind, dynamic-ports, semantic-fingerprint]

  - id: structural-validation
    kind: system_effect
    statement: >-
      Structural validation enforces each fixed input and output count, Level
      and Pulse kind, required driver, and expected semantic role, collecting
      independently safe duplicate-key, missing-port, missing-input,
      invalid-direction, kind-mismatch, multiple-driver, fixed-arity, and
      current-reaction-cycle findings through the ordinary report boundary.
    sources: [pulse-gate, pulse-select, pulse-route, validation-coverage, validation-codes, diagnostic-reports]

  - id: conservative-dependency-signatures
    kind: semantic
    statement: >-
      PulseGate contributes dependencies from pulses and enable to its output;
      PulseSelect contributes dependencies from selector and both branches to
      its output; PulseRoute contributes dependencies from selector and pulses
      to both outputs. These static dependencies do not vary with the current
      control value and participate in ordinary cycle rejection.
    sources: [dependency-signatures, reaction-graph]

  - id: complete-glitch-free-settlement
    kind: semantic
    statement: >-
      Compilation retains the stable typed incidence and semantic role
      information needed to apply each node law in the acyclic reaction graph.
      Full topological evaluation applies the family laws only after both Level
      and Pulse predecessors settle, so simultaneous control and count changes
      have no traversal-order intermediate, pulse consumption, or hidden
      microstep.
    sources: [compiled-invariants, glitch-freedom, full-evaluation]

  - id: multiplicity-preserving-results
    kind: semantic
    statement: >-
      Every nonzero family output count is exactly one selected or passed input
      count. The primitives introduce no addition or local count-overflow path;
      any upstream structured failure still rejects the complete outer
      transaction atomically through the shared reaction and Pulse foundation.
    sources: [pulse-gate, pulse-select, pulse-route, settlement, pulse-algebra]
    basis: derived

  - id: selected-output-provenance
    kind: system_effect
    statement: >-
      Every emitted pulse event has resolvable acyclic provenance sufficient to
      identify the current controlling Level fact and the passed or selected
      Pulse batch. Suppressed counts may remain distinguishable as explanatory
      context, but do not contribute to emitted multiplicity or become retained
      pulse state. Equivalent insertion or evaluation orders yield equivalent
      normalized derivations up to non-semantic cause identifiers.
    sources: [pulse-gate, pulse-select, pulse-route, causal-provenance, derivation-structure, pulse-provenance]
    basis: derived

  - id: pre-stability-identity-extension
    kind: compatibility
    statement: >-
      NetworkFingerprint and ModuleFingerprint distinguish all three node kinds
      and retain stable typed input and output keys, connection incidence, and
      semantic roles, including PulseRoute's two output roles. Before an
      explicit frozen baseline, the accepted implementation may extend the
      provisional canonical projection in place, but authority, implementation,
      and every affected exact golden vector must remain synchronized in one
      revision.
    sources: [semantic-fingerprint, restricted-fingerprint, module-fingerprint, fingerprint-versions]
    basis: derived

  - id: primitive-conformance
    kind: verification
    statement: >-
      Each member has reusable conformance coverage for every applicable matrix
      field represented by this contract, while excluded or known-uncovered
      fields remain explicitly classified rather than silently treated as
      implemented. Bounded exhaustive cases cross both Level controls with
      counts zero, one, two, and a larger representable count; verify
      simultaneous control changes, exact selected multiplicity, fan-out,
      initialization and ready reactions, no cross-reaction retention,
      provenance, dependency signatures, order invariance, and complete failure
      atomicity around upstream failures.
    sources: [pulse-algebra, node-conformance, conformance-matrix, exhaustive-testing, input-order, failure-atomicity]

implementation_freedom:
  - The dynamic representation of fixed input and output roles may use the smallest deterministic extension that preserves malformed authored claims, exact reconstruction, validation, dependency extraction, provenance subjects, and semantic identity.
  - Private descriptor variants, evaluator helpers, pulse-slot access, and provenance record layout are free when they preserve complete settled inputs, selected multiplicity, and deterministic observations.
  - Fixed port keys may be locally allocated by any deterministic rule; semantic roles remain fixed by each node law, and exact keyed forms remain the durable reconstruction authority.

open_questions: []

