schema_version: "0.1"
id: mossignal.node.pulse_delay
title: PulseDelay temporal primitive
kind: node
status: reviewed

source_baseline:
  commit: b52c1738fdfca82ceeb7462c85614e6701d88275
  working_tree: dirty

summary: >-
  PulseDelay is a fixed Pulse-to-Pulse temporal primitive that reproduces each
  complete simultaneous input count once at exactly origin plus a positive
  configured delay, with pending groups owned by the machine event calendar.

scope:
  includes:
    - PulseDelay port shape, positive delay parameter, and temporal law
    - typed and dynamic authoring, validation, dependency, and compilation
    - initialization, pending-group scheduling, due emission, and provenance
    - focused pending-work inspection and conformance verification
    - pre-stability network-fingerprint extension boundary
  excludes:
    - TransportDelay, InertialDelay, Periodic, and temporal standard modules
    - general calendar advancement and pending-event identity allocation
    - topology-patch migration and alternative duration-change policies
    - snapshot encoding, restoration, replay, and complete explanation rendering

known_uncovered:
  - Snapshot and restoration representation for PulseDelay pending groups
  - Topology-patch duration changes and explicit pending-group migration policies
  - Generic pending-event inspection, complete explanation rendering, and subscriptions

aliases:
  - PulseDelay
  - PulseDelayConfig<D>
  - delayed pulse group

requirements:
  - id: fixed-shape-positive-delay
    kind: semantic
    statement: >-
      PulseDelay has exactly one Pulse input, one Pulse output, a required
      NonZeroSpan<D> delay parameter, and pending pulse groups as temporal work.
      It has no Level port, zero-duration mode, optional control port, or
      instantaneous pass-through path.
    sources: [pulse-delay-law, concrete-config]

  - id: exact-reproduction-law
    kind: semantic
    statement: >-
      A complete simultaneous input count n received at logical time T creates
      future work for exactly T + delay and is reproduced once with the same
      multiplicity at that deadline. Zero is semantic absence and creates no
      pulse group; checked deadline or count arithmetic never wraps.
    sources: [pulse-delay-law, pulse-multiplicity, time-api]

  - id: due-and-new-input-boundary
    kind: semantic
    statement: >-
      A group due at T emits its complete count regardless of new input at T.
      New input at T cannot suppress, modify, or join the already-due obligation;
      it creates only strictly future work under the configured delay.
    sources: [exact-deadline, pulse-delay-law]

  - id: temporal-causality-barrier
    kind: semantic
    statement: >-
      PulseDelay has no current-input-to-current-output dependency. Its settled
      current Pulse input affects only a proposed future event after that input
      settles, while a due-event reaction root affects the current Pulse output.
      Validation and compilation therefore break current-reaction causality
      across the future obligation without treating the entire node as an
      unspecified barrier or adding same-time microsteps.
    sources: [dependency-signature, cycle-tests]

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      PulseDelayConfig<D> is a small value configuration containing its
      NonZeroSpan<D> delay. NetworkBuilder provides typed convenience and
      explicit keyed PulseDelay construction over Signal<Pulse>; dynamic
      definitions use the closed NodeKind::PulseDelay configuration with stable
      typed fixed-shape ports, while malformed direct claims remain validation input.
    sources: [builder-keyed, concrete-config, builder-family, dynamic-kind]

  - id: validation-compilation-and-identity
    kind: semantic
    statement: >-
      Structural validation enforces PulseDelay's exact Pulse port shape and
      positive typed duration, dependency derivation preserves its future-work
      barrier and due-event root, and compilation retains stable node and port
      correspondence plus a temporal descriptor sufficient to schedule and
      recognize its events without exposing dense runtime identity.
    sources: [dependency-signature, runtime-compilation, runtime-invariants]

  - id: fresh-initialization
    kind: lifecycle
    statement: >-
      A fresh PulseDelay begins with no pending groups. The initialization
      reaction processes any initial external pulse through the ordinary delay
      law, creating strictly future work but emitting no current PulseDelay
      output in response to that new input.
    sources: [temporal-initialization, pulse-delay-law, first-transaction]

  - id: machine-owned-pending-groups
    kind: lifecycle
    statement: >-
      Each scheduled group is a machine-owned pending event retaining stable
      event identity, PulseDelay owner, exact origin and deadline, complete
      multiplicity, originating revision, and causal contributors. Firing
      removes it from the pending calendar and exposes the due obligation as
      the causal support for the emitted pulse.
    sources: [pending-events, api-pulse-delay, pulse-delay-law]

  - id: equal-deadline-grouping
    kind: semantic
    statement: >-
      PulseDelay groups sharing one deadline participate in the complete
      unordered due batch. Equivalent groups may be combined with checked
      multiplicity addition only when grouped causal contributions and all
      observable pending-event facts remain preserved.
    sources: [pending-events, pulse-delay-law]

  - id: chronological-output-and-provenance
    kind: system_effect
    statement: >-
      Every nonzero due group that reaches an external Pulse output publishes a
      Pulsed event at its actual deadline with exact count and revision in the
      transaction's chronological output stream. Its CauseRef resolves through
      the result and preserves the originating input cause, scheduling node,
      origin time, pending event, and grouped contributors without inventing an
      order among simultaneous pulses.
    sources: [output-events, api-pulse-delay, causal-retention]

  - id: focused-pending-work-inspection
    kind: public_surface
    statement: >-
      Owned PulseDelay inspection provides the opening temporal
      inspection surface. Before initialization it exposes structural kind and
      delay only; when ready it additionally identifies observed revision and
      time plus every pending group's public key, origin, deadline,
      multiplicity, causal root, and the node's next eligible deadline.
    sources: [node-inspection, temporal-inspection, concrete-inspection]

  - id: pre-stability-pulse-delay-identity-extension
    kind: compatibility
    statement: >-
      Network identity distinguishes PulseDelay's kind, Pulse input and output
      roles, temporal pending-group schema, and configured delay. Before the
      first stable fingerprint baseline, the exact deterministic version-1
      projection may be extended by an accepted semantic-foundation change that synchronizes the
      authoritative projection, affected contracts, and golden vectors without
      a historical reader or migration path.
    sources: [network-fingerprint, fingerprint-versions]

  - id: pulse-delay-conformance
    kind: verification
    statement: >-
      Reusable conformance covers typed-versus-dynamic authoring, exact port
      kinds, positive non-unit delay, empty initialization, initial and ready
      pulse scheduling, zero/one/two/larger counts, multiple origins, equal
      deadlines, due-time new input, fan-out, temporal causality and cycle
      boundaries, pending inspection, chronological Pulsed events, grouped
      provenance, insertion-order invariance, fingerprint delay sensitivity,
      checked time and count boundaries, direct-jump equivalence, and complete
      failure atomicity.
    sources: [pulse-delay-tests, temporal-initialization-tests, validation-tests, compilation-tests, fingerprint-tests, failure-atomicity]

implementation_freedom:
  - Exact fixed-port derivation, keyed-constructor grouping, compiled descriptor fields, and private pending-group representation are free when stable subject identity and the temporal law are preserved.
  - Equal-deadline groups may remain separate or aggregate through checked arithmetic; choose the simplest deterministic representation, test it, and record the decision while preserving public keys and grouped causal facts.
  - Choose the simplest deterministic PulseDelay variant, delay, port-role, and temporal-schema spelling for the synchronized pre-stability fingerprint projection, then record it in authority, affected contracts, and golden vectors during implementation.
  - The bounded foundation may defer duration-change migration, generic inspect_pending, snapshots, restoration, replay, and full explanation UI.

open_questions: []

