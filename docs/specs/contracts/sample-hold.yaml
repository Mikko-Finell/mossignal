schema_version: "0.1"
id: mossignal.node.sample_hold
title: Pulse-sampled Level storage primitive
kind: node
status: reviewed

source_baseline:
  commit: e7a72dab3cbf1bab3630374465755e2ee67a9dc3
  working_tree: dirty

summary: >-
  SampleHold stores one LogicLevel and captures the fully settled current value
  whenever its complete simultaneous sample count is positive, exposing the
  captured value downstream before one atomic state commitment.

scope:
  includes:
    - fixed shape, explicit initial level, sampling law, and current dependencies
    - typed and dynamic authoring, validation, and semantic identity facets
    - stored-value inspection, capture provenance, and primitive conformance
  excludes:
    - generic stateful transaction and pulse-batch machinery owned by other contracts
    - resettable standard modules and non-Level value domains
    - persistence, topology-patch compatibility, and state migration
    - general explanation queries, observer subscriptions, and retained state history

known_uncovered:
  - Canonical snapshot, restoration, replay, and digest representation of held state
  - Compatible held-state preservation and explicit reset across topology changes

aliases:
  - SampleHold
  - SampleHoldConfig
  - sample_hold
  - sample-and-hold
  - sample-hold state

requirements:
  - id: fixed-shape-and-initial-level
    kind: semantic
    statement: >-
      SampleHold has one Level value input, one Pulse sample input, one Level
      output, and one stored LogicLevel with an explicit initial level.
      SampleHoldConfig contains the initial LogicLevel as semantic policy,
      without diagnostic metadata or runtime state. The primitive has no
      optional reset port; resettable behavior belongs to a named standard
      module or a separately specified fixed-shape node.
    sources: [sample-law, concrete-config]

  - id: settled-sampling-law
    kind: semantic
    statement: >-
      For previous stored level s, zero sample count produces current output s
      and successor s. A positive sample count produces the fully settled
      current value input as both current output and successor. Multiple
      simultaneous samples have the same state effect as one, and all their
      contributing causes remain available. The captured value is visible
      downstream in the same reaction; state commits once after settlement.
    sources: [sample-law, simultaneous-batches]

  - id: shape-validation-and-current-dependencies
    kind: semantic
    statement: >-
      Validation enforces the fixed value/sample roles and their distinct
      Level/Pulse kinds. Both current inputs conservatively influence the
      current Level output, independent of the current sample count or stored
      value. SampleHold is not a whole-node causality barrier, and a cycle
      following either instantaneous input-to-output path is rejected.
    sources: [sample-law, dependency-signature]

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      NetworkBuilder provides sample_hold with Signal<Level> value,
      Signal<Pulse> sample, and SampleHoldConfig, returning the Level signal
      through structured authoring failure. Its explicit add_sample_hold form
      accepts NodeKey and DiagnosticMeta and returns AddedNode. Imported or
      explicitly authored definitions can supply exact fixed-port keys.
      Equivalent dynamic definitions use the ordinary closed, non-callback
      node-kind/configuration surface and validation boundary.
    sources: [constructor-family, explicit-keyed, dynamic-node-kind]

  - id: semantic-identity-facets
    kind: semantic
    statement: >-
      SampleHold's network semantic projection includes its distinct node kind,
      stable typed value/sample input and output identities and semantic roles,
      explicit initial level, and stored-level state schema. Construction order
      and private state-slot or descriptor layout are not semantic identity.
    sources: [sample-law, network-fingerprint]

  - id: held-state-inspection-and-causality
    kind: system_effect
    statement: >-
      Applicable inspection distinguishes declared initial level, current settled
      input/output facts, committed held state, current support, and the cause
      establishing the held state, with logical time and revision. Before
      initialization only structural and declared-state facts are available.
      Capture provenance preserves the sampled Level's causal support and
      grouped sample contributions without inventing ordered pulse identities.
      Retention keeps the historical support needed to explain the held value;
      an unexplained previous value is not an authoritative terminal root.
    sources: [sample-law, node-inspection, current-support, pulse-provenance, causal-provenance]

  - id: sample-hold-conformance
    kind: verification
    statement: >-
      The primitive conformance inventory classifies applicable shape, initial
      state, first-reaction behavior, dependency, output/successor, simultaneous
      input, multiplicity, inspection, and causality fields. Focused stateful
      chains include SampleHold feeding FallingEdge and verify immediate
      downstream visibility together with atomic successor commitment.
      Required historical facts have authoritative causal roots, and changing
      support for an unchanged output must not fabricate a new output transition.
    sources: [testing-conformance, testing-stateful-chain, testing-provenance, testing-current-vs-transition]

recommendations:
  - id: exhaustive-sampling-domain
    statement: >-
      Enumerate both previous stored levels, both sampled levels, and zero versus
      positive sample count exhaustively; the complete semantic law has eight
      state/input-presence combinations.
    sources: [testing-primitive]

implementation_freedom:
  - Private storage tables, descriptors, exact fixed-port allocation, helper names, and focused inspection accessor shapes may follow the simplest deterministic implementation preserving the represented semantics.
  - The exact held-state cause refresh convention for a sample that captures the already-held value is open; choose, test, and record a deterministic rule while retaining its sample contributors and preserving the separate output-transition cause.
  - Canonical kind and role spellings for a newly represented SampleHold projection are bounded implementation choices under the repository pre-release policy; record and test the coherent projection without inferring a compatibility freeze.

open_questions: []

