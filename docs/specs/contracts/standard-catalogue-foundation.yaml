schema_version: "0.1"
id: mossignal.standard.catalogue_foundation
title: Versioned standard-module catalogue foundation
kind: capability
status: reviewed

source_baseline:
  commit: 0b8ec1eed2b36067ff042dbce39596cbf10c939f
  working_tree: clean

summary: >-
  The standard catalogue is an immutable, versioned, discoverable collection
  of authoritative module descriptors that constructs ordinary canonical
  ModuleDef values with exact standard origin and no privileged evaluator path.

scope:
  includes:
    - catalogue, descriptor, module-reference, parameter, and expansion identity
    - descriptor discovery and exact dynamic construction
    - canonical standard declaration, public interface, expansion, and stable internal identity
    - typed, explicit-keyed, and generic instantiation equivalence
    - module-level diagnostics, hierarchy, inspection, and verification hooks
  excludes:
    - individual standard-module behavioral laws and expansion case tables
    - persistence envelopes, restoration, replay, and canonical decoding
    - topology replacement, compatibility migration, and internal patch enforcement
    - primitive aliases, metadata-only conveniences, and builder-only compositions

known_uncovered:
  - Persistent validation of declarations against regenerated canonical expansions
  - Standard-module replacement and migration across descriptor versions

aliases:
  - StandardCatalogue<D>
  - StandardModuleDescriptor<D>
  - StandardModuleRef
  - StandardModuleDeclaration<D>

requirements:
  - id: closed-ordinary-module-boundary
    kind: prohibition
    statement: >-
      A standard module is a visible ordinary module composed only from
      supported primitives or exact standard descriptors. It introduces no
      evaluator extension, callback, hidden state, signal kind, host effect,
      special transaction semantics, fixed-point settlement, or uninspectable
      state or pending work.
    sources: [standard-classification, standard-boundary]

  - id: pre-release-evolving-catalogue
    kind: compatibility
    statement: >-
      Until an explicit maintainer release-readiness decision, catalogue,
      semantic, and expansion versions are provisional development identities.
      A development catalogue may expose the implemented subset of the target
      inventory, versions may change in place without compatibility ceremony,
      and no numeric value promises cross-revision compatibility, while every
      individual build still keeps references, descriptors, expansions,
      fingerprints, diagnostics, and golden tests internally coherent.
    sources: [catalogue-version, catalogue-inventory]

  - id: explicit-release-freeze
    kind: compatibility
    statement: >-
      The first compatibility-bearing catalogue version 1 targets Exactly,
      AtMost, AllEqual, PulseResettableToggle, LevelResettableToggle, and
      LevelResettableSampleHold at semantic and expansion version 1. Only an
      explicit release decision after the descriptor release gate freezes that
      inventory and those versions; after freezing, catalogue additions or
      changes increment versions and follow declared compatibility and migration
      rules. Catalogue version remains excluded from individual fingerprints.
    sources: [catalogue-version, catalogue-inventory, release-gate]

  - id: permanent-exact-descriptor-identity
    kind: public_surface
    statement: >-
      Each descriptor has one reserved lowercase ASCII mossignal.standard.*
      identifier and independent semantic and expansion versions. Once
      released, the identifier is permanent and cannot be reassigned.
      StandardModuleRef is the exact combined identity; display names, Rust
      constructors, aliases, and numeric version adjacency do not establish
      identity or compatibility.
    sources: [module-identifiers, descriptor-versions, descriptor-reference, concrete-identity]

  - id: immutable-structured-descriptor-discovery
    kind: public_surface
    statement: >-
      StandardCatalogue exposes its version, canonical descriptor iteration,
      exact-reference lookup, latest-id authoring lookup, and structured
      descriptor metadata. One published descriptor is immutable under its
      exact StandardModuleRef, and constructors, generated documentation,
      diagnostic links, conformance data, and canonical expansion must derive
      from or be checked against the same authoritative descriptor source.
    sources: [authoritative-descriptor, catalogue-types, descriptor-discovery, concrete-descriptors]

  - id: exact-standard-declaration-and-origin
    kind: semantic
    statement: >-
      Successful catalogue construction produces an ordinary validated
      ModuleDef with ModuleOrigin::Standard. Its declaration retains the exact
      StandardModuleRef, canonical parameter assignments, public variadic input
      keys, and canonical expansion fingerprint. A behaviorally identical User
      module remains User-origin and has distinct semantic identity.
    sources: [standard-origin, concrete-module-origin, dynamic-construction]

  - id: typed-parameters-and-public-interface
    kind: semantic
    statement: >-
      Dynamic requests retain an exact descriptor reference, explicit closed
      typed parameter values, and explicit variadic public keys for structured
      validation. Descriptor-defined fixed ports have deterministic permanent
      roles and keys; variadic ports retain caller-visible stable identity,
      canonicalize by stable-key order, preserve duplicate-source multiplicity,
      and treat display order as non-semantic unless a descriptor says otherwise.
    sources: [parameter-representation, public-port-identity, dynamic-requests]

  - id: one-canonical-expanded-module
    kind: semantic
    statement: >-
      One exact descriptor reference, parameter set, and public interface
      determines one canonical stable-keyed ordinary primitive ModuleDef. The
      implementation must not substitute a behaviorally equivalent graph;
      deterministic internal roles and derived node, typed-port, connection,
      and export keys preserve observable identity, provenance, diagnostics,
      inspection, hierarchy, expansion fingerprint, and module fingerprint.
    sources: [canonical-expansion, internal-key-derivation, variadic-internal-identity, fingerprints]

  - id: structured-construction-failures
    kind: system_effect
    statement: >-
      Dynamic construction reports unknown ids or versions, missing,
      unexpected, wrong-kind, or invalid parameters, interface and public-key
      defects, and canonical generation defects through structured catalogue
      failures or Report<ModuleDef<D>, D>. Caller defects suppress the artifact;
      shipped descriptor collisions or invariant disagreement remain structured
      LibraryDefect conditions rather than panics or silent repair.
    sources: [dynamic-construction, blocking-diagnostics, diagnostic-catalogue]

  - id: equivalent-construction-and-instantiation
    kind: public_surface
    statement: >-
      NetworkBuilder and ModuleBuilder both support concise and explicit-keyed
      standard constructors. Equivalent concise, explicit-keyed, dynamic-build,
      and generic ModuleDef instantiation paths converge on the same standard
      declaration and canonical instance structure for equivalent stable
      identities, parameters, keys, bindings, and metadata semantics.
    sources: [typed-construction, keyed-construction, ordinary-instantiation, concrete-equivalence]

  - id: retained-standard-boundary-observation
    kind: public_surface
    statement: >-
      Graph and module inspection retain the exact standard descriptor,
      declaration parameters, public roles and values, expansion fingerprint,
      hierarchy, module diagnostics, canonical internal roles and qualified
      subjects, and supported causal drill-down even when execution is flattened.
      Primitive diagnostics remain primitive-owned but group beneath the module.
    sources: [shared-inspection, diagnostic-ownership, concrete-inspection]

  - id: catalogue-foundation-verification
    kind: verification
    statement: >-
      Verification establishes deterministic discovery and generation, unique
      canonical keys and roles, typed/dynamic/generic path equivalence, public
      dependency agreement with expanded graph dependencies, identity and
      fingerprint sensitivity, hierarchy and inspection visibility, structured
      diagnostic conformance, and ordinary module-runtime behavior.
    sources: [conformance-matrix, canonical-verification, testing-standard-modules]

implementation_freedom:
  - Catalogue storage may be static, generated, or a zero-sized immutable view; choose the smallest deterministic representation whose public iteration and lookup are canonical.
  - Concrete private schema-view and iterator types remain open when descriptor data stays structured and callers need not parse documentation.
  - Key-derivation helper decomposition and caching are private; the specified domains, semantic inputs, uniqueness checks, and observable keys are not.

open_questions: []

