schema_version: "0.1"
id: mossignal.identity.machine_state_digests
title: Execution-state and observable-state digests
kind: artifact
status: reviewed

source_baseline:
  commit: cfec63bec2915a561ac434917f22414224b2a0ba
  working_tree: clean

summary: >-
  ExecutionStateDigest and ObservableStateDigest are distinct domain-separated
  identities of one committed machine. Execution covers future-determining
  semantic state. Observable extends that projection with required current
  observation. Neither digest is a snapshot, replay, or restoration artifact.

scope:
  includes:
    - the two digest types and their domain-separated construction
    - execution and observable semantic projections, including stable identity and canonical order
    - exclusion of policy, caches, allocation, subscribers, and presentation data
    - committed-machine and successful-result exposure
    - sensitivity, exclusion, and golden-vector verification for these two digests
  excludes:
    - SnapshotDigest, snapshot envelopes, restoration, and replay artifacts
    - topology migration and patch application
    - RuntimePolicyId construction
    - network, module, and input-schema fingerprint payload records
    - forecast execution and replay-frame construction
    - subscription delivery and explanation-query APIs
    - digest equality used in place of exact semantic validation

known_uncovered:
  - SnapshotDigest and the optional-history or snapshot-metadata cases that exist only to distinguish it
  - Provenance checkpoint compaction, external checkpoint bundles, and a public CauseDigest diagnostic surface
  - Optional retained history and completed-episode archives
  - Topology-patch migration of these projections
  - Public identity-allocation cursors other than the pending-event serial, until one is introduced
  - ForecastState, MachineSnapshot, and replay-frame digest accessors

aliases:
  - ExecutionStateDigest
  - ObservableStateDigest
  - execution-state digest
  - observable-state digest

requirements:
  - id: distinct-opaque-digests
    kind: public_surface
    statement: >-
      ExecutionStateDigest and ObservableStateDigest are distinct public opaque
      32-byte identities. Neither is interchangeable with the other,
      SnapshotDigest, a fingerprint, RuntimePolicyId, or NetworkRevision.
      Ordinary API use must not expose the digest algorithm as part of either
      semantic type.
    sources: [api-digest-scopes, concrete-identities, fixed-digests]

  - id: domain-separated-construction
    kind: semantic
    statement: >-
      DigestSuiteVersion 1 computes each digest as unkeyed BLAKE3-256 over the
      canonical record of domain label, payload, and domain version. The
      execution label is mossignal/execution_state_digest/v1 and the observable
      label is mossignal/observable_state_digest/v1. Each initial domain version
      is 1. A provenance-record content digest uses
      mossignal/provenance_record/v1 and must not reuse either machine label.
      The artifact prefix is not part of either digest.
    sources: [digest-suite, domain-separation, artifact-prefix]

  - id: canonical-profile
    kind: semantic
    statement: >-
      Each payload uses the canonical CBOR profile. The profile permits only
      shortest unsigned integers, byte strings, UTF-8 text, definite-length
      arrays, false, true, and null. It forbids negative integers, floats,
      indefinite lengths, CBOR maps and tags, undefined, and other simple
      values. A record is an array of unique field pairs ordered by ascending
      raw UTF-8 field name. Field names are schema-defined lowercase ASCII
      snake_case, and an optional absent field is omitted unless its schema
      requires a present null. A variant is encoded as ["variant_name", payload],
      using null when it has no payload; the name is the schema name, not a
      discriminant or debug text. Semantic sequences keep semantic order.
      Semantic maps are sorted key-value arrays, and semantic sets are sorted
      arrays without duplicates. Every 128-bit stable key is a 16-byte
      unsigned big-endian string, and every digest is a 32-byte string.
    sources: [canonical-values, records, variants, sequences, sets-and-maps, stable-keys, canonical-enums, fixed-digests]

  - id: execution-projection
    kind: semantic
    statement: >-
      The execution projection includes every committed fact that can affect
      future execution, future structured failure, persistent diagnostic
      publication, or public pending-event identity. It includes TimeDomainId,
      network fingerprint, lifecycle, topology revision, stateful-node state,
      temporal-node state, the pending-event calendar, active diagnostic
      episodes and their current material evidence, and the next public
      pending-event serial. While ready it also includes current logical time
      and the authoritative external level valuation. A later committed cursor
      that can affect future public identity is included. Each state entry
      contributes its stable owner, state schema, and state value, and includes
      state cause or revision context where that state schema requires them.
      Each pending event contributes its public serial, stable owner, event
      kind, deadline, and kind-specific semantic payload, including originating
      time, revision, and originating cause digest where that event record
      carries them.
    sources: [execution-digest, persistence-axioms, api-digest-scopes, state-tables, pending-event-records]

  - id: no-fabricated-uninitialized-facts
    kind: prohibition
    statement: >-
      An AwaitingInitialization projection retains declared stateful and
      temporal state and the next pending-event serial. It contains no
      fabricated current logical time, external level valuation, settled signal
      valuation, output baseline, pending schedule, runtime provenance, runtime
      diagnostic episode, or current explanation. An empty calendar is absence
      of events, not a fabricated schedule.
    sources: [uninitialized-snapshot, runtime-lifecycle]

  - id: observable-extension
    kind: semantic
    statement: >-
      Observable state is the execution projection plus required current
      observation it does not already represent: settled level facts for
      inspectable level ports and endpoints, external output baseline and
      establishment state, required provenance roots and their canonical
      closure or checkpoint roots, the current explanation boundary, and any
      other required inspection fact that cannot be derived from the execution
      projection. A fact already represented in the execution projection,
      including the authoritative external level valuation and active-episode
      evidence, is not encoded a second time. Ready level outputs have
      established baselines. Settled level facts are checked observations, not
      an alternative execution path. Pulse counts are not current port state.
    sources: [observable-digest, api-digest-scopes, settled-levels, output-baselines, pulse-state, required-provenance]

  - id: content-addressed-provenance
    kind: semantic
    statement: >-
      Provenance derivations are excluded from the execution digest. A cause
      digest stored inside a state entry or pending-event record remains part
      of that execution fact. The observable projection adds the required
      provenance roots and the content-addressed records of their backward
      closure, or explicit checkpoint roots where ancestry has been compacted.
      A record contributes its kind, applicable time and revision, stable
      subject, semantic payload, labeled predecessors, predecessor content
      digests, supporter multiplicities, and provenance semantics version.
      Private arena identifiers and in-memory CauseRef values do not
      participate. Byte-identical canonical records are one record. Retained
      records are ordered by content digest. Unordered supporters in one role
      are ordered by role, predecessor digest, and contribution payload.
      Ordered relations keep their specified order. With no explicit
      checkpoint, the explanation boundary is complete from initialization
      through that closure. A checkpoint boundary states its time and revision
      and must still explain every current fact.
    sources: [execution-digest, provenance-dag, provenance-relations, provenance-record-order, coalesced-provenance, cause-references, provenance-checkpoints, provenance-retention]
    basis: derived

  - id: stable-order-independent-of-storage
    kind: semantic
    statement: >-
      Subjects use stable semantic identity. Top-level authored keys stay those
      keys. Module-owned state and pending-event owners use the pair of
      ModuleInstanceKey and module-internal stable key, not a
      compiler-allocated flat key or dense index. State entries are ordered by
      that owner identity. Pending events are ordered by deadline, stable
      owner, event kind, and public event key. Equal-deadline storage order is
      not semantic. Other unordered sets use the default canonical order.
      Private calendar, heap, or arena placement must not change either digest.
    sources: [persistence-axioms, canonical-ordering, state-tables, pending-event-records, private-event-storage, catalogue-snapshot-state, module-qualified-identity]

  - id: excluded-non-semantic-state
    kind: prohibition
    statement: >-
      Both digests exclude runtime policy identity, optional and completed
      history, presentation metadata, subscriber and observer state, probes,
      the derived schedule, policy-independent caches, dense indices,
      allocation layout, and private worklists. Neither digest repeats standard
      descriptor data separately, because the network fingerprint already fixes
      the module definition. Changing only an excluded fact must not change
      either digest. Machines may share an execution digest while using
      different runtime policies.
    sources: [execution-digest, observable-digest, persistence-metadata, pulse-state, ready-snapshot, client-state, canonical-encoding, policy-identity, probes, catalogue-fingerprints]

  - id: projection-version-rule
    kind: compatibility
    statement: >-
      Each payload includes the version components that define interpretation
      of its fields. A schema-only encoding change does not change a digest
      while the semantic projection, digest suite, and domain version stay
      unchanged. A change to the canonical semantic projection requires a new
      domain version or digest suite version. Digests from different suites
      are different namespaces and must not be compared as one identity.
    sources: [digest-version-inputs, digest-suite-change]

  - id: equality-is-not-validation
    kind: semantic
    statement: >-
      Digest inequality proves inequality under the canonical encoding. Digest
      equality is not proof of semantic equality. When two canonical records
      with the same digest are simultaneously available and their bytes differ,
      the implementation must treat that as a fatal collision or corruption and
      must not choose one record silently. Digest equality must not replace
      exact semantic validation.
    sources: [digest-equality, canonical-encoding]

  - id: pure-machine-and-result-exposure
    kind: public_surface
    statement: >-
      Machine exposes execution_state_digest and observable_state_digest in
      both lifecycle phases. A successful transaction result exposes the
      pre-publication execution digest, the post-publication execution digest,
      and the post-publication observable digest, through fields or equivalent
      accessors. Both queries are pure projections and must not mutate the
      machine.
    sources: [api-machine, concrete-machine, concrete-result, inspection-purity]

  - id: failure-leaves-digests-unchanged
    kind: system_effect
    statement: >-
      A rejected transaction leaves the published machine unchanged, including
      both digests. Preparing a digest must not publish a partial machine.
      Inspection and subscriber changes must not change either digest.
    sources: [publication-atomicity, settlement, failure-atomicity, inspection-purity]

  - id: digest-verification
    kind: verification
    statement: >-
      Representative execution and observable digests have versioned golden
      vectors retaining the complete canonical digest-input bytes and the
      expected 32-byte result, including an uninitialized machine and a ready
      machine. Tests must show that identical payload bytes under the two
      domains produce different digests, and that changing a version component
      included in one projection changes that digest unless a specified
      schema-only rule preserves it. They must show invariance under
      non-semantic storage order and private layout, including unordered
      supporter order, pending equal-deadline storage order, and diagnostic
      collection construction order. They must show sensitivity to included
      semantic facts and exclusion of policy, presentation metadata, and
      subscriber state. At least one case must change required current
      observation while leaving the execution digest unchanged. Rejection and
      pure inspection leave both digests unchanged. Tests compare canonical
      bytes and must not treat digest equality as a substitute.
    sources: [canonical-vectors, digest-scope-verification, digest-domain-tests, permutation-invariance, failure-atomicity, inspection-purity, digest-equality]

recommendations:
  - id: value-capabilities
    statement: >-
      Each digest type should provide Clone, Copy, Eq, Hash, Ord, Debug, and
      Display with a stable hexadecimal representation.
    sources: [concrete-identities]

implementation_freedom:
  - Sections 57 and 58 list facts, not a closed field-level payload record. Choose the simplest deterministic record that meets the inclusions, exclusions, canonical profile, and domain labels. Record that spelling in the golden vectors and the bead close-out. Do not treat the first spelling as a named compatibility freeze, and do not add a successor domain in the slice that introduces it.
  - The private encoder may reuse the existing fingerprint CBOR writer. Public canonical-byte accessors are unnecessary when tests can observe the digest input.
  - CauseDigest need not become a public type while provenance content digests use mossignal/provenance_record/v1.
  - Empty collections may sit inside the lifecycle variant or beside it when uninitialized bytes still contain no fabricated ready facts.
  - Explicitly labeled last-reaction history and other pure inspection caches stay excluded. A retained standard-module fact enters only the observable projection when current inspection requires it and the execution projection plus required provenance cannot reconstruct it.

open_questions: []

