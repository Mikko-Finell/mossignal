schema_version: "0.1"
id: mossignal.provenance.causal_explanations
title: Structured current and recorded causal explanations
kind: concept
status: reviewed
source_baseline:
  commit: 6063ae23cdd6f5795e76a80f1276daa996bd6127
  working_tree: dirty
summary: >-
  Explanations derive current support from settled facts and node laws, and
  historical establishment from retained provenance. Structured owned evidence
  exposes temporal conditions and retention boundaries without invented causes.
scope:
  includes:
    - current node, module, output, pending-work, and recorded-event explanations
    - support versus transition, authoritative roots, and retention boundaries
  excludes:
    - desired-state solvers, missing-pulse history queries, and rendering
    - provenance persistence encoding and collection algorithms
    - cause-reference ownership and lifetime represented by semantic-inspection
aliases: [Explain, Explanation, RetentionStatus]
requirements:
  - id: current-versus-transition
    kind: semantic
    statement: >-
      Current combinational support is reconstructed from settled upstream facts,
      reaction structure, and applicable node laws. It remains distinct from
      historical causes establishing stored state and the latest transition.
      Stateful explanations distinguish establishment, preservation, conflicts,
      and reset or overwrite policy where applicable, including previous state,
      current controls, and the rule producing current output and successor state.
    sources: [api-provenance, api-results, runtime-support, node-explanations]
  - id: temporal-facts
    kind: semantic
    statement: >-
      Temporal explanations expose deadlines, remaining spans, origin and
      scheduling owner, cancellation conditions, and coalescing or replacement
      policy where applicable.
    sources: [api-results]
  - id: structured-owned-support
    kind: public_surface
    statement: >-
      Explanations return structured data independent of prose. Semantically
      unordered supporters remain unordered in meaning even when canonically
      represented.
    sources: [api-results, concrete-results]
  - id: public-module-law
    kind: public_surface
    statement: >-
      A standard module explanation presents its public behavior and ports first,
      with internal primitive support retained as subordinate hierarchical paths.
      It identifies the instance and exact descriptor, relevant public input
      facts, prior and successor aggregate state, the applied public rule, output
      or non-emission, and suppression, reset, or conflict facts where applicable.
      Grouping preserves required contributors, pulse multiplicity, selected and
      suppressed branches, and migration ancestry, with primitive drill-down.
    sources: [concrete-results, standard-explanations]
  - id: authoritative-retention-boundary
    kind: semantic
    statement: >-
      Retained causal support is an acyclic derivation graph. Historical
      explanation paths terminate at authoritative roots such as
      initialization, observations, temporal origins, migration, or checkpoints.
      Retention identifies complete ancestry from initialization or an explicit
      checkpoint boundary. An unexplained previous value is not a root, and no
      result may claim a cause or historical completeness it cannot derive.
    sources: [api-provenance, api-results, runtime-checkpoints]
  - id: explanation-verification
    kind: verification
    statement: >-
      Tests verify authoritative-root reachability and permutation invariance of
      unordered support while preserving identity, counts, joint grouping, and
      blocker meaning. Focused tests change current support of an unchanged
      output and require updated support with its transition cause preserved.
    sources: [testing-roots, testing-supporters, testing-current]
recommendations:
  - id: all-current-supporters
    statement: >-
      Explanations should report all current supporters or applicable blockers
      rather than an arbitrary minimal proof.
    sources: [node-explanations]
implementation_freedom:
  - Public result shapes and traversal strategy may be chosen deterministically without introducing broad why-not or historical query facilities.
open_questions: []
