schema_version: "0.1"
id: mossignal.runtime.level_input_delta
title: Ready-machine level input delta
kind: artifact
status: reviewed

source_baseline:
  commit: c808ff7017d86a2b7a51a17ab9bcbc70554ec3f7
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/api_and_semantics_spec.md
    - docs/specs/concrete_rust_api_surface.md
    - docs/specs/exhaustive_diagnostic_code_catalogue.md
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md
    - docs/specs/processor_and_runtime_architecture.md

summary: >-
  A level InputDelta is an owned opaque artifact built against one exact
  compiled input schema. It records an unordered set of explicit external
  level observations for later ready-machine advancement while omitted levels
  retain their prior authoritative values.

scope:
  includes:
    - owned level-only InputDelta and its ordinary current-topology builder
    - network and input-schema identity binding
    - explicit level observations, omission, and deterministic construction
    - invalid-observation rejection during construction
    - lifecycle relationship to a prior authoritative external valuation
    - target Level obligations checked from prepared input plans
  excludes:
    - pulse observations and pulse-count semantics
    - ready-machine transaction execution and output events
    - binding projection and caller-object-model interpretation
    - persistence artifact encoding and decoding
    - state/event migration and topology-patch finalization

known_uncovered:
  - The complete pulse-observation family is represented by reaction-scoped-pulse-foundation.yaml.

aliases:
  - InputDelta<D>
  - InputDeltaBuilder<D>
  - ready-machine input delta

requirements:
  - id: target-level-observation-and-admission
    kind: semantic
    statement: >-
      A prepared target delta uses set for both preserved and newly required
      target Levels. New-Level omission is rejected by with_patch and runtime
      admission using the prepared input-valuation plan; there is no establish
      operation. Removed endpoints are absent from the target schema. Complete
      snapshots remain mandatory for initialization.
    sources: [api-delta, concrete-delta]

  - id: compiled-builder-origin
    kind: public_surface
    statement: >-
      CompiledNetwork exposes an input-delta builder for its own exact compiled
      topology, so ordinary construction obtains network and input-schema
      context from that topology rather than from caller-supplied surrogate
      identity tokens.
    sources: [concrete-compiled]

  - id: owned-opaque-network-bound-artifact
    kind: public_surface
    statement: >-
      InputDelta and its builder are distinct from InputSnapshot, and a
      completed InputDelta is an owned opaque artifact that does not borrow the
      compiled network or another topology provider.
    sources: [api-delta, concrete-artifact-boundary]

  - id: exact-current-schema-binding
    kind: compatibility
    statement: >-
      An ordinary current-topology delta retains the compiled topology's exact
      NetworkKey, NetworkFingerprint, and InputSchemaFingerprint separately,
      and records observations by stable typed endpoint identity rather than
      collection position. Exact machine revision expectation belongs to the
      later transaction; target-bound patch deltas carry exact target definition identity, with
      new-Level obligations checked from the prepared input plan by with_patch
      and runtime admission.
    sources: [schema-binding, concrete-compiled, concrete-delta]
    basis: derived

  - id: explicit-level-observations
    kind: semantic
    statement: >-
      An ordinary level delta may explicitly set or reassert any existing
      external level input in its bound schema. It need not repeat the complete
      external valuation, and completing an empty or partial delta is valid.
    sources: [api-delta, concrete-delta, schema-projection, delta-artifact]

  - id: omission-means-retention
    kind: semantic
    statement: >-
      When a compatible ready machine later applies the delta, every
      unmentioned external level retains its prior authoritative value; omission
      is not interpreted as Low and the delta artifact alone does not establish
      lifecycle compatibility.
    sources: [api-delta, schema-projection, delta-artifact]

  - id: rejects-invalid-observations
    kind: prohibition
    statement: >-
      Construction rejects observations for endpoints outside the bound schema
      and repeated observations for one endpoint, distinguishing equivalent
      duplicates from incompatible conflicts. The level-typed builder prevents
      wrong-kind observations through its public input type.
    sources: [input-diagnostic-codes, concrete-delta]

  - id: deterministic-unordered-batch
    kind: verification
    statement: >-
      The delta represents one unordered semantic batch. Verification must
      establish that equivalent explicit level observations have equivalent
      semantic behavior regardless of builder insertion order, collection
      iteration order, or diagnostic metadata, without requiring a public
      iteration-order guarantee.
    sources: [api-atomic-input, delta-artifact]

  - id: requires-prior-authoritative-valuation
    kind: lifecycle
    statement: >-
      InputDelta expresses changes relative to the valuation held by a Ready
      machine and is invalid before initialization, where no prior authoritative
      external valuation exists. This lifecycle rejection is enforced when a
      transaction is applied, not proven by artifact construction alone.
    sources: [api-delta, runtime-first-transaction, lifecycle-diagnostic-codes]

implementation_freedom:
  - The private builder and artifact storage, read-only inspection surface, and reuse or extension of InputBuildFailure are unconstrained when identity binding and diagnostic distinctions remain exact.
  - The restricted level-only artifact may use any deterministic stable-keyed representation; neither public iteration order nor a particular equality implementation is required.
  - Private input-plan representation is free; one set observation operation supplies both preserved and new Levels, and runtime revision remains a transaction responsibility.

open_questions: []

