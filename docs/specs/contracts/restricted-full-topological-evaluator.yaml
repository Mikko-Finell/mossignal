schema_version: "0.1"
id: mossignal.runtime.restricted_full_topological_evaluator
title: Restricted full topological evaluator
kind: artifact
status: reviewed

source_baseline:
  commit: 117efa6c4be1867df974f36174032a025a47e14f
  working_tree: dirty

summary: >-
  The restricted full topological evaluator is the clear reference execution
  path for an immutable compiled Constant/Not network. For one supplied set of
  external level facts, it settles every compiled reaction operation exactly
  once in deterministic topological order.

scope:
  includes:
    - one-reaction full evaluation of the restricted compiled Constant/Not topology
    - external level facts, node-operation laws, node-output propagation, and external-output observation
    - deterministic predecessor-respecting topological execution
  excludes:
    - Machine lifecycle, initialization, transactions, and atomic publication
    - snapshots, input completeness validation, deltas, and runtime policy
    - pulse values, stateful or temporal node behavior, events, diagnostics, and provenance
    - incremental dirty evaluation and optimized worklists

aliases:
  - full reference evaluator
  - full topological reaction evaluator
  - Constant/Not evaluator

requirements:
  - id: compiled-immutable-input
    kind: lifecycle
    statement: >-
      Evaluation operates over the immutable compiled topology and must not own
      or mutate machine state. Its execution positions remain private to the
      compiled revision rather than public identity.
    sources: [compiled-topology, compiled-program]

  - id: external-level-facts
    kind: semantic
    statement: >-
      In the represented level-only boundary, external inputs are reaction root
      facts supplied by the caller and external outputs observe their authored
      internal source without transformation or consumption.
    sources: [reaction-graph, external-boundaries]

  - id: deterministic-complete-topological-settlement
    kind: semantic
    statement: >-
      One full reference reaction processes every compiled reaction operation
      exactly once in valid deterministic topological order. Each operation
      runs only after all affected predecessors have reached their final
      current-reaction values. The selected order is not semantic: every valid
      topological order produces equivalent settled results.
    sources: [full-evaluation, glitch-freedom, reference-evaluator, topological-order]

  - id: constant-and-not-laws
    kind: semantic
    statement: >-
      A Constant has no inputs and yields its configured LogicLevel. A Not has
      one level input and yields its logical complement; level semantics use
      LogicLevel rather than raw bool.
    sources: [constant, not, logic-level]

  - id: reference-path-verification
    kind: verification
    statement: >-
      The project retains a simple full topological evaluator that performs no
      dirty-closure pruning and serves as the correctness oracle for future
      incremental reaction evaluation. It must be tested directly against node
      laws and hand-authored multi-node examples, including the exactly-once
      predecessor-settlement property.
    sources: [reference-evaluator, reaction-verification]

implementation_freedom:
  - The evaluator and result type may remain crate-private or test-oriented; this slice creates no new general public runtime API.
  - Input storage may use straightforward deterministic key or compiled-operation mappings; input-snapshot validation belongs to a later slice.
  - Result storage may expose only terminal outputs or retain intermediate settled results for test inspection; the specifications do not require a particular result interface.
  - The first implementation may favor auditable direct traversal and test-only intermediate result storage over allocation, caching, or incremental-work optimization.

open_questions: []

