schema_version: "0.1"
id: mossignal.identity.opening_fingerprint_projection
title: Opening fingerprint projection baseline
kind: concept
status: reviewed

source_baseline:
  commit: e735a54ee33851d059d636c438063bff5b0e9fec
  working_tree: clean

summary: >-
  Fingerprint-domain version 1 remains a development projection until an
  explicit decision names the frozen projection and its supported artifact
  boundary. The opening projection now has exact development-projection
  records in sections 54.2 and 55. Writing those records does not record the
  decision.

scope:
  includes:
    - opening extension boundary for the version-1 network and module contributions whose exact development-projection records are sections 54.2 and 55
    - in-place development-projection synchronization before the named stabilization decision
    - distinction between that synchronization and the named stabilization decision
    - successor-version, digest-suite, and schema-only consequences for fingerprint projections
    - exclusions the opening extension must retain
    - golden-vector obligations for that extension
  excludes:
    - exact foundation records already fixed for the section 54.2 node family
    - the pre-stability rule already represented for that foundation by the network fingerprint contract
    - exact input-schema payload records already fixed by section 54.3
    - per-node laws and semantic-identity facet lists owned by the applicable node contracts
    - standard-module fingerprint field lists and expansion-fingerprint contents owned by the catalogue specification
    - section 55 payload details and validated module ownership owned by the module fingerprint contract
    - RuntimePolicyId construction
    - execution-state, observable-state, and snapshot digests
    - snapshot encoding, restoration, replay, and topology-patch artifacts
    - catalogue release freeze and descriptor migration
    - node kinds outside the section 64 inventory, including hypothetical future kinds
    - compatibility promises for private dense representation

known_uncovered:
  - Post-stabilization historical fingerprint readers and upgraders
  - Execution-state, observable-state, and snapshot digest projections

aliases:
  - opening fingerprint projection
  - fingerprint-domain version 1

requirements:
  - id: opening-contribution-boundary
    kind: semantic
    statement: >-
      The version-1 opening network projection includes PulseSetResetLatch,
      LevelSetResetLatch, SampleHold, TransportDelay, InertialDelay, and
      Periodic, using the exact section 54.2 kind, role, parameter, state-schema,
      and temporal-schema records. It also includes the exact section 54.2
      module-instance and hierarchy records and the exact section 55 module
      record for user and standard modules. For each of those kinds it includes
      the section 54.1 contributions of stable kind, typed port keys and semantic
      roles, semantic parameters, state schemas, declared initial state, and
      signal-semantics and timing parameters. The module record includes the
      module interface keys and module-internal stable identity required of a
      module fingerprint.
      Standard module fingerprints use that section 55 record, so catalogue
      fingerprint contributions apply only where the record retains them.
      Primitive aliases and builder-only operations contribute only as the
      ordinary primitives they author. The standard expansion fingerprint
      remains the distinct catalogue domain
      mossignal/standard_module_expansion_fingerprint/v1 and is not a network
      or module fingerprint domain or field.
    sources:
      - network-projection
      - primitive-inventory
      - primitive-aliases
      - builder-only-operations
      - primitive-alias-visibility
      - module-fingerprint
      - standard-fingerprints
      - domain-separation
    basis: derived

  - id: synchronized-development-extension
    kind: semantic
    statement: >-
      Until the named stabilization decision, fingerprint-domain version 1 is
      a development projection. An accepted extension or correction may update
      that projection in place, without adding a successor domain, historical
      reader, upgrader, or migration path. The same change updates the exact
      projection specification, the applicable fingerprint contract, and every
      affected golden vector together. Unreviewed or accidental byte drift is
      prohibited. Fields added by such a change are schema-defined lowercase
      ASCII snake_case, appear at most once, appear exactly once when
      required, and use ascending raw UTF-8 byte order of the field name.
      Optional absent fields are omitted unless the schema explicitly requires
      null. New closed enums use schema-defined lowercase ASCII snake_case
      variant names rather than discriminants, debug text, or source
      declaration position.
    sources: [fingerprint-versions, records, variants, canonical-enums]
    basis: derived

  - id: named-stabilization-decision
    kind: compatibility
    statement: >-
      Synchronizing the opening projection does not record the first stable
      fingerprint compatibility baseline. That baseline exists only when an
      explicit decision names the frozen projection and its supported artifact
      boundary. The decision is distinct from the catalogue release-readiness
      decision and does not freeze catalogue inventory or descriptor versions.
    sources: [fingerprint-versions, catalogue-version]
    basis: derived

  - id: successor-version-selection
    kind: compatibility
    statement: >-
      After the named baseline, a change to a frozen canonical fingerprint
      projection advances its domain version rather than altering the frozen
      bytes in place. Except for an in-place fingerprint-domain version 1
      update before that baseline, a change to canonical semantic projection
      requires a new domain version or digest suite version. A schema-only
      representation change need not change a semantic fingerprint when the
      semantic projection, digest suite, and digest-domain version remain
      unchanged. A canonical-encoding change may
      preserve semantic fingerprints only when they use an unchanged
      independent semantic projection and digest-domain version. A new digest
      suite places old and new digests in distinct namespaces, and they must
      never be compared as one namespace.
    sources:
      - fingerprint-versions
      - digest-version-inputs
      - digest-suite-change
      - canonical-encoding-change
    basis: derived

  - id: retained-exclusions
    kind: prohibition
    statement: >-
      The opening extension preserves the exclusions already required of
      network and module fingerprints. Both continue to exclude topology
      revision, dense indices, construction and insertion order, memory layout,
      private or compiled caches, and presentation-only diagnostic metadata,
      including names, descriptions, paths, origin metadata, tags, and
      extensions. The version-1 network projection also continues to exclude
      selected topological order, SCC data, cycle witnesses, derived
      reaction-operation identity, and TopologyPatchSemanticsVersion, and
      validation-derived private data must not affect its bytes. A module
      fingerprint continues to exclude that module's own instance key,
      placement, bindings, and metadata, and the containing network's
      identity. Nested instances inside the definition remain in its payload.
      Metadata remains excluded from network and module fingerprints unless a
      future field is explicitly reclassified as semantic.
    sources: [network-projection, restricted-projection, module-fingerprint, metadata]

  - id: opening-golden-vectors
    kind: verification
    statement: >-
      Representative version-1 network-fingerprint golden vectors retain the
      complete canonical digest-input bytes and the expected 32-byte result,
      including the hand-reviewed restricted cases required by the verification
      policy. An accepted opening-extension change updates every affected
      golden vector in that same change. The golden change is deliberate:
      either the bytes are proven semantically equivalent under a new encoding
      version, or the reviewed projection update is the explicit break of the
      previous development bytes. Before the named baseline, that break does
      not record the stabilization decision and does not add a successor
      domain.
      Execution-state, observable-state, snapshot, replay, patch, and
      runtime-policy vectors are outside this subject.
    sources: [restricted-fingerprint-verification, canonical-encoding-vectors, fingerprint-versions]
    basis: derived

implementation_freedom:
  - The section 54.2 and section 55 opening records are the version-1 development projection. Private encoder decomposition remains unconstrained when the canonical bytes and public opaque fingerprints agree. Do not invent a second spelling or a second fingerprint domain for the same network or module identity.

open_questions: []

