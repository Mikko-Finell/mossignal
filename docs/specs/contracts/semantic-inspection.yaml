schema_version: "0.1"
id: mossignal.inspection.semantic_projection
title: Owned semantic inspection
kind: artifact
status: reviewed
source_baseline:
  commit: 6063ae23cdd6f5795e76a80f1276daa996bd6127
  working_tree: dirty
summary: >-
  Inspection projects a complete committed machine version into owned stable
  observations without affecting execution. Definition facts remain available
  before initialization, separately from ready-only runtime facts.
scope:
  includes:
    - direct node, output, pending-work, and module observations
    - ownership, lifecycle, and distinctions between state and history
    - ownership and lifetime of causal observation artifacts
  excludes:
    - stable query builders, compiled plans, subscriptions, and rendering
    - diagnostic lifecycle laws and causal explanation derivation
    - module public/expanded correspondence owned by module-aware-execution and standard-catalogue-foundation
aliases: [NodeInspection, OutputInspection, PendingEventInspection]
requirements:
  - id: definition-versus-runtime
    kind: lifecycle
    statement: >-
      Definition and structural inspection are available before initialization.
      Runtime reads requiring settled values, pending work, active diagnostics,
      schedules, or explanations fail structurally as not initialized then.
    sources: [api-inspection, concrete-lifecycle]
  - id: complete-owned-observation
    kind: public_surface
    statement: >-
      Canonical inspection results are owned and identify observed revision and
      logical time where applicable. Node inspections expose applicable stable
      identity, kind, current levels, declared and stored state, latest transition,
      pending events and deadlines, causal justification, active conditions,
      metadata, containment, region, and checkpoint boundary.
    sources: [api-node, concrete-owned]
  - id: state-versus-history
    kind: semantic
    statement: >-
      Inspection distinguishes current persistent levels, internal stored state,
      pending future work, active conditions, current support, latest transition
      cause, and explicitly retained reaction history. Pulses have no persistent
      current value after their reaction completes.
    sources: [api-node, concrete-owned]
  - id: retained-cause-ownership
    kind: public_surface
    statement: >-
      An owned observation artifact exposing cause references retains a provenance
      view sufficient to resolve them even after the machine changes or compacts
      later history. A cause reference is meaningful only with its owning machine
      or artifact; it does not expose a private arena index as durable identity.
    sources: [concrete-causes]
  - id: temporal-work-observation
    kind: public_surface
    statement: >-
      Temporal inspection exposes applicable pending identities, origins,
      deadlines, payloads or targets, multiplicity, cancellation and migration
      policy, causal ancestry, and the next eligible deadline. Canceled work is
      absent from pending work; any retained cancellation history stays historical.
    sources: [node-temporal-inspection]
  - id: pure-committed-projection
    kind: semantic
    statement: >-
      Reads observe one complete committed version and do not change execution,
      scheduling, migration, fingerprints, provenance, or semantic digests.
    sources: [runtime-projection]
  - id: inspection-purity-verification
    kind: verification
    statement: >-
      Verification compares machine digests and complete semantic observations
      before and after applicable direct inspection, explanation, and graph reads.
    sources: [testing-purity]
recommendations:
  - id: direct-and-forecast-reads
    statement: >-
      Provide direct node, output, and pending-event methods, typed built-in
      variants, and equivalent read-only methods on ForecastState.
    sources: [api-direct, api-node, concrete-direct]
implementation_freedom:
  - Representation and convenience names remain open provided equivalent semantic information and owned causal access are preserved.
open_questions: []
