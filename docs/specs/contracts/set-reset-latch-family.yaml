schema_version: "0.1"
id: mossignal.node.set_reset_latch_family
title: Set/reset latch primitive family
kind: family
status: reviewed

source_baseline:
  commit: bc39319ad596752b53380445d26bc5b98f51635a
  working_tree: dirty

summary: >-
  PulseSetResetLatch and LevelSetResetLatch are fixed-shape Boolean stored-level
  primitives sharing one explicit conflict-policy vocabulary while differing in
  control signal kind and in whether a retained conflict is a transient runtime
  occurrence or a persistent diagnostic episode.

scope:
  includes:
    - shared conflict policy, explicit initial state, fixed port shapes, and state laws
    - pulse-presence and settled-level control semantics
    - typed and dynamic authoring, validation, compilation, inspection, provenance, identity, and conformance
    - exact retained-conflict and rejected-conflict diagnostic classifications
  excludes:
    - the general runtime-occurrence representation and successful-result publication path
    - persistent diagnostic episode representation, identity, storage, lifecycle, and publication
    - SampleHold, resettable standard modules, counters, and arbitrary state machines
    - snapshot encoding, replay, topology migration, and reconfiguration implementation

known_uncovered:
  - Canonical snapshot and restoration schema for latch stored state
  - Compatible latch-state and level-conflict-episode migration across topology changes
  - The reusable persistent diagnostic episode contract needed by LevelSetResetLatch

aliases:
  - PulseSetResetLatch
  - LevelSetResetLatch
  - ConflictPolicy
  - PulseSetResetConfig
  - LevelSetResetConfig

requirements:
  - id: fixed-shapes-and-shared-policy
    kind: public_surface
    statement: >-
      PulseSetResetLatch has fixed Pulse set and reset inputs, LevelSetResetLatch
      has fixed Level set and reset inputs, and each has one Level output and one
      stored LogicLevel cell. PulseSetResetConfig and LevelSetResetConfig each
      contain an explicit initial LogicLevel and the same ConflictPolicy value,
      whose closed cases are SetDominant, ResetDominant, RetainAndDiagnose, and
      RejectTransaction.
    sources: [pulse-latch, level-latch, concrete-config]

  - id: pulse-control-law
    kind: semantic
    statement: >-
      PulseSetResetLatch treats a positive complete simultaneous count as control
      presence. Set alone produces and proposes High, reset alone produces and
      proposes Low, neither retains the previous state, and multiplicity beyond
      presence does not change that latch law. Complete counts remain available
      for structured conflict evidence, and grouped causal provenance preserves
      every contributor without inventing ordered pulse identities.
    sources: [simultaneous-batches, pulse-latch, conflict-evidence, pulse-provenance]

  - id: level-control-law
    kind: semantic
    statement: >-
      LevelSetResetLatch uses fully settled current controls. High/Low produces
      and proposes High, Low/High produces and proposes Low, Low/Low retains the
      previous state, and High/High applies the shared conflict policy. Continuous
      High/High under RetainAndDiagnose is one persistent condition rather than
      repeated transient warnings.
    sources: [current-time-controls, level-latch, diagnostic-occurrences-and-episodes]

  - id: exact-conflict-outcomes
    kind: semantic
    statement: >-
      For either latch, SetDominant produces and proposes High, ResetDominant
      produces and proposes Low, RetainAndDiagnose produces and proposes the
      previous state while delivering the condition in the signal-kind-specific
      form, and RejectTransaction rejects the containing transaction atomically.
    sources: [simultaneous-batches, pulse-latch, level-latch, settlement]

  - id: occurrence-versus-episode-delivery
    kind: lifecycle
    statement: >-
      A retained pulse conflict emits exactly one reaction-scoped occurrence
      using runtime.pulse_latch_conflict_retained. A retained level conflict uses
      runtime.level_latch_conflict_retained as a persistent episode that does not
      repeat unchanged warnings. Rejected pulse and level conflicts use their
      respective runtime.*_latch_conflict_rejected operation-failure codes.
    sources: [diagnostic-occurrences-and-episodes, pulse-latch, level-latch, runtime-codes]

  - id: previous-proposed-and-immediate-visibility
    kind: semantic
    statement: >-
      Declared initial state is the previous committed state for initialization.
      Each reaction reads one previous stored level, exposes the settled current
      output downstream in that reaction, and stages at most one successor that
      commits only after complete successful settlement. Both control inputs are
      conservative current-input-to-output dependencies; statefulness does not
      break those instantaneous paths.
    sources: [dependency-signatures, machine-initialization, pulse-latch, level-latch, settlement]

  - id: typed-dynamic-and-module-authoring
    kind: public_surface
    statement: >-
      NetworkBuilder exposes typed pulse_set_reset_latch and
      level_set_reset_latch constructors plus explicit keyed add_* forms. Dynamic
      definitions use the corresponding closed NodeKind variants and exact
      configuration values. ModuleBuilder must offer the same primitive family
      through ordinary module-local typed signals rather than a parallel node law.
    sources: [constructor-family, module-builder, dynamic-node-kind]

  - id: validation-compilation-and-semantic-state
    kind: semantic
    statement: >-
      Structural validation enforces each latch's exact roles and signal kinds,
      and compilation preserves stable subject correspondence, kind, policy,
      initial state, current dependencies, and one correctly typed Boolean
      stored-state cell without exposing dense slots. Changing an initial value
      or conflict policy does not overwrite an already preserved stored level.
    sources: [pulse-latch, level-latch, dependency-signatures, boolean-state-reconfiguration, runtime-compilation, runtime-invariants, previous-and-proposed-state]

  - id: semantic-identity-facets
    kind: semantic
    statement: >-
      Network semantic identity includes the latch kind, stable typed set and
      reset roles, explicit initial level, conflict policy, and one-cell stored-
      level state schema. It excludes construction order, dense state-slot
      assignment, memory layout, and other private compiled representation.
    sources: [pulse-latch, level-latch, concrete-config, network-fingerprint, runtime-fingerprint]

  - id: inspection-provenance-and-evidence
    kind: system_effect
    statement: >-
      Applicable inspection distinguishes declared initial state from committed
      stored level and exposes the node kind, policy, settled controls and output,
      current supporters or blockers, and latest state-establishing cause. Conflict
      evidence identifies the stable node subject, policy, previous state, exact
      controls or pulse counts, logical time, and revision without relying on
      rendered prose or private positions; pulse causal support retains grouped
      contributor identity and count separately from that evidence payload.
    sources: [explanations-and-causes, node-inspection, conflict-evidence, pulse-provenance]

  - id: latch-conformance
    kind: verification
    statement: >-
      Conformance exhausts both previous levels, all four simultaneous control
      presence or level combinations, and all four policies. Pulse coverage
      includes zero, one, two, and a larger representable count while proving the
      presence-only law and exact conflict evidence. The applicable reusable node
      suite covers lifecycle phases, current dependency and output/successor laws,
      same-reaction downstream visibility, deterministic validation and semantic
      identity, inspection and causal support, occurrence-versus-episode
      classification, structured rejection, and complete failure atomicity.
    sources: [testing-lifecycle, testing-pulse-algebra, testing-current-state, testing-common-conformance, testing-primitive, testing-stateful-chain, testing-conflict-policies, testing-compilation, testing-failure-atomicity, testing-diagnostics]

implementation_freedom:
  - Private descriptor fields, state-slot widths, stored-level table organization, staging helpers, and evaluator dispatch remain free when the shared laws and stable semantic correspondence are preserved.
  - The semantic-family storage recommendation does not require Toggle, latches, and SampleHold to use one physical table; sharing or separating private LogicLevel storage remains a deterministic implementation choice.
  - The exact rule for refreshing a stored-level cause when a control requests the already-stored value may use the simplest deterministic conforming model; implementation must test and record the choice without treating it as a compatibility promise.
  - Focused owned latch inspection may precede the broader generic inspection and explanation system.

open_questions: []

