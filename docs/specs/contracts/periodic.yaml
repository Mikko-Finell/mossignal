schema_version: "0.1"
id: mossignal.node.periodic
title: Periodic logical-time pulse primitive
kind: node
status: reviewed

source_baseline:
  commit: aa1186b2f12dc2136a8c43bffed61eda8fba4c84
  working_tree: dirty

summary: >-
  Periodic is a fixed Level-controlled temporal primitive that uses an exact
  logical-time phase and emits one Pulse at each eligible boundary under
  explicit first-emission and re-enable policies.

scope:
  includes:
    - fixed Level-enable to Pulse shape and closed semantic configuration
    - anchor, previous-enable, and optional-next-boundary temporal state
    - first enable, disable, re-enable, and exact-boundary behavior
    - recurring calendar work, chronological advancement, and causal inspection
    - typed/dynamic authoring, validation, compilation, identity, and conformance
  excludes:
    - wall-clock, cron, callback, thread, sleep, polling, and autonomous advancement behavior
    - topology replacement and period or policy migration
    - generic timer handles, snapshot/replay APIs, and optimized calendar structures
    - temporal standard modules built from Periodic

known_uncovered:
  - Explicit Periodic migration policies for an existing anchor or next boundary
  - Snapshot restoration, replay, and digest encoding of periodic state and work
  - Generic pending-event queries, subscriptions, and complete explanation rendering

aliases:
  - Periodic
  - PeriodicConfig<D>
  - FirstEmissionPolicy
  - ReenablePhasePolicy
  - periodic boundary

requirements:
  - id: fixed-shape-and-configuration
    kind: public_surface
    statement: >-
      Periodic has exactly one Level input with semantic role `enable`, one Pulse
      output, a positive NonZeroSpan<D> period, a FirstEmissionPolicy of
      Immediate or AfterFirstPeriod, and a ReenablePhasePolicy of RestartPhase
      or PreservePhase. PeriodicConfig<D> contains those semantic values and no
      metadata or runtime state. Typed convenience and explicit keyed builders
      expose the primitive, and dynamic definitions preserve its distinct
      semantics within the closed, non-callback node-kind family.
    sources: [builtin-law, concrete-config, concrete-builders, concrete-node-kind]

  - id: fresh-initialization
    kind: lifecycle
    statement: >-
      A fresh Periodic has no phase anchor, previous enabled observation, or
      next boundary. A first settled Low enable leaves it anchorless and emits
      nothing. The first settled High enable establishes the anchor at its
      reaction time, including when initialization was disabled. At enabled
      initialization, Immediate may emit once directly in that reaction;
      AfterFirstPeriod schedules the first boundary one full period later.
      PreservePhase has no earlier phase to preserve before this first anchor.
    sources: [builtin-initialization, builtin-law, runtime-initialization, verification-initialization]

  - id: enable-and-phase-state
    kind: semantic
    statement: >-
      Every reaction proposes settled current enable as the next remembered
      enable value. A disabled-to-enabled transition under RestartPhase creates
      a new anchor at that reaction time; Immediate emits once in the enabling
      reaction and AfterFirstPeriod waits one period. PreservePhase retains an
      existing anchor while disabled and resumes its cadence on re-enable.
      Disabling removes the eligible scheduled boundary; disabled phase
      boundaries emit nothing, do not accumulate, and are never replayed.
    sources: [builtin-law, api-periodic, periodic-migration]

  - id: exact-phase-boundaries
    kind: semantic
    statement: >-
      For anchor A and positive period P, boundaries are A + n*P for
      non-negative ordinal n admitted by the active policies. Each eligible
      boundary emits exactly one Pulse in the reaction at that time; boundaries
      sharing a time participate in one simultaneous batch. An enabled emitted
      boundary schedules the next strictly future
      ordinal. Boundaries at different times are never collapsed into one later
      multiplicity; ordinary same-reaction Pulse algebra combines other causes
      that reach the same output at the same boundary.
    sources: [builtin-law, builtin-pending-events, periodic-event-record, strict-future]

  - id: preserved-phase-reenable
    kind: semantic
    statement: >-
      With an existing preserved anchor, re-enable between phase boundaries
      schedules the next boundary under either first-emission policy. Re-enable
      exactly on a phase boundary permits that boundary under Immediate, while
      AfterFirstPeriod waits for the next boundary strictly after re-enable.
      Missed disabled boundaries remain unobservable.
    sources: [builtin-law]

  - id: same-time-enable-dependency
    kind: semantic
    statement: >-
      Periodic has a conservative current-reaction dependency from enable and a
      due boundary to Pulse output. A boundary due at T is controlled by fully
      settled enable at T: Low suppresses it; High permits it according to the
      phase and first-emission rules. This instantaneous enable path participates
      in ordinary current-reaction cycle validation even though future boundary
      scheduling remains a temporal terminal effect.
    sources: [builtin-dependencies, builtin-law, runtime-causality, runtime-exact-deadline]

  - id: machine-owned-recurring-work
    kind: system_effect
    statement: >-
      At most one next eligible Periodic boundary is represented as machine-owned
      pending work for a node. Its public record retains stable event identity,
      owner, exact deadline, phase anchor, non-negative boundary ordinal,
      originating time, revision, causal origin, and applicable policy. After
      firing, that record is no longer pending and an enabled node has its next
      eligible boundary scheduled; disabling leaves no Periodic work that can
      fire or determine the machine's next deadline.
    sources: [builtin-pending-events, builtin-law, periodic-state-schema, periodic-event-record]

  - id: chronological-runtime-and-budgets
    kind: system_effect
    statement: >-
      Direct advancement evaluates distinct eligible deadlines strictly before
      target T chronologically as internal reactions; boundaries due exactly at
      T join the target-time input batch. It yields the same one-pulse sequence
      at actual boundary times as stepwise advancement.
      Checked time arithmetic and existing limits for internal reactions,
      evaluated operations, pending events, created events, and provenance apply
      before one atomic publication; budget exhaustion or overflow rejects the
      complete outer transaction rather than skipping or coalescing boundaries.
    sources: [builtin-law, runtime-advancement, runtime-jump, runtime-atomic, runtime-preparation, runtime-policy-source, verification-time, verification-periodic]

  - id: focused-inspection-and-provenance
    kind: public_surface
    statement: >-
      Structural inspection exposes Periodic's configuration before machine
      initialization. Ready focused inspection distinguishes current enable,
      remembered enable, optional phase anchor, optional next eligible boundary,
      observed time and revision, schedule, and causal justification. Pending
      facts expose stable identity, anchor, ordinal, origin, deadline, policies,
      and causal ancestry. Provenance distinguishes settled enable, anchoring,
      due obligations, future scheduling, and cancellation. An emission retains
      its applicable enabling or anchoring cause and any due boundary that
      contributes; an immediate enabling emission does not require a prior
      pending event. Canceled work is absent from pending inspection, and its
      cancellation is explicit and inspectable without requiring retained history.
    sources: [builtin-law, builtin-causes, builtin-pending-events, builtin-inspection, builtin-temporal-inspection, api-inspection, periodic-event-record, runtime-provenance]

  - id: semantic-identity
    kind: semantic
    statement: >-
      Network semantic identity includes Periodic's distinct node kind, typed
      enable and output roles, positive period, both closed policies, and its
      anchor/previous-enable/next-boundary state and periodic-boundary temporal
      schemas. Runtime anchor values, boundary ordinals, pending keys, private
      positions, allocation order, and presentation metadata do not contribute.
    sources: [api-fingerprint, network-fingerprint-source, periodic-state-schema, periodic-event-record]

  - id: periodic-conformance
    kind: verification
    statement: >-
      Temporal conformance covers both first-emission policies crossed with both
      re-enable policies, fresh and previously anchored state, and enable changes
      strictly before, exactly at, and after a boundary. It also covers disabled
      suppression without accumulation, arbitrary initial times, non-unit
      periods, checked overflow, strictly future pending work, exact one-pulse
      emissions, stable inspection and causes, equal-deadline interaction,
      direct-jump versus stepwise equivalence, runtime-budget boundaries, and
      complete failure atomicity. Budget tests cover one below, exactly at,
      and one above each implemented limit where representable; rejected
      transactions are compared against complete pre-transaction observations.
      Pending and emitted facts must have causal paths to authoritative roots.
      Authoring, module-wrapped, identity, and
      permutation coverage remains owned by their applicable contracts.
    sources: [verification-initialization, verification-time, strict-future, verification-batching, verification-triad, verification-periodic, verification-budgets, verification-budget-atomicity, verification-atomicity, verification-roots]

implementation_freedom:
  - The implementation may retain the anchor and ordinal directly or derive one from other exact periodic state, provided inspection and every boundary remain exact and deterministic.
  - Disabled PreservePhase may calculate the next eligible ordinal arithmetically when re-enabled rather than scheduling work for missed disabled boundaries; checked arithmetic and no-replay behavior must remain observable.
  - Choose the simplest deterministic public event allocation and provenance-supporter ordering where specifications leave order open, test it, and record the concrete choice.
  - Focused inspection representation is unconstrained provided configuration, committed state, pending facts, and causal facts remain distinguishable.

open_questions: []

