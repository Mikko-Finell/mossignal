schema_version: "0.1"
id: mossignal.node.pulse_combinational_expansion
title: Remaining pulse-combinational primitive family
kind: family
status: reviewed

source_baseline:
  commit: ee3b3aa0ff65dfb50f1e684f42ba514e2135cc8f
  working_tree: dirty

summary: >-
  Coalesce and Zip complete the initial pulse-combinational primitive family:
  Coalesce bounds one input batch to presence, while Zip forms the maximum
  number of simultaneous all-input groups without retaining unmatched pulses.

scope:
  includes:
    - Coalesce and Zip port shapes, arity domains, and pulse-multiplicity laws
    - typed and dynamic authoring, structural validation, and quality findings
    - current-reaction causality, compilation, settlement, and grouped provenance
    - bounded conformance and pre-stability network-fingerprint integration
  excludes:
    - Merge and general reaction-scoped Pulse infrastructure
    - level-controlled Pulse, stateful, and temporal primitive families
    - payload transport, persistent Pulse state, and pending-event scheduling
    - persistence codecs, topology-patch execution, and general explanation rendering

known_uncovered:
  - Exact current inspection, explanation, and why-not projections for grouped pulse transformations
  - Topology-patch compatibility and persistence representation beyond network fingerprinting

aliases:
  - Coalesce
  - Zip
  - pulse presence bound
  - simultaneous pulse grouping

requirements:
  - id: coalesce-unary-law
    kind: semantic
    statement: >-
      Coalesce is a stateless combinational node with exactly one Pulse input
      and one Pulse output. In each reaction it maps zero to zero and every
      positive representable input count to exactly one, without retaining a
      count between reactions.
    sources: [coalesce-law, pulse-semantics]

  - id: coalesce-retains-causal-support
    kind: system_effect
    statement: >-
      Coalescing multiplicity to one does not discard causal support: every
      contributing cause represented by the complete input batch remains
      available in the output derivation without inventing ordered pulse
      identities.
    sources: [coalesce-law, pulse-provenance]

  - id: zip-group-law
    kind: semantic
    statement: >-
      Zip is a stateless combinational node with one or more stable Pulse input
      ports and one Pulse output. Its reaction-local output count is the minimum
      complete input count, so each output occurrence represents one joint group
      containing one occurrence from every input port. Unary Zip is the identity;
      zero-input Zip is invalid because it has no finite natural result.
    sources: [zip-law, variadic-inputs]

  - id: zip-port-identity-and-reaction-isolation
    kind: semantic
    statement: >-
      Zip preserves independent stable identity for every input port. Port
      permutation cannot change its commutative minimum, and repeated use of one
      source on distinct ports remains port-based because fan-out copies the
      complete count. Counts above the minimum are unmatched and expire with the
      reaction rather than becoming state or future work.
    sources: [zip-law, variadic-inputs, duplicate-sources, pulse-fanout, simultaneous-batches]

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      NetworkBuilder and ModuleBuilder expose direct typed Coalesce construction
      from one Signal<Pulse>, immediately consumed variadic Zip construction
      from an IntoIterator of Signal<Pulse>, and an explicit keyed form for each
      node. Dynamic authored definitions represent the closed Coalesce and Zip
      node kinds with stable typed ports and ordinary connections.
    sources: [builder-style, builder-keyed, constructor-family, module-builder, dynamic-node-kind, dynamic-ports]

  - id: structural-validation-and-findings
    kind: system_effect
    statement: >-
      Structural validation enforces Coalesce's one-input/one-output fixed shape
      and Zip's nonempty variadic input domain with one Pulse output, using the
      applicable signal-kind, missing-input, fixed-arity, and variadic-arity
      conditions. A valid unary Zip produces the non-blocking unary-degenerate
      finding without suppressing its artifact.
    sources: [coalesce-law, zip-law, validation-blocking, validation-advisories, diagnostic-reports]

  - id: causality-compilation-and-settlement
    kind: semantic
    statement: >-
      Coalesce's input and every Zip input conservatively influence the output
      in the current reaction. Validation, cycle analysis, and compilation
      retain those stable incidences in an acyclic dependency graph, and full
      topological settlement evaluates each complete simultaneous batch only
      after all predecessors settle, without traversal-order intermediates.
    sources: [dependency-signature, reaction-graph, compiled-invariants, full-evaluation]

  - id: bounded-checked-count-results
    kind: semantic
    statement: >-
      For representable PulseCount inputs, Coalesce and Zip always produce a
      representable result no greater than their applicable input count or
      counts; neither node introduces a local addition-overflow path. Any
      upstream structured pulse-arithmetic rejection still rejects the complete
      containing transaction atomically through the shared pulse foundation.
    sources: [coalesce-law, zip-law, pulse-count, pulse-algebra, failure-atomicity]
    basis: derived

  - id: joint-group-provenance
    kind: system_effect
    statement: >-
      Zip provenance represents unordered joint support from every input port,
      recording grouped contribution counts and result multiplicity without
      ordered pulse identities. Permuting supporter representation while
      preserving supporter identity, contribution count, and joint grouping
      yields equivalent normalized derivations, and unmatched occurrences do
      not become retained pulse state.
    sources: [zip-law, causal-structure, pulse-provenance, joint-support]

  - id: pre-stability-fingerprint-extension
    kind: compatibility
    statement: >-
      NetworkFingerprint must distinguish Coalesce and Zip from every other node
      kind and retain their stable typed ports and connection incidence. Before
      the first frozen fingerprint baseline, the accepted implementation may
      extend the current canonical projection in place, but the authoritative
      projection, implementation, and golden vectors must be synchronized in
      one coherent revision.
    sources: [network-fingerprint, restricted-fingerprint, fingerprint-versions, deterministic-compilation]
    basis: derived

  - id: primitive-conformance
    kind: verification
    statement: >-
      Each node requires reusable built-in conformance coverage for every
      applicable matrix field. Focused pulse-algebra tests cover zero, one, two,
      and a larger representable count; fan-out and duplicate sources; Coalesce's
      positive-count bound; Zip's minimum law and lack of cross-reaction
      retention; and applicable checked-failure atomicity. Zip joint-support
      tests permute supporter representation while preserving supporter identity,
      contribution counts, and grouping and require equivalent normalized
      explanations.
    sources: [pulse-algebra, node-conformance, conformance-matrix, joint-support]

recommendations:
  - id: zip-duplicate-source-advisory
    statement: >-
      Repeated use of one source on distinct Zip ports should produce the
      non-blocking duplicate-source finding while preserving independent
      port-based grouping.
    sources: [duplicate-sources, validation-advisories]

implementation_freedom:
  - Private descriptors, comparison strategy, pulse-slot access, evaluator dispatch, and grouped-provenance storage are free when they preserve exact stable incidences and deterministic complete-batch laws.
  - Locally allocated Zip ports use the simplest deterministic iterator-based rule selected, tested, and recorded during implementation; the explicit keyed path remains available for exact durable reconstruction.
  - Exact pre-stability canonical variant spellings for Coalesce and Zip are selected deterministically and synchronized with authority and goldens during implementation; no historical migration or compatibility shim is required before a declared freeze.

open_questions: []

