schema_version: "0.1"
id: mossignal.node.level_combinational_expansion
title: Remaining level-combinational primitive family
kind: family
status: reviewed

source_baseline:
  commit: 9a489c4c66354430be9e7068247196fac732a954
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md
    - docs/testing_and_verification_policy.md

summary: >-
  Any, Parity, AtLeast, and Select complete the initial level-combinational
  primitive family using the established authored graph, typed builder,
  validation, dependency, compilation, settlement, and fingerprint boundaries.

scope:
  includes:
    - total level laws and port shapes for Any, Parity, AtLeast, and Select
    - typed and dynamic authoring, structural validation, and quality advisories
    - conservative dependency signatures, compilation, and full settlement
    - bounded primitive conformance and pre-stability fingerprint representation
  excludes:
    - composed adders and reusable cross-topology equivalence harnesses
    - explanation and provenance rendering
    - pulse, stateful, temporal, module, persistence-decoding, and reconfiguration work

known_uncovered:
  - Explicit durable reconstruction policy for individual locally allocated variadic ports beyond the optional keyed builder forms
  - Current explanation and why-not rendering for the four primitives

aliases:
  - Any
  - Parity
  - AtLeast
  - Select
  - remaining level-combinational primitives

requirements:
  - id: any-total-law
    kind: semantic
    statement: >-
      Any has zero or more level inputs and one level output, yielding High if
      and only if at least one input is High. Any([]) is Low and Any([x]) is x;
      both arities are valid rather than blocking structural errors.
    sources: [any-law, total-semantics]

  - id: parity-total-law
    kind: semantic
    statement: >-
      Parity has zero or more level inputs and one level output, yielding High
      if and only if an odd number of inputs are High. Parity([]) is Low,
      Parity([x]) is x, and binary Parity is XOR rather than an exactly-one law.
    sources: [parity-law, total-semantics]

  - id: at-least-total-law
    kind: semantic
    statement: >-
      AtLeast has zero or more level inputs, one level output, and a
      non-negative `u64` threshold. It yields High if and only if at least that
      many input ports are High; threshold zero always yields High and a
      threshold greater than arity always yields Low without invalidating the
      network.
    sources: [at-least-law, config-values, total-semantics]

  - id: select-branch-law
    kind: semantic
    statement: >-
      Select has three fixed level inputs with distinct selector, when-low, and
      when-high roles and one level output. A Low selector yields the when-low
      branch and a High selector yields the when-high branch; the unselected
      branch remains structural but does not currently support the result.
    sources: [select-law, dependency-signature]

  - id: variadic-port-identity-and-multiplicity
    kind: semantic
    statement: >-
      Any, Parity, and AtLeast preserve one independent stable input-port
      identity and one contribution per port. Port permutation cannot change
      their commutative behavior, while connecting one source to several ports
      remains valid and contributes once per port.
    sources: [variadic-inputs, duplicate-sources, level-algebra]

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      NetworkBuilder exposes immediately consumed variadic constructors for
      Any, Parity, and AtLeast, a direct fixed-argument Select constructor, and
      an explicit keyed form for every primitive. Dynamic authored definitions
      represent the closed Any, Parity, AtLeast(AtLeastConfig), and Select node
      kinds with stable typed ports and ordinary connection records.
    sources: [builder-style, builder-keyed, config-values, constructor-family, dynamic-node-kind, dynamic-ports]

  - id: causality-and-settlement
    kind: semantic
    statement: >-
      Every Any, Parity, and AtLeast input contributes a conservative
      current-reaction dependency to its output; Select contributes dependencies
      from its selector and both branches. Validation and compilation retain
      those incidences in the acyclic reaction graph, and full settlement
      evaluates the applicable total law without publishing evaluator
      intermediates.
    sources: [dependency-signature, reaction-graph, compiled-invariants, glitch-freedom]

  - id: nonblocking-quality-findings
    kind: system_effect
    statement: >-
      Valid zero-input and unary variadic forms emit their applicable
      empty-variadic or unary-degenerate advisories, and constant-result
      AtLeast configurations emit the applicable constant-result advisory.
      These findings remain non-blocking and do not suppress a valid artifact,
      with a more specific warning suppressing constant-result when both
      describe the same cause.
    sources: [total-semantics, validation-advisories, diagnostic-reports]

  - id: primitive-conformance
    kind: verification
    statement: >-
      Each primitive requires reusable built-in conformance coverage for every
      applicable matrix field. Tests exhaust bounded variadic valuations and
      all Select valuations, include total-law boundaries and duplicate-source
      multiplicity, preserve stable port identity under commutative
      permutations, and exercise the specified simultaneous-change glitch cases.
    sources: [glitch-verification, level-algebra, node-conformance, exhaustive-primitive-testing]

  - id: canonical-fingerprint-boundary
    kind: compatibility
    statement: >-
      Before the first stable fingerprint baseline, the authoritative version-1
      projection represents Any, Parity, and Select with their exact nullary
      node-kind variants and AtLeast with its exact threshold-bearing variant.
      Select's three input roles are distinct canonical identity and the
      threshold is an unsigned canonical integer; the synchronized accepted
      change must update affected golden vectors.
    sources: [restricted-fingerprint, fingerprint-versions, fingerprint-verification]

recommendations:
  - id: duplicate-source-advisory
    statement: >-
      Repeated use of one source on several Any, Parity, or AtLeast ports should
      produce the non-blocking duplicate-source diagnostic while preserving
      port-based multiplicity.
    sources: [duplicate-sources, validation-advisories]

implementation_freedom:
  - Private descriptor layouts, Boolean reductions, counting strategy, and evaluator dispatch are unconstrained when observable laws and structural identity are preserved.
  - Locally allocated variadic and fixed ports may use the simplest deterministic allocation order; implementers must test and record the concrete choice without treating it as reusable product policy.
  - Exact explicit-keyed constructor grouping and private AtLeast threshold storage are free within the represented public-surface and canonical-identity requirements.

open_questions: []

