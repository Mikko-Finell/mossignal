schema_version: "0.1"
id: mossignal.persistence.machine_snapshot_restoration
title: Machine snapshot validation and restoration
kind: lifecycle
status: reviewed

source_baseline:
  commit: c4e7625a8a86d8d0491d81728d6f2ed5a247d6eb
  working_tree: clean

summary: >-
  Strict validation of one machine_snapshot artifact and all-or-nothing
  construction of one equivalent machine. Decoding bytes is not acceptance.
  Ordinary restoration does not migrate, repair, or replay history.

scope:
  includes:
    - syntactic decode of untrusted machine_snapshot bytes, canonicality, limits, and integrity
    - version, time-domain, identity, lifecycle, subject, state, event, episode, provenance, settled-state, and digest checks
    - standard-declaration and expansion checks against the supplied compiled topology
    - private candidate construction and atomic publication of one complete machine
    - structured rejection, artifact re-encode, semantic round trip, and future-transaction sufficiency
  excludes:
    - machine_snapshot field spelling and SnapshotDigest construction except as checks against that artifact
    - execution-state and observable-state projection rules except recomputation and comparison
    - replay frames and logs, checkpoint bundles, and definition, policy, patch, and transaction artifacts
    - schema upgraders, semantic migrators, topology replacement, and policy rebinding
    - remote storage, compression, encryption, signatures, file I/O, and partial recovery

known_uncovered:
  - Bounded header inspection that does not decode the payload
  - ForecastState::snapshot and a separately named policy-rebinding restore
  - A representation-only upgrader and any historical version corpus beyond the single emitted vector
  - Replay-log artifacts and sufficiency histories that include topology replacement
  - Recovery tools that emit a new artifact, and decode of any artifact kind other than machine_snapshot
  - Long coverage-guided fuzzing, which remains scheduled verification

aliases:
  - CompiledNetwork::restore
  - decode_snapshot
  - DecodeFailure
  - RestoreFailure
  - DecodePolicy

requirements:
  - id: decode-is-not-acceptance
    kind: semantic
    statement: >-
      Decoding bytes is not acceptance. Syntactic decode, schema compatibility,
      semantic compatibility, and restoration compatibility are strictly
      stronger in that order. A machine_snapshot must pass the structural,
      semantic, compatibility, and integrity checks for its kind. Parsing,
      similar names, Rust layout, or best-effort deserialization do not
      establish compatibility. Integrity detects corruption and is not
      authenticity.
    sources: [axioms, compatibility-levels, syntactic-decoding, schema-compatibility, semantic-compatibility, authenticity]

  - id: hostile-and-bounded-decode
    kind: prohibition
    statement: >-
      Malformed or hostile machine_snapshot bytes produce a structured failure.
      The decoder must not panic, use unchecked arithmetic, recurse without a
      bound, allocate from an unvalidated length, publish a partial machine,
      invoke a host callback, or mutate caller-owned bytes, topology, or policy.
      DecodePolicy carries explicit limits for total bytes, nesting, text,
      byte strings, collections, nodes, ports, connections, module instances,
      pending events, provenance records, provenance edges, diagnostic records,
      replay frames, and optional-history bytes. It must not offer switches
      that ignore a digest mismatch, accept noncanonical bytes, fill missing
      levels with Low, skip unknown events, or reset incompatible state.
      Exceeding a limit fails as persistence.decode_limit_exceeded, names that
      limit, and does not claim the artifact would fail RuntimePolicy. Decode
      budgets are not runtime policy.
    sources: [hostile-input, decode-policy, decode-limits, resource-exhaustion, caller-data, malformed-fuzz]

  - id: canonical-framing
    kind: persistence
    statement: >-
      The decoder rejects a bad prefix, truncation, trailing bytes, a second
      envelope, non-shortest integers or lengths, forbidden CBOR types,
      indefinite lengths, duplicate or unsorted record fields, unsorted
      semantic collections, invalid UTF-8, wrong fixed lengths, and unknown
      required fields or variants outside a declared extension. It rejects a
      value whose re-encoding differs from the received canonical body, and it
      must not sort, deduplicate, or otherwise normalize that input into
      acceptance. The body is uncompressed; this decoder does not accept a
      compressed wrapper. For one supported value and version vector there is
      one canonical byte sequence. An accepted canonical byte sequence
      re-encodes to those same bytes.
    sources: [axioms, canonical-decoding, unknown-fields, compression, partial-files, canonical-uniqueness, exact-round-trip, no-heuristics, no-silent-repair, malformed-corpus]

  - id: integrity-and-version-gate
    kind: compatibility
    statement: >-
      Syntactic acceptance requires the envelope integrity digest to match
      before semantic acceptance. For machine_snapshot that digest is
      SnapshotDigest. The decoder reports a bad prefix as
      persistence.invalid_prefix, truncation as persistence.truncated_artifact,
      trailing bytes as persistence.trailing_bytes, a malformed envelope as
      persistence.malformed_envelope, an unrecognized kind as
      persistence.unknown_artifact_kind, and an integrity mismatch as
      persistence.integrity_digest_mismatch. The reader accepts a version
      vector only through an explicit support rule. Numeric adjacency is not
      compatibility. An unsupported component fails as
      persistence.unsupported_version and identifies artifact kind, stage,
      component, encountered version, the required version, and that no
      upgrader exists. This restoration must not upgrade, downgrade, or
      semantically migrate. A snapshot whose state or pending payload has no
      exact current meaning is rejected.
    sources: [syntactic-decoding, envelope-integrity, snapshot-compatibility, support-table, no-downgrade, semantic-migrations, compatibility-failure, decode-codes, integrity-classes]

  - id: one-semantic-version-vector
    kind: compatibility
    statement: >-
      The payload semantic version components and the corresponding envelope
      components are one version vector. They must be equal, and each must be
      an accepted version. A disagreement is not a second numbering.
    sources: [version-vector, snapshot-common, support-table]
    basis: derived

  - id: identity-and-policy
    kind: compatibility
    statement: >-
      Decode into D requires the artifact TimeDomainId to equal the
      PersistenceContext time domain. Restore additionally requires that same
      identity to equal the compiled network's bound TimeDomainId, and requires
      payload network_key and network_fingerprint to equal that compiled
      network. Labels are not time-domain evidence. Ordinary
      CompiledNetwork::restore requires policy.id() to equal the snapshot
      runtime_policy_id. Mismatches are persistence.wrong_time_domain,
      persistence.network_identity_mismatch, persistence.fingerprint_mismatch,
      and persistence.runtime_policy_mismatch. The snapshot does not embed a
      definition or policy body; those are the caller-supplied compiled
      network and policy. D has no persistence trait.
    sources: [persistence-context, time-domain-compatibility, restoration-compatibility, policy-restoration, api-restoration, no-migration]

  - id: no-migration-or-repair
    kind: prohibition
    statement: >-
      Ordinary restoration must not apply a topology patch, reassociate keys,
      reset incompatible state, cancel or drop pending events, change a
      deadline or pulse multiplicity, translate state across semantic kinds,
      reinterpret a node law or standard declaration, rewrite provenance, or
      discard an active episode. It must not trust a persisted dense index,
      heap position, arena slot, private CauseRef, storage order, or
      unrevalidated module expansion. It must not infer a missing level as
      Low, recompute a mismatched baseline and continue, or prune required
      provenance to hide a cycle. It installs the snapshot topology revision
      unchanged. An internally incompatible revision context is
      persistence.topology_revision_mismatch. These outcomes are rejection,
      not repair.
    sources: [api-restoration, processor-restoration, no-migration, semantic-migrations, no-silent-repair, prohibited-outcomes, no-heuristics, appendix-c]

  - id: lifecycle-subjects-and-state
    kind: semantic
    statement: >-
      Lifecycle shape is validated, not trusted. An uninitialized snapshot has
      declared node and temporal state and the next pending-event serial, and
      it has no current time, external valuation, settled level facts, output
      baselines, pending calendar, runtime provenance roots, active episodes,
      or derived schedule. A ready snapshot has current time, a complete
      authoritative external level valuation, settled level facts for the
      required level endpoints, an established baseline for every external
      level output, a pending calendar whose deadlines are strictly later than
      snapshot time, required provenance roots, and the explanation checkpoint
      state carried by the ready lifecycle. That state does not by itself
      require a provenance checkpoint record. Each state owner, event,
      episode, and provenance subject must exist once, at the compiled stable
      identity, with a compatible signal kind and state or event schema.
      Module-owned facts use the machine_snapshot stable owner: the
      module-internal key qualified by the full outermost-to-innermost
      instance path, not a flat key or dense index.
      Node kind and schema are redundant with the topology and are verified
      before private slots are installed. Unknown subjects, unknown variants,
      duplicate or missing required facts, and signal-kind contradictions fail
      closed. Pulse counts are not current port state.
    sources: [validation-phases, uninitialized-snapshot, ready-snapshot, state-tables, api-restoration, processor-restoration, catalogue-snapshot-state, rejection-classes]

  - id: uninitialized-state-is-declared
    kind: semantic
    statement: >-
      Uninitialized node and temporal state is the compiled topology's
      declared initial state. A value that merely has the right schema, but
      is not that declared state, is not a valid uninitialized snapshot.
    sources: [uninitialized-snapshot, state-tables]
    basis: derived

  - id: events-episodes-and-provenance
    kind: semantic
    statement: >-
      Each pending record's event kind agrees with its owner, its payload
      matches the machine_snapshot spelling for that kind, and its public
      PendingEventKey is a retained serial strictly below
      next_pending_event_serial. A pulse_delay_group carries its retained
      pulse count. Grouped contribution records are not required when that
      canonical payload does not contain them; retained supporters stay
      provenance predecessors. That cursor is preserved, and later allocation
      must not reuse a public serial. A singular temporal candidate or next
      boundary refers to a pending event that refers back to the same owner.
      Canceled events are absent. Private calendar placement may differ and
      must not change public keys, deadline order, equal-deadline batch
      semantics, inspection, or semantic digests. Active episode identity is
      recomputed from its stable rule and must match the persisted identity,
      code, owner, discriminator, times, and current evidence. The diagnostic
      code must be registered. Severity and responsibility are checked
      against the code registry when the artifact persists them; the episode
      record does not require a severity field that the machine_snapshot
      spelling omits. A disagreement is persistence.diagnostic_schema_invalid.
      Completed episodes are not active state. The provenance section is the
      complete acyclic backward closure of the required state, event,
      baseline, and episode roots. Each record's canonical bytes must
      reproduce its CauseDigest, with no missing predecessor, invalid subject
      or role, conflicting record for one digest, or false checkpoint. An
      ordinary snapshot leaves no unresolved external provenance record.
      Absence of a checkpoint record is valid when the artifact claims no
      checkpoint authority. A checkpoint that claims authority or completeness
      it does not establish is persistence.provenance_false_checkpoint.
    sources: [validation-phases, private-event-storage, episode-persistence, episode-record, required-provenance, provenance-order, provenance-corruption, diagnostic-form, event-continuity]

  - id: settled-state-and-digests
    kind: semantic
    statement: >-
      For a ready snapshot, restoration checks persisted settled values
      against the compiled topology, external levels, stored node state,
      temporal state, and obligations that are not yet due. The check uses the
      full reference evaluator or an equivalent complete consistency check. It
      performs no new reaction, emits no events, and changes no state. A
      mismatch is persistence.settled_state_inconsistent, not an instruction
      to repair the snapshot. Restoration recomputes ExecutionStateDigest,
      ObservableStateDigest, and SnapshotDigest. Each persisted claim must
      match, and the failure identifies the scope:
      persistence.execution_digest_mismatch,
      persistence.observable_digest_mismatch, or
      persistence.snapshot_digest_mismatch. Digest equality does not replace
      the semantic checks. Optional history and presentation metadata must not
      affect the restored machine or either state digest. Their absence is
      acceptable. The evaluator must not consult optional history.
    sources: [recomputed-settled, digest-validation, settled-consistency, unknown-fields, optional-history, appendix-c, digest-equality]

  - id: standard-expansion-check
    kind: semantic
    statement: >-
      Before a machine is created, every standard declaration retained by the
      supplied compiled topology is resolved as that exact descriptor,
      regenerated, and checked for declaration schema, public interface,
      expansion fingerprint, and complete canonical expansion. An unavailable
      descriptor version, interface mismatch, or expansion mismatch is
      rejected with the catalogue standard-module code. A declaration must not
      be reinterpreted with a newer descriptor for the same identifier.
      Equivalent current public outputs are not acceptance when internal state
      differs. User-module structure is the compiled definition already
      identified by the network fingerprint; the snapshot does not carry a
      second definition to validate.
    sources: [catalogue-restoration, catalogue-snapshot-state, standard-codes, snapshot-access]

  - id: atomic-publication
    kind: lifecycle
    statement: >-
      Restoration performs, in order, canonical envelope and integrity
      validation, version and time-domain checks, network identity and
      fingerprint checks, lifecycle-shape validation, stable-subject and
      state-schema validation, pending-event and allocator validation,
      diagnostic-episode validation, provenance validation, settled-value and
      baseline checks, digest recomputation, private candidate construction,
      complete invariant validation, and only then publication. No public
      machine exists before every phase succeeds.
      CompiledNetwork::restore borrows the compiled network and takes the
      snapshot and runtime policy by value, returning one complete Machine<D>
      or a structured RestoreFailure<D>. It must not return a partial machine,
      with or without warnings. Any failure discards the candidate, does not
      mutate the borrowed compiled network or the caller's artifact bytes, and
      publishes no machine.
    sources: [validation-phases, restoration-report, concrete-restore, concrete-compiled-restore, api-restoration, prohibited-outcomes, fault-injection]

  - id: structured-failures
    kind: public_surface
    statement: >-
      DecodeFailure and RestoreFailure carry catalogue persistence conditions,
      plus standard_module conditions for expansion checks. They must not
      collapse incompatibility into one invalid-data fallback or an
      unregistered string variant. The decoder distinguishes truncation,
      malformed canonical encoding, integrity mismatch, schema or version
      mismatch, semantic incompatibility, and restoration invariant failure.
      Compatibility evidence identifies artifact kind, stage, version
      component, encountered and required versions, whether an upgrader
      exists, and the applicable time-domain, network, revision, or policy
      context.
    sources: [integrity-classes, compatibility-failure, decode-codes, restore-codes, provenance-codes, failure-mapping, no-fallback]

  - id: round-trip-and-sufficiency
    kind: verification
    statement: >-
      For every supported canonical machine_snapshot byte sequence,
      re-encoding the decoded artifact yields those bytes. For every valid
      machine, including an uninitialized machine, restoring the decoded
      snapshot under the same compiled topology, time domain, and runtime
      policy yields a semantically equivalent machine. Comparison uses
      semantic state, not private layout or private cause-reference integers.
      For that restored machine and every compatible future transaction
      sequence applied through the ordinary transition, outputs, state,
      pending work, episodes, provenance roots, schedules, and both state
      digests match the original machine. Tests must reject tampered settled
      values, the named provenance corruption cases, and the restoration
      rejection classes, and must preserve pending-event keys, the allocation
      cursor, and future key allocation without reuse. No rejected decode or
      restore publishes a machine. A long coverage-guided fuzz campaign is not
      this obligation.
    sources: [canonical-uniqueness, exact-round-trip, snapshot-round-trip, testing-round-trip, snapshot-sufficiency, processor-sufficiency, testing-sufficiency, settled-consistency, event-continuity, provenance-corruption, rejection-classes, malformed-corpus]

recommendations:
  - id: representative-decoder
    statement: >-
      Decoding should be artifact-specific, broadly
      decode_snapshot(context, bytes, policy) -> Result<MachineSnapshot<D>, DecodeFailure>,
      and should live in the persistence module that does not own file-system
      access.
    sources: [decoding-apis, persistence-module]

  - id: nonexhaustive-failures
    statement: >-
      DecodeFailure and RestoreFailure should remain non_exhaustive while the
      diagnostic schema is experimental, without emitting an unregistered variant.
    sources: [nonexhaustive]

  - id: bounded-fault-injection
    statement: >-
      Fault injection should cover failure during envelope decode, provenance
      reconstruction, candidate construction, digest recomputation, and private
      store construction. No such failure may publish a partial machine. A
      long-running campaign stays scheduled verification.
    sources: [fault-injection, scheduled-fuzz]

implementation_freedom:
  - The support table for this revision accepts only the complete version vector the current machine_snapshot encoder emits, including the integers locked by its goldens. Every other component is persistence.unsupported_version with no upgrader. Do not implement a schema upgrader or semantic migrator, and do not treat that single-vector table as a named compatibility freeze.
  - Reject a canonical envelope whose recognized artifact_kind is not machine_snapshot as persistence.malformed_envelope. Use persistence.unknown_artifact_kind only for a kind string the schema does not recognize. Do not invent a diagnostic code. Test both cases and record the choice.
  - Reject persistence.topology_revision_mismatch when a persisted state, event, or episode revision context is greater than the snapshot topology revision. Do not require those originating revisions to be equal, and do not compare the revision with another machine. Test that choice and record it in the close-out.
  - Map a duplicate or missing state-table owner to persistence.state_schema_mismatch, and map a lifecycle variant that contradicts required presence or absence to persistence.lifecycle_shape_invalid. Do not invent a diagnostic code.
  - Success is Result<Machine<D>, RestoreFailure<D>> with no warning report. Do not add a second channel for accepted metadata.
  - Keep validated canonical bytes, optional history, and persistence metadata on the decoded artifact so re-encoding is byte-identical. Do not install optional history or presentation metadata into the machine. A later snapshot of the restored machine may therefore have a different SnapshotDigest.
  - Rebuild private provenance references from the canonical records. Preserved identity is the CauseDigest, not the pre-restore CauseRef integer. Do not add a public CauseDigest type.
  - Reuse the existing CBOR codec, domain-separated digest functions, reference evaluator, standard catalogue, and diagnostic registry. Restore rechecks framing and integrity even when decode already did, through one shared checker. Do not add a second evaluator.
  - DecodePolicy has every listed limit as a caller-supplied value and has no hidden unbounded default. Snapshot decoding enforces the limits that machine_snapshot structure can exceed, including total bytes, nesting, text, byte strings, collections, nodes, pending events, provenance records and edges, diagnostic records, and optional-history bytes. It does not decode definitions or replay frames.
  - Private pending events may use the existing calendar representation. Unspecified helper names and evidence-struct layout may follow the current ProblemEvidence style.

