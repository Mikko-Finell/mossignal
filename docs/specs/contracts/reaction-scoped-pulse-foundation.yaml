schema_version: "0.1"
id: mossignal.runtime.reaction_scoped_pulse_foundation
title: Reaction-scoped pulse foundation
kind: family
status: draft

source_baseline:
  commit: 0e1046283970d8d02691d7aaa41a360cc5f9938e
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md

summary: >-
  Pulse values are typed, reaction-scoped simultaneous multiplicities that enter
  through exact-bound input artifacts, propagate without implicit consumption
  or persistence, and publish nonzero external pulse activity atomically with
  checked overflow and grouped causal support.

scope:
  includes:
    - pulse value, endpoint, and same-time batch semantics
    - pulse input authoring and exact-bound snapshot and delta observations
    - reaction-scoped runtime storage, fan-out, and full settlement
    - pulse participation in initialization and ready-machine transactions
    - external Pulsed events, checked-overflow rejection, and grouped provenance
    - pre-stability semantic and input-schema fingerprint extension boundary
  excludes:
    - stateful, edge-sensitive, level-controlled pulse, and temporal behavior
    - node-specific pulse transformations beyond their use of this foundation
    - persistent pulse history, inspection subscriptions, and explanation rendering
    - persistence artifact decoding, replay, topology patches, and reconfiguration

known_uncovered:
  - Exact retained-history and current-reaction pulse inspection surfaces
  - Pulse-aware binding projection and prepared-patch target input construction

aliases:
  - Pulse
  - PulseCount
  - pulse input batch
  - Pulsed output event

requirements:
  - id: reaction-scoped-simultaneous-count
    kind: semantic
    statement: >-
      Pulse is a signal kind distinct from Level. Its value in one logical
      reaction is one non-negative simultaneous PulseCount, not an ordered token
      sequence, temporary High, self-resetting level, or persistent current port
      value. Equivalent same-time batches are order-independent, and activity at
      different logical times remains in distinct reactions.
    sources: [api-pulse, builtin-pulse, simultaneous-batches, reaction-scoped-storage]

  - id: checked-fixed-width-count
    kind: public_surface
    statement: >-
      PulseCount is the public checked u64 count with ZERO, ONE, construction,
      read-only value and zero/positive inspection, and checked addition.
      Ordinary arithmetic that may wrap is unavailable; representational
      overflow is a structured semantic rejection rather than wrap, saturation,
      truncation, or panic.
    sources: [concrete-count, pulse-overflow-code]

  - id: typed-pulse-boundaries
    kind: public_surface
    statement: >-
      NetworkBuilder provides convenience and explicit stable-keyed external
      Pulse inputs and outputs using Signal<Pulse>, ExternalInputKey<Pulse>, and
      ExternalOutputKey<Pulse>. Explicit input keys reject immediately
      determinable duplicates, foreign builder signals remain structured
      authoring failures, and no API silently converts between Pulse and Level.
    sources: [builder-scoped-signals, concrete-input-authoring, concrete-output-authoring, api-conversion]

  - id: exact-bound-pulse-inputs
    kind: semantic
    statement: >-
      InputSnapshot and InputDelta remain owned, distinct, exact-schema-bound
      artifacts and accept typed pulse observations by stable endpoint key.
      Absence of a pulse input means zero for that reaction; pulse input never
      becomes a retained external valuation. Input construction and application
      retain structured rejection categories for unknown, duplicate, wrong-kind,
      wrong-network, foreign-schema, and stale-schema cases.
    sources: [api-snapshot, api-delta, concrete-snapshot, concrete-delta, input-codes]

  - id: fanout-and-reaction-settlement
    kind: semantic
    statement: >-
      The complete count on one pulse source is copied to every connected input,
      and each pulse-consuming operation receives the complete settled
      simultaneous counts of all predecessors. Full topological reaction
      evaluation settles every operation once after its predecessors and cannot
      expose traversal-order intermediates or carry counts into a later reaction.
    sources: [pulse-fanout, runtime-reaction-io, runtime-full-evaluation, runtime-glitch-freedom]

  - id: lifecycle-transaction-integration
    kind: lifecycle
    statement: >-
      Initialization combines the complete external level snapshot with its
      initial pulse batch and uses the ordinary reaction evaluator. A ready
      transaction combines its pulse delta with current-time level observations
      and other same-time roots. Both paths stage the complete reaction and
      publish atomically; pulse counts expire after their reaction and are never
      retained as ready-machine current signal state.
    sources: [api-first-transaction, api-ready-transaction, runtime-first-transaction, runtime-transition]

  - id: external-pulse-publication
    kind: system_effect
    statement: >-
      A genuinely nonzero external Pulse output publishes one Pulsed event with
      its exact count, logical time, current revision, and resolvable CauseRef,
      including during initialization. Pulse events share the deterministic flat
      network-wide event stream, and canonical ordering among same-time events
      does not imply pulse causality.
    sources: [api-output-events, concrete-transaction-result, concrete-output-events, builtin-output-establishment]

  - id: overflow-is-atomic-rejection
    kind: semantic
    statement: >-
      Checked overflow encountered while deriving pulse multiplicity rejects the
      complete outer transaction as runtime.pulse_count_overflow. The published
      machine, logical time, external levels, output baselines, provenance, and
      every other semantic field remain unchanged, and no partial pulse event is
      published.
    sources: [pulse-overflow-code, runtime-transition, runtime-publication, testing-pulse-algebra]

  - id: grouped-pulse-provenance
    kind: system_effect
    statement: >-
      Pulse provenance records grouped contribution counts and unordered
      supporters without inventing individual pulse identity or an order among
      simultaneous occurrences. Equivalent executions have equivalent
      derivations up to non-semantic provenance-reference renaming and canonical
      representation order.
    sources: [runtime-pulse-provenance]

  - id: pre-stability-pulse-identity-extension
    kind: compatibility
    statement: >-
      Valid pulse-bearing definitions require network identity to represent
      pulse signal kinds, typed endpoints, ports, connections, and included
      pulse node kinds, while input-schema identity distinguishes pulse inputs
      from level inputs. Before the first stable fingerprint baseline, the
      accepted pulse-foundation change may extend development projection version
      1 without a historical reader, but must synchronize the exact authoritative
      projections, affected contracts, and golden vectors without accidental
      byte drift.
    sources: [network-fingerprint, restricted-network-fingerprint, input-schema-fingerprint, fingerprint-versions, deterministic-compilation]

  - id: pulse-foundation-verification
    kind: verification
    statement: >-
      Verification covers initialization and ready reactions, absent and
      explicit zero pulses, counts one, two, and a larger representable value,
      fan-out, input-order invariance, no cross-reaction persistence, exact Pulsed
      events, grouped provenance, same-topology fingerprint determinism, and
      checked-overflow failure atomicity.
    sources: [testing-first-transaction, testing-input-order, testing-pulse-algebra, testing-joint-support, testing-failure-atomicity]

recommendations:
  - id: family-partitioned-storage
    statement: >-
      Runtime storage should group reaction-scoped pulse counts by semantic
      family rather than allocate a trait object per node; generation-stamped
      sparse slots are a recommended way to make counts from older reactions
      semantically zero without clearing all storage.
    sources: [runtime-family-storage, reaction-scoped-storage]

implementation_freedom:
  - Private pulse-slot layout, generation representation, batch maps, evaluator descriptor shape, and event sorting mechanism are free when reaction isolation, multiplicity, stable identity, and deterministic observations are preserved.
  - Explicit zero pulse observations may be retained or normalized to absence internally because both mean zero in the same reaction; choose one deterministic representation, test it, and record the decision without making it a persistence promise.
  - The synchronized pre-stability version-1 projection uses the canonical `pulse`, `merge`, `coalesce`, `zip`, and `reaction_scoped` tags alongside the existing level projection; no historical migration is required before stabilization.

open_questions: []

