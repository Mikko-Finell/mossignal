schema_version: "0.1"
id: mossignal.reconfiguration.atomic_replacement
title: Atomic topology replacement
kind: lifecycle
status: reviewed

source_baseline:
  commit: 07f960e70b12e5c2e38c8a9b27fb77896360b65c
  working_tree: clean

summary: >-
  A prepared patch commits only through one ordinary transaction. At the
  effective time the machine finalizes migration against the state actually
  reached, enforces an explicit loss policy, installs the target topology, and
  publishes one atomic result.

scope:
  includes:
    - attaching one prepared patch and one explicit reconfiguration policy to an initialization or advancement transaction
    - effective-time finalization, target installation, and one target reaction
    - the committed migration report, revision advance, provenance, and diagnostic publication
    - failure atomicity and snapshot sufficiency of the committed machine
  excludes:
    - structural preparation and the static migration plan
    - persisted patch, migration-report, and patch-bearing replay artifacts
    - collaborative editing, merge, rebase, inverse patches, and incremental compilation

known_uncovered:
  - A persisted network_patch artifact, migration_report artifact, or patch-bearing replay frame, including re-preparation of a decoded patch and concatenation of a log that contains the patch step
  - Caller transaction metadata through Transaction::with_meta
  - Collaborative graph editing, automatic rebasing, patch merging, and inverse patches
  - Optimized incremental patch compilation
  - Caller-defined migration functions
  - One-to-many identity and name-based or similarity-based migration
  - A hidden or caller-omitted reconfiguration policy
  - Standard modules named by the catalogue but not constructed by this runtime
  - A future lossless migration between different temporal kinds

aliases:
  - Transaction::with_patch
  - ReconfigurationPolicy
  - MigrationReport<D>
  - ReconfigurationFailure<D>

requirements:
  - id: patch-bearing-transaction
    kind: public_surface
    statement: >-
      A prepared patch commits only through Transaction::with_patch on an
      ordinary initialization or advancement transaction, together with an
      explicit ReconfigurationPolicy of RejectStateLoss or
      AllowReportedStateLoss. with_patch returns
      Result<Self, TransactionBuildFailure<D>> and rejects, before
      application, every base-revision, network, target-schema, lifecycle, and
      time-domain mismatch determinable from the transaction and the prepared
      patch. The prepared base revision must equal the transaction's expected
      revision. The input must be bound to the prepared target schema, and a
      determinable schema mismatch is rejected before application. An
      initialization patch transaction carries a target-bound InputSnapshot. A
      ready patch transaction carries a target-bound InputDelta. Those input
      kinds are fixed by the transaction constructors. Applying an
      initialization transaction to a ready machine fails with
      lifecycle.already_initialized. Applying an advancement transaction to an
      uninitialized machine fails with lifecycle.delta_before_initialization.
      Before any candidate work, the prepared patch matches the machine only
      when the machine network key, machine revision, machine fingerprint,
      prepared base revision, prepared base fingerprint, signal-semantics
      version, and runtime time domain are equal. Inequality is
      reconfiguration.stale_prepared_patch. A transaction expected revision
      that differs from the machine is runtime.stale_revision. An optional
      expected execution-state digest is checked before any candidate work and
      rejects with runtime.stale_execution_state when it differs. No
      state-loss policy is implied for a transaction that does not carry a
      patch. Commitment accepts no migration callback.
    sources: [transaction-attachment, transaction-options, commitment-reporting, transactions, no-hidden-defaults, no-callbacks, no-migration-code, catalogue-runtime, catalogue-lifecycle, catalogue-finalization, prepared-freshness]
    basis: derived

  - id: effective-time-order
    kind: semantic
    statement: >-
      For a ready machine, one outer transaction first applies the
      patch-bearing checks. A requested time that is not strictly later than
      the machine's current logical time fails with
      runtime.time_not_strictly_increasing before candidate work. The
      transaction then processes every deadline strictly earlier than the
      effective time under the old topology; finalizes migration against the
      candidate state immediately before that time; enforces the loss policy;
      installs the target only in candidate state; forms one unordered
      patch-time batch from migrated obligations due then, migration-created
      obligations due then that policy explicitly allows, target external
      input, and topology-induced source invalidations and initialization
      facts; settles the target reaction; and publishes atomically. Events
      before the effective time never run under the target. An event due
      exactly then is migrated before it can fire and does not fire under the
      old topology. Preparation-time state is not substituted. Same-time
      caller input is a target-reaction fact, not source migration state.
    sources: [effective-time, state-dependent, same-time-input, due-at-patch, installation, ready-transaction, processor-finalization, settlement, catalogue-runtime]

  - id: initialization-patch
    kind: semantic
    statement: >-
      An initialization patch validates one complete target-bound input
      snapshot, finalizes from the base declared initial state, enforces the
      loss policy, installs the target in candidate state, and evaluates one
      ordinary initialization reaction. Preservation carries base declared
      state forward. A changed initial parameter does not overwrite preserved
      declared state. Reset installs the target declared initial state. There
      are no prior valuations, baselines, pending events, runtime episodes, or
      runtime provenance roots. Initialization and the revision commit together.
    sources: [init-order, uninitialized-state, first-transaction, commitment-reporting]

  - id: finalize-prepared-plan
    kind: semantic
    statement: >-
      Finalization applies the prepared static plan to the exact pre-patch
      state and does not invent a directive, infer correspondence, or repair
      the target. Every surviving state owner, source pending event, external
      level valuation, level-output baseline, active episode, and required
      provenance root receives one outcome. Conditional predicates are decided
      only by that pre-patch state. A total rule that selects Reject rejects
      the transaction through the catalogue finalization code for that subject.
      RequirePreserve fails when the decided outcome is not lossless
      preservation. Module instances keep the prepared internal correspondence,
      and one rejected internal subject rejects the whole transaction. Region
      merge or split alone does not reset compatible state, pending work,
      provenance, or episodes. After installation, every potentially affected
      target operation is reevaluated. The observable target reaction matches
      complete evaluation of the target reaction graph.
    sources: [state-dependent, installation, reevaluation, commitment-reporting, classification-test, region-test, induced-test, processor-finalization]
    basis: derived

  - id: input-output-and-cause
    kind: semantic
    statement: >-
      A preserved level input keeps its pre-patch valuation until the same-time
      target set replaces it. A reassociated level input inherits the source
      valuation the same way. A new level input is established only by explicit
      target input. A removed level input leaves the schema. Pulse absence
      means zero. A preserved level output compares the settled target value
      with its prior baseline and emits LevelChanged only when they differ. A
      new or reassociated level output emits LevelEstablished. A removed output
      is a topology consequence. A pulse output is emitted only for a genuine
      nonzero target-reaction count. The patch is a causal fact and is not
      encoded as a synthetic Level or Pulse.
    sources: [external-inputs, external-outputs, same-time-input, output-publication, topology-cause, processor-output, processor-cause, schema-test, induced-test]

  - id: explicit-loss-policy
    kind: semantic
    statement: >-
      RejectStateLoss rejects the whole transaction when the finalized
      semantic-loss set is nonempty, and a conditional loss that the pre-patch
      state does not realize does not reject. AllowReportedStateLoss commits
      only when every possible loss category was classified during preparation
      and every actual loss appears in the committed report. No unclassified
      loss is accepted.
      Removed or reset stored state, canceled pending work, lost deadline,
      origin, payload, inertial qualification, or periodic phase, a removed
      level valuation, a removed level baseline, and terminated episode or
      required provenance ancestry are loss when they actually occur.
      Revision advance, dense reassignment, stale handles, region changes,
      metadata changes, information-preserving retiming, ordinary reevaluation,
      and initialization where no source state existed are not loss.
    sources: [loss-policy, api-policy, processor-policy, commitment-reporting, policy-test, loss-policy-test]

  - id: migration-report
    kind: public_surface
    statement: >-
      A successful patch transaction returns one complete MigrationReport on
      the transaction result. A transaction without a patch has no migration
      report. The report identifies base and target revisions and fingerprints
      and accounts for every subject, state, pending-event, input, output,
      episode, provenance, loss, invalidation, and region outcome required to
      check total classification without private machine internals. Module
      replacement retains module grouping and the complete internal outcomes.
      Records are ordered by category, source identity, target identity, state
      or event identity, and one canonical tie-breaker. That order is not
      causal.
    sources: [migration-report, subject-outcomes, report-order, api-result, result-shape, commitment-reporting, totality-test]
    basis: derived

  - id: revision-provenance-and-episodes
    kind: system_effect
    statement: >-
      Success installs the prepared proposed revision exactly once. A
      state-only transaction still leaves the revision unchanged. Migrated
      state records the source fact, the patch, and the migration rule. Reset
      state records an explicit reset or target-initialization cause. Preserved
      pending events keep their scheduling ancestry and gain the migration
      fact. Recomputed or restarted events keep their originating causes and
      record the rule that changed timing. Required ancestry may be replaced
      only by an authoritative checkpoint that preserves later explanation.
      Active episodes follow the prepared Preserve, Transform, Resolve,
      Terminate, or Reject rule, and the target reaction may then begin,
      change, or resolve episodes. Dense identity never moves an episode or a
      provenance root to another subject. The patch transaction's output,
      state, topology, episode, and provenance changes are published in the
      ordinary result.
    sources: [revision, installation, provenance-migration, episode-migration, episode-behavior, processor-provenance, processor-episode, api-commitment, identity-test]

  - id: atomic-failure
    kind: prohibition
    statement: >-
      Any failure of freshness, earlier-deadline execution, migration,
      checked time arithmetic, loss enforcement, installation, target
      evaluation, provenance, diagnostics, result construction, digest
      calculation, or a runtime budget rejects the entire outer transaction.
      The published machine stays unchanged, including topology, revision,
      logical time, external levels, node and temporal state, pending events,
      baselines, provenance roots, episodes, and both digests. Earlier
      deadlines from that same transaction are not published. Finalization
      delivers reconfiguration.stale_prepared_patch,
      reconfiguration.target_input_schema_mismatch,
      reconfiguration.state_migration_rejected,
      reconfiguration.pending_event_migration_rejected,
      reconfiguration.require_preserve_failed,
      reconfiguration.episode_migration_rejected,
      reconfiguration.provenance_migration_rejected, and
      reconfiguration.state_loss_rejected through the closed reconfiguration
      failure family. That family also carries
      reconfiguration.ambiguous_event_migration and
      reconfiguration.conflicting_migrated_transitions when finalization
      discovers those conditions. Checked time and budget failures use
      runtime.time_overflow and runtime.budget_exceeded with reconfiguration
      phase evidence, including when the family's time and budget variants
      carry those problems. An inconsistent migration plan is an internal
      defect, not a caller-facing reconfiguration failure. Rejected
      transactions do not modify active episodes.
    sources: [atomic-failure, finalization-failures, episode-behavior, settlement, catalogue-finalization, catalogue-preparation, api-commitment, atomicity-test]

  - id: committed-snapshot-and-later-replay
    kind: persistence
    statement: >-
      The machine published by a successful patch transaction is an ordinary
      committed machine. Its snapshot, restored against the target compiled
      network and the same runtime policy, reproduces lifecycle, time,
      revision, fingerprint, external levels, migrated state, the pending
      calendar, baselines, active episodes, required provenance, and both
      digests. Restoration does not apply the patch, reassociate keys, or
      translate state. A later patch-free replay log started from that
      committed or restored machine reproduces the same subsequent results and
      digests. A recording helper must not store a patch-bearing transaction
      as a patch-free frame.
    sources: [snapshot-sufficiency, snapshot-contents, restoration, no-implicit-migration, processor-replay, frame-construction]
    basis: derived

  - id: forecast-shares-the-transition
    kind: semantic
    statement: >-
      Forecasting a patch-bearing transaction is the ordinary forecast of that
      transaction. It runs the same finalization, migration, settlement, and
      publication steps on unpublished candidate state and returns the
      hypothetical result, including the migration report. It does not mutate
      the source machine, reserve the revision, or act as a commit token.
      Later commitment is a new transaction against the then-current revision
      and, when requested, the expected execution digest. Structural
      preparation still does not claim the exact outcomes.
    sources: [exact-forecast, no-forecast-commit, processor-preview]

  - id: finalization-verification
    kind: verification
    statement: >-
      Tests must separate preparation from finalization and show that migration
      uses the state reached after earlier deadlines, not the state at
      preparation. They must cover both loss policies, unrealized conditional
      loss, the temporal boundaries strictly before, at, and after the
      effective time, target input establishment and removal, preserved,
      established, and removed outputs, a topology-caused edge pulse, module
      internal preservation and a loss that rejects the whole patch, dense-slot
      non-transfer, and atomic rejection after earlier deadline work. The
      committed machine must match complete target evaluation. A forecast of
      the same transaction must match cloned apply and leave the source
      unchanged. A post-commit snapshot must restore an equivalent machine, and
      a later patch-free replay from that machine must match continued
      execution. Replay boundaries immediately before and after the commit are
      checked with those snapshot checkpoints and patch-free logs.
    sources: [two-stage-test, reached-state-test, effective-time-test, policy-test, temporal-boundary-test, schema-test, reaction-test, module-test, atomicity-test, differential-test, forecast-equivalence, freshness-test, snapshot-round-trip, snapshot-sufficiency-test, replay-equivalence, replay-boundary]

recommendations:
  - id: retain-rejecting-evidence
    statement: >-
      Finalization may stop once the transaction must reject, and it should
      still retain the state predicate or event that caused the rejection.
    sources: [accumulation]

  - id: checkpoint-preserved-state
    statement: >-
      Preserved state across a revision should receive a migration checkpoint
      rather than silent reuse of a revision-incompatible provenance root.
    sources: [provenance-migration, processor-provenance]

implementation_freedom:
  - Private candidate storage, event-arena layout, and the dense state-migration algorithm are free when the observable migration, reaction, and atomic publication stay equivalent.
  - Complete evaluation of the target reaction graph is sufficient. A second incremental compiler is not required.
  - MigrationReport and its records may use private fields and accessors. The representative public-field listings are not a storage mandate.
  - The commit installs the prepared proposed revision. It does not choose a different successor encoding.
  - The current patch-free replay codec stays in force. Rejecting a patch-bearing recording, without writing a frame and without mutating the machine, is the sufficient behavior until a patch-bearing frame exists.

open_questions: []

