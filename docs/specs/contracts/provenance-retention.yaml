schema_version: "0.1"
id: mossignal.provenance.retention
title: Root-directed causal retention and optional collection
kind: lifecycle
status: reviewed
source_baseline:
  commit: fd5076544bbd2d55384f66217765f706c7cc2e22
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/processor_and_runtime_architecture.md

summary: >-
  Required causal storage is selected by current and policy-selected historical
  roots. Collection can release unrelated optional records while the explanation,
  owned-artifact, persistence, and budget contracts remain in force.
scope:
  includes:
    - root-directed retention and collection of optional causal records
    - the distinction between optional retention and required-provenance budgets
    - current machine manifests, independent artifact ownership and logical growth accounting
  excludes:
    - authoritative checkpoint completeness represented by causal-explanations
    - owned cause-reference lookup/API guarantees represented by semantic-inspection
    - canonical cause content and digest projections represented by machine-state-digests
    - exact collection algorithms, checkpoint APIs, and application history policy
requirements:
  - id: retained-root-closure
    kind: lifecycle
    statement: >-
      Required retained provenance is the backward-reachable closure of required
      current roots and policy-selected historical roots. Unreachable optional
      provenance may be collected. If an explanation is pruned, it terminates at
      an explicit checkpoint or retention boundary.
    sources: [runtime-retention]
  - id: required-limits-are-operational
    kind: semantic
    statement: >-
      Limits on required current provenance affect operational behavior and
      belong to runtime policy identity. Performance-only tuning that cannot
      affect semantic results is excluded from that policy.
    sources: [runtime-budget, runtime-policy]
  - id: current-machine-root-manifest
    kind: lifecycle
    statement: >-
      Current retention roots include external level origins, current operation
      and port support and explicit last-reaction evidence, state establishment
      and latest transition, edge and temporal facts, output baselines, pending
      scheduling, inertial qualification, periodic phase and required cancellation,
      active diagnostic current material evidence, and current qualified module
      reset/toggle/capture evidence. Beginning reaction stamps and episode identities
      remain ordinary episode state; the manifest introduces no separate initial
      cause root after material evidence changes. A retained beginning-event result
      independently owns its cause. The manifest deduplicates cause identities;
      uninitialized machines have no runtime causal roots. Restoration owns its
      validated or reconstructed current facts under the declared boundary.
      Retention and canonical projection roots are distinct inventories.
    sources: [runtime-current-ownership]
  - id: independent-artifact-ownership
    kind: lifecycle
    statement: >-
      Results and owned observations, explanations, episodes and forecasts own
      every exposed cause's sufficient closure independently. Results cover the
      full change set and event stream, including intermediate deadlines and
      pre-patch source events. An episode does not retain an old complete machine
      view. External artifact ownership cannot enlarge the machine root manifest
      or change migration, budgets, digests or snapshot projection. Releasing one
      owner preserves ancestry still owned elsewhere. Collection never truncates
      required ancestry or promises bounded total history; dead lookup metadata
      must not accumulate from obsolete artifacts or rejected candidates.
    sources: [runtime-current-ownership]
  - id: logical-growth-independent-of-reclamation
    kind: semantic
    statement: >-
      Charge newly required logical records at the outer-transaction accounting
      boundary, including earlier internal reactions. Reclaimed old records,
      sharing, canonical coalescing, caches, physical allocation and external
      ownership cannot offset or change the charge. Equivalent replacement source
      checkpoint wrappers are not new appends; newly introduced patch, migration
      and reaction records retain their growth charge. All admission precedes
      publication and rejection preserves predecessor ownership.
    sources: [runtime-budget]
recommendations:
  - id: prune-optional-before-failure
    statement: >-
      Optional historical provenance retention should not cause semantic failure
      where it can instead be pruned.
    sources: [runtime-budget]
implementation_freedom:
  - >-
    Storage, sharing, interning, and collection strategy are private choices when
    they preserve the governing architectural invariants and reference equivalences.
known_uncovered:
  - An explicit public checkpoint or historical-retention configuration surface.
open_questions: []
