schema_version: "0.1"
id: mossignal.runtime.ordered_reactions
title: Ordered reaction occurrences at exact physical time
kind: lifecycle
status: reviewed

source_baseline:
  commit: c808ff7017d86a2b7a51a17ab9bcbc70554ec3f7
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/api_and_semantics_spec.md
    - docs/specs/processor_and_runtime_architecture.md
    - docs/specs/built_in_node_semantics.md
    - docs/specs/concrete_rust_api_surface.md
    - docs/specs/reconfiguration_and_topology_patch_spec.md
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md
    - docs/specs/exhaustive_diagnostic_code_catalogue.md

summary: >-
  ReactionStamp separates exact physical time from machine-local ordered
  occurrence. It preserves unordered settlement within a reaction and distinct
  committed predecessors across reactions, including current-time transactions.

scope:
  includes:
    - occurrence allocation, admission, observable order and atomic identity
    - temporal origin precedence and once-only maturity/phase accounting
    - occurrence effects on provenance, diagnostics, freshness and artifacts
  excludes:
    - host phase scheduling, physical actions and consequence termination
    - primitive laws unrelated to reaction occurrence
    - application identifier projection and mapping ownership

aliases: [ReactionStamp<D>, ordered same-time reactions, reaction order]

requirements:
  - id: machine-local-physical-time-and-order
    kind: semantic
    statement: >-
      ReactionStamp is physical Time plus checked u64 order within one machine
      history. Initialization and the first reaction at greater time use zero;
      each later current-time reaction increments order. Earlier time rejects.
      Orders never participate in physical duration arithmetic and are not
      caller-assigned or globally unique.
    sources: [occurrences, concrete-occurrence]

  - id: explicit-settlement-and-predecessor
    kind: lifecycle
    statement: >-
      Every successful explicit transaction evaluates its final reaction, even
      an empty delta or unchanged reassertion, allocating a stamp. Inputs in one
      reaction are unordered and share one predecessor and staged successor;
      subsequent reactions read the committed successor. Inspection, forecast,
      preparation and binding-only replacement allocate no live occurrence.
      No fixed-point evaluator or implicit same-time loop is introduced.
      Cross-reaction provenance advances by stamp, while dependency order
      remains local to a reaction.
    sources: [occurrences, causal-order]

  - id: deadline-batch-once
    kind: semantic
    statement: >-
      Internal deadline batches receive stamps within their unpublished outer
      candidate. A deadline is consumed once; due work and fresh input in one
      target transaction join one reaction. Later calls at that time cannot
      undo or redispatch it. Ordinary new pending work is physically future.
    sources: [partition, staging]

  - id: physical-maturity-aggregation
    kind: semantic
    statement: >-
      Equal-owner/deadline PulseDelay groups contribute their checked sum in
      one due reaction with distinct causal origin stamps. Original reaction
      partition is not replayed: Toggle uses parity of the due sum and sampled
      storage receives one complete sample batch.
    sources: [pulse-maturity, aggregation]

  - id: immutable-transport-precedence
    kind: semantic
    statement: >-
      Transport maturity selects the greatest immutable originating stamp,
      not value or event order. Distinct same-time origins are valid grouped
      pending state. Migration can change physical timing bases without erasing
      causal precedence. RecomputeFromOrigin uses the retained timing origin,
      including a prior restart; conflicting targets with identical stamps require
      explicit resolution or rejection.
    sources: [transport-precedence, transport-migration, timing-origin]

  - id: singular-inertial-and-once-only-phase
    kind: semantic
    statement: >-
      Same-time inertial updates replace/cancel the predecessor candidate
      sequentially without resurrection. Periodic retains phase-origin stamp
      and settled boundary watermark. PreservePhase and preserving/recomputed
      schedules cannot replay settled or suppressed boundaries. Real RestartPhase
      re-enable or explicit loss-permitted fresh phase can emit once under
      Immediate, even at the same physical time.
    sources: [inertial-law, periodic-once, periodic-migration]

  - id: stamped-observable-occurrences
    kind: public_surface
    statement: >-
      Machine exposes the last committed stamp and results expose processed
      stamps. Output events, occurrences and episode changes expose producing
      stamps; streams order by stamp then canonical within-reaction subjects.
      Endpoint and variant distinguish singular count-bearing events within a
      reaction. Direct identical Pulse exports in separate reactions retain
      distinct stamped input/transaction causes and owning provenance views.
    sources: [concrete-occurrence, output-stream, staging]

  - id: episode-occurrence-identity
    kind: semantic
    statement: >-
      Condition identity remains code/subject/discriminator. Episode occurrence
      uses its beginning stamp and retains material-change stamps, so
      resolve/rebegin at one physical time stays distinct. Unchanged retained
      evidence does not emit repeated episode changes.
    sources: [diagnostic-order, persistence-occurrence]

  - id: freshness-and-partition-equivalence
    kind: compatibility
    statement: >-
      Execution digest includes the last stamp and occurrence continuation
      state; an intervening current-time transaction invalidates exact preview
      freshness even if persistent values agree. Large-jump equivalence preserves
      meaningful reaction partition and physical behavior, not exact identities
      or artifact bytes across additionally inserted explicit settlements.
      Empty settlements can also suppress a disabled Periodic boundary and
      must not be removed from the meaningful reaction partition.
    sources: [partition, persistence-occurrence]

  - id: effective-time-patch-source
    kind: reconfiguration
    statement: >-
      A current-time patch finalizes against the committed predecessor including
      earlier same-time reactions. Already consumed work stays consumed; explicit
      migration-created due-now work joins the new target batch once. Original
      stimulus stamps and phase consumption survive compatible migration.
    sources: [effective-time]

  - id: atomic-order-and-resource-failure
    kind: semantic
    statement: >-
      Order allocation, event/episode identity, candidate deadlines, provenance,
      diagnostics, digest and bound projection share one publication boundary.
      Checked order exhaustion and ordinary budgets reject the complete
      transaction without consuming identities or earlier candidate work.
    sources: [staging, diagnostic-order]

  - id: canonical-continuation-and-replay
    kind: persistence
    statement: >-
      Ready snapshots preserve the last stamp, pending immutable origins,
      separate restarted timing bases, periodic phase/watermark and required
      stamped causes/episodes. Restore validates them and accepts valid
      equal-maturity groups. Repeated-time frames replay through ordinary apply
      in frame order with exact predecessor digests. Affected versions evolve
      coherently without historical pre-alpha readers or a compatibility freeze.
    sources: [persistence-occurrence, replay-order]

implementation_freedom:
  - Private stamp storage and comparison helpers may vary within the checked u64 and public occurrence responsibilities.
  - Phase watermark storage may use equivalent ordinal/time state when cadence migration preserves the same eligibility rule.

