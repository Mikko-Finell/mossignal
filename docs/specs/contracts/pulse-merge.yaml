schema_version: "0.1"
id: mossignal.node.pulse_merge
title: Variadic pulse Merge primitive
kind: node
status: reviewed

source_baseline:
  commit: 01ac220b38653e69c8433b7370502b4ca28f72f8
  working_tree: dirty

summary: >-
  Merge is a stateless variadic Pulse primitive whose output is the checked sum
  of every stable input port's complete simultaneous count, preserving
  multiplicity and grouped causal contribution without inventing pulse order.

scope:
  includes:
    - Merge's variadic pulse-port shape and total summation law
    - typed and dynamic authoring with stable variadic pulse ports
    - structural validation, dependency extraction, compilation, and full evaluation
    - checked-overflow behavior, grouped provenance, and conformance verification
  excludes:
    - Coalesce, Zip, level-controlled pulse, stateful, and temporal primitives
    - general pulse input, transaction, storage, and output-event semantics
    - explanation rendering, persistence decoding, and topology reconfiguration

known_uncovered:
  - Exact current explanation and why-not rendering for grouped Merge contributions

aliases:
  - Merge
  - variadic pulse sum
  - pulse multiplicity merge

requirements:
  - id: total-checked-sum-law
    kind: semantic
    statement: >-
      Merge has zero or more Pulse inputs and one Pulse output. In each reaction
      its output count is the checked sum of every input-port count; Merge([]) is
      zero, Merge([n]) is n, and zero and unary arities are valid rather than
      blocking structural errors.
    sources: [merge-law, concrete-count]

  - id: stable-commutative-port-multiplicity
    kind: semantic
    statement: >-
      Each variadic input slot has stable pulse-port identity. Port permutation
      cannot change the commutative sum, while connecting one source to several
      ports remains valid and contributes its complete count once per port;
      ordinary fan-out copies rather than consumes the source count.
    sources: [variadic-inputs, duplicate-sources, pulse-fanout, pulse-algebra]

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      Typed Merge authoring consumes an IntoIterator of Signal<Pulse> immediately
      and returns a structured authoring result. Dynamic definitions represent
      the closed NodeKind::Merge with stable typed ports and connections. An
      explicit keyed form exposes NodeKey and DiagnosticMeta and may accept exact
      variadic input-port identities.
    sources: [variadic-inputs, builder-variadic, builder-keyed, dynamic-node-kind, dynamic-ports]

  - id: causality-compilation-and-settlement
    kind: semantic
    statement: >-
      Merge's conservative current-reaction signature contains every pulse
      input-to-output influence. Validation, cycle analysis, and compilation
      retain the resulting dependencies in an acyclic reaction graph while the
      executable topology preserves every stable port incidence. Full topological
      settlement evaluates the complete checked sum only after all predecessors
      settle without traversal-order artifacts.
    sources: [dependency-signature, reaction-graph, compiled-invariants, full-evaluation]

  - id: checked-overflow-rejection
    kind: semantic
    statement: >-
      If Merge's u64 output sum is unrepresentable, evaluation returns the
      structured runtime.pulse_count_overflow semantic rejection. The containing
      transaction remains wholly atomic and publishes neither a partial count nor
      any partial machine change.
    sources: [concrete-count, overflow-code, failure-atomicity]

  - id: nonblocking-variadic-findings
    kind: system_effect
    statement: >-
      Valid empty and unary Merge forms emit the applicable non-blocking
      empty-variadic or unary-degenerate advisory without suppressing the
      artifact.
    sources: [merge-law, validation-advisories, diagnostic-reports]

  - id: grouped-contribution-provenance
    kind: system_effect
    statement: >-
      Merge causality preserves each contributing port and its count as an
      unordered grouped derivation and records the resulting multiplicity. It
      must not manufacture an ordering or individual identity for simultaneous
      pulse occurrences.
    sources: [merge-law, pulse-provenance]

  - id: merge-conformance
    kind: verification
    statement: >-
      Reusable built-in conformance covers Merge's pulse port kinds, variadic
      arities, current-reaction signature, total output law, simultaneous batch
      law, multiplicity, grouped provenance, and non-applicable matrix fields.
      Focused pulse algebra includes zero, one, two, a larger representable
      count, fan-out, duplicate-source multiplication, port permutation, and
      representable boundary counts plus checked-overflow rejection.
    sources: [node-conformance, conformance-matrix, pulse-algebra, joint-support-verification]

recommendations:
  - id: duplicate-source-advisory
    statement: >-
      Repeated use of one source on distinct Merge ports should produce the
      non-blocking duplicate-source advisory while preserving port-based
      multiplicity.
    sources: [duplicate-sources, validation-advisories]

implementation_freedom:
  - Private descriptor layout, checked reduction order, pulse-slot representation, stable-port allocation helper, and evaluation decomposition are free when they preserve exact stable incidences, commutative semantics, deterministic success, and deterministic overflow rejection.
  - Locally allocated variadic ports use one deterministic iterator-based rule selected, tested, and recorded during implementation; callers may use the exact keyed form when independent durable reconstruction matters.

open_questions: []

