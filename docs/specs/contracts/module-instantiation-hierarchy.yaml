schema_version: "0.1"
id: mossignal.module.instantiation_hierarchy
title: Exact module instantiation and retained hierarchy
kind: artifact
status: reviewed

source_baseline:
  commit: a7e75d75699d40c65c2f4b1a092866e6d1df4e47
  working_tree: dirty

summary: >-
  A module instance binds every typed public input of one validated reusable
  module to stable sources in an owning builder, exposes typed instance outputs,
  and retains instance-qualified internal identity and acyclic containment in
  canonical unchecked and validated definitions.

scope:
  includes:
    - typed generic instantiation in network and reusable-module authoring
    - owned dynamic module-instance and binding claims
    - exact interface binding and typed instance-output identity
    - nested containment, encapsulation, validation, and graph inspection
    - module-aware current-reaction validation and semantic fingerprints
  excludes:
    - module-aware executable lowering and runtime execution, state, event, and observation integration
    - standard-catalogue construction conveniences and descriptor validation
    - persistence envelopes, restoration, replay, and compatibility migration
    - module replacement, topology patches, and runtime-state migration

known_uncovered:
  - Standard-catalogue shortcuts and generic instantiation of standard-origin modules
  - Persistent definition encoding and module-instance compatibility migration

aliases:
  - ModuleInstanceDef<D>
  - ModuleBindingSet
  - ModuleInstanceBuilder<'a, D>
  - AddedModuleInstance
  - nested modules

requirements:
  - id: stable-instance-and-output-identity
    kind: semantic
    statement: >-
      Each instance has one stable ModuleInstanceKey. A typed instance output
      retains its signal kind and the exact pair of instance key and public
      ModuleOutputKey<S>; a logical internal subject retains the pair of
      instance key and module-local stable key rather than an insertion index,
      dense position, or presentation path.
    sources: [concrete-keys, concrete-instantiation]
    basis: derived

  - id: owned-dynamic-instance-claims
    kind: public_surface
    statement: >-
      Canonical dynamic definitions retain owned ModuleInstanceDef<D> claims
      containing stable instance identity, a validated ModuleDef<D>, an owned
      ModuleBindingSet, optional containment parent, and diagnostic metadata.
      Binding sets explicitly retain each kind-aware public input identity and
      stable source without borrowing builder signals or containing evaluator
      callbacks; malformed dynamic bindings and hierarchy remain representable
      for validation.
    sources: [api-unchecked, concrete-dynamic]

  - id: typed-transactional-instantiation
    kind: public_surface
    statement: >-
      Typed instantiation begins from a validated module, one explicit instance
      key, and metadata; binds Level and Pulse module inputs only to same-kind
      local Signal<S> values; and commits one complete instance only when finish
      succeeds. NetworkBuilder provides the specified transactional surface,
      and reusable-module authoring provides an equivalent generic path so
      nested modules are constructible without exposing private internals.
    sources: [concrete-instantiation, concrete-signals, concrete-modules, api-modules]
    basis: derived

  - id: exact-binding-completion
    kind: prohibition
    statement: >-
      Typed completion requires every declared public input exactly once and
      rejects missing, duplicate, unknown, wrong-kind, or foreign-builder
      bindings through structured authoring failure. An instance is added to
      the owning builder's authored definition only by successful completion;
      rejected construction must not leave a partial instance.
    sources: [concrete-instantiation, concrete-signals, catalogue-authoring]
    basis: derived

  - id: typed-output-access-and-encapsulation
    kind: public_surface
    statement: >-
      Successful instantiation returns AddedModuleInstance with its exact key
      and kind-safe access to every declared public output. Unknown or
      wrong-kind output requests fail structurally; callers cannot obtain a
      directly connectable Signal for unexported module-local nodes or ports.
    sources: [concrete-instantiation, api-modules]

  - id: complete-dynamic-binding-validation
    kind: semantic
    statement: >-
      Ordinary validation establishes unique instance identity, existence and
      exact kind compatibility for every declared and encountered module input,
      exactly one binding for every required input, no unexpected binding,
      valid source direction and existence, and no incompatible network or
      authoring-scope reference. Independent safe findings use the common
      deterministic report model and any blocking condition suppresses the
      validated artifact.
    sources: [api-validation, concrete-validation, catalogue-validation, testing-validation]

  - id: acyclic-retained-hierarchy
    kind: semantic
    statement: >-
      Nested module containment is explicit and acyclic. Every parent exists,
      containment preserves interface visibility and stable subject identity,
      and private internals remain encapsulated. Validated definition graph
      inspection retains instances, parents, public interfaces, bindings, and
      instance-qualified internal subjects independent of insertion order even
      if a later executable representation flattens them.
    sources: [api-modules, api-graph-view, concrete-graph-view, hierarchy-rules, complete-validation]

  - id: module-aware-current-reaction-validation
    kind: semantic
    statement: >-
      Validation projects each instance's conservative public-input-to-public-
      output current-reaction dependencies from its already validated module
      structure, recursively across nested instances. Network-level SCC
      validation includes those cross-boundary dependencies so a cycle passing
      through one or more module instances cannot become a ValidatedNetwork.
    sources: [api-causality, api-validated, complete-validation, testing-cycles]
    basis: derived

  - id: instance-sensitive-semantic-identity
    kind: semantic
    statement: >-
      ModuleFingerprint covers semantic nested instance structure inside a
      reusable definition while excluding placement of that definition in a
      containing network. NetworkFingerprint covers each contained module's
      fingerprint, stable instance key, exact bindings, and state-relevant
      hierarchy; both identities exclude insertion order, dense layout, and
      presentation-only instance metadata.
    sources: [module-fingerprint, network-fingerprint, definition-artifacts, standard-fingerprints]
    basis: derived

  - id: typed-dynamic-canonical-equivalence
    kind: verification
    statement: >-
      Equivalent valid typed and dynamic construction paths produce the same
      exact instance keys, module identities, bindings, output sources,
      containment, validated graph inspection, dependency relation, and
      fingerprints. Verification covers both signal kinds, nesting, and
      permutation invariance. Typed authoring failures and malformed dynamic
      binding or hierarchy claims are verified independently at their specified
      failure and validation boundaries.
    sources: [concrete-instantiation, concrete-dynamic, testing-validation, testing-determinism]
    basis: derived

implementation_freedom:
  - The private borrowing transaction, collection layout, and shared network/module builder helpers are unconstrained; choose the smallest design that commits atomically and lowers into one canonical dynamic instance representation.
  - The timing of temporary binding storage and convenience-allocation effects after a rejected instantiation is unconstrained beyond successful completion being the only operation that adds the instance; choose a deterministic behavior, test it, and record the concrete choice.
  - The non-exhaustive SignalSourceKey family may gain an instance-output variant or use another equally typed stable source value, provided the public identity retains both ModuleInstanceKey and ModuleOutputKey<S> without collision-prone surrogate keys.
  - Parent storage, hierarchy indices, recursive ModuleDef sharing, and public dependency-summary caching are private choices; select deterministic stable-key ordering, test it, and record the concrete decision.
  - This foundation may accept only currently constructible reviewed User-origin ModuleDef values while standard catalogue production remains unavailable; do not add placeholder catalogue APIs.

open_questions: []

