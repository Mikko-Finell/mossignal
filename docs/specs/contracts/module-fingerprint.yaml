schema_version: "0.1"
id: mossignal.identity.module_fingerprint
title: Reusable module semantic fingerprint
kind: artifact
status: reviewed

source_baseline:
  commit: e735a54ee33851d059d636c438063bff5b0e9fec
  working_tree: clean

summary: >-
  ModuleFingerprint is the opaque domain-separated identity of one validated
  reusable module's semantic public interface, explicit origin, and module-local
  primitive structure. User and standard modules share the exact section 55
  development-projection record. It is stable across authored insertion order
  and private representation while excluding this module's instance placement
  and presentation metadata.

scope:
  includes:
    - ModuleFingerprint public value and digest construction
    - semantic inclusion, exclusion, sensitivity, and ordering rules for the shared section 55 payload
    - successful ModuleDef ownership and deterministic verification
  excludes:
    - standard expansion-fingerprint construction and catalogue contribution policy beyond the section 55 origin record
    - this module's instance placement, network bindings, and containing-network identity
    - complete module-definition artifact encoding and integrity digests
    - compatibility migration and reconfiguration

aliases:
  - ModuleFingerprint
  - semantic module identity
  - reusable module fingerprint

requirements:
  - id: distinct-opaque-module-identity
    kind: public_surface
    statement: >-
      ModuleFingerprint is a public opaque fixed 32-byte value distinct and
      non-interchangeable from NetworkFingerprint, module-instance keys,
      revisions, state digests, and persisted-artifact integrity digests.
    sources: [fixed-fingerprints, concrete-modules]

  - id: domain-separated-digest
    kind: semantic
    statement: >-
      DigestSuiteVersion 1 computes ModuleFingerprint with unkeyed BLAKE3-256
      over a canonical record containing domain label
      mossignal/module_fingerprint/v1, domain version 1, and the section 55
      version-1 canonical semantic module payload. No other digest type may
      reuse that domain label.
    sources: [digest-suite, domain-separation, digest-versions, module-fingerprint]

  - id: complete-user-module-projection
    kind: semantic
    statement: >-
      A user module uses the exact section 55 payload with origin ["user", null].
      Record fields use canonical field-name order. The payload includes the
      typed public inputs and outputs, input and output mappings, and the
      module-local nodes, ports, and connections, including node kinds,
      semantic roles, semantic parameters, declared initial state, and state
      or temporal schemas where the section 54.2 kind records include them.
      A module connection is not the network connection record: it carries
      signal kind, its target is the bare in-port key, and its source is a
      bare out-port key or a section 55 source record. A mapping target is
      the bare in-port key. A mapping source is a bare out-port key, the
      bare-key module_input variant, or a module_output record. That mapping
      module_input variant is not the module-connection module_input record.
      Inputs and outputs are ordered by signal-kind tag, then key. Nodes are
      ordered by node key and connections by connection key. Mappings are
      ordered by input mappings before output mappings, then the public
      interface key's signal-kind tag and key, then the opposite endpoint
      class in the section 54.2 binding order, then that endpoint key, then a
      module-output's output key when present. Ports are ordered by signal-kind tag,
      direction with input before output, port key, owner key, then
      semantic-role name. Nested module instances, when present, use the
      section 54.2 instance record and order. Empty connections, inputs,
      mappings, nodes, outputs, and ports arrays are present.
      module_instances is omitted only when empty.
    sources: [api-modules, concrete-modules, module-fingerprint]

  - id: representation-and-instance-exclusions
    kind: prohibition
    statement: >-
      Module identity excludes construction and insertion order, dense indices,
      memory layout, private caches, topology revision, diagnostic names,
      descriptions, paths, diagnostic origin metadata, presentation tags and
      extensions, this module's own instance key, placement, bindings, and
      metadata, and the containing network's identity. It also excludes
      TimeDomainId, catalogue version, and the expansion-fingerprint bytes.
      The version-1 payload omits TimeDomainId because a reusable module
      definition has none; that omission does not remove TimeDomainId from
      NetworkFingerprint. Nested instances inside the definition remain in
      the payload.
    sources: [api-modules, module-fingerprint, metadata, canonical-ordering, time-domain-contribution, catalogue-version]

  - id: deterministic-and-sensitive-identity
    kind: semantic
    statement: >-
      Semantically equal stable-keyed modules produce equal fingerprints
      regardless of construction order or private representation. Changing a
      public interface key or signal kind, a mapping or connection endpoint,
      an internal stable identity, primitive kind, semantic role, parameter,
      initial state, state schema, temporal schema, or a nested instance key,
      parent, binding, or referenced module fingerprint changes the canonical
      semantic projection. A user module and a standard module with the same
      primitive graph have different fingerprints. A standard module uses the
      same payload with origin ["standard", standard_origin]. Nested records,
      including standard_origin, use canonical field-name order.
      standard_origin carries core and built-in semantics versions 1, the
      semantic version, expansion version, standard identifier, parameters,
      and internal roles. Role categories are connection, export, input_port,
      node, and output_port. Parameter values use the closed logic_level, u64,
      span, non_zero_span, and enum variants. An internal role omits
      public_input unless it names a public level input, in which case that
      field is the 16-byte level module-input key. Changing a standard
      parameter, semantic or expansion version, identifier, or internal role
      changes that fingerprint. Internal roles are ordered by category name,
      role text, then key. Parameters are ordered by parameter-key text.
    sources: [api-modules, concrete-modules, module-fingerprint, testing-determinism]
    basis: derived

  - id: validated-module-owner
    kind: lifecycle
    statement: >-
      Successful validation computes and stores ModuleFingerprint as intrinsic
      identity of ModuleDef<D>. A blocking-invalid unchecked module cannot
      produce ModuleDef<D>; any private candidate identity used to order or
      scope diagnostics does not establish a validated artifact.
    sources: [concrete-modules, testing-validation]
    basis: derived

implementation_freedom:
  - The section 55 record is the version-1 development projection for both origins. Complete artifact envelopes and decoding remain outside this subject.
  - Private projection types, encoder decomposition, caching, and module placement are unconstrained when the canonical bytes and public opaque value agree.

open_questions: []

