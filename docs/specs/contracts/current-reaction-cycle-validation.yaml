schema_version: "0.1"
id: mossignal.graph.current_reaction_cycle_validation
title: Current-reaction cycle validation
kind: lifecycle
status: reviewed

source_baseline:
  commit: b55e50e90948cdf4c922cd86e94a13f630debca1
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/exhaustive_diagnostic_code_catalogue.md
    - docs/testing_and_verification_policy.md

summary: >-
  Current-reaction cycle validation analyzes the derived reaction dependency
  graph for cyclic SCCs, rejects cyclic definitions with structured evidence,
  and selects deterministic topological metadata only for the acyclic
  restricted graph.

scope:
  includes:
    - SCC-based detection of directed current-reaction cycles and self-loops
    - rejection of a cyclic restricted graph before it becomes a ValidatedNetwork
    - cycle witness evidence tied to stable reaction and authored subjects
    - deterministic topological ordering for the acyclic restricted graph
  excludes:
    - derivation of reaction dependencies and node signatures
    - dense compilation layout, evaluator descriptors, and runtime execution
    - stateful, temporal, module, variadic, and hierarchy-specific cycle paths
    - region discovery and graph-query indexing

known_uncovered:
  - Cycle analysis for reaction facts outside the restricted Constant/Not model

aliases:
  - reaction-cycle validation
  - SCC validation
  - current-reaction acyclicity

requirements:
  - id: complete-cycle-criterion
    kind: semantic
    statement: >-
      Current-reaction dependencies must be acyclic. SCC decomposition is a
      complete cycle criterion: a component is cyclic when it has more than one
      vertex or consists of one vertex with a self-loop; Tarjan, Kosaraju, or
      another established SCC algorithm may be used.
    sources: [api-causality, runtime-scc]

  - id: reject-before-validation-artifact
    kind: lifecycle
    statement: >-
      A current-reaction cycle is invalid, must prevent successful validation
      and compilation, and must not be resolved through fixed-point iteration,
      repeated same-time microsteps, or evaluator traversal order. A
      ValidatedNetwork is constructible only after all static structural and
      semantic requirements, including current-reaction causality, hold.
    sources: [api-causality, runtime-validated, api-validated-network]

  - id: cycle-diagnostic-content
    kind: system_effect
    statement: >-
      A cyclic SCC emits exactly one blocking CallerInput Report condition
      validation.current_reaction_cycle. Its primary subject is the network and
      its discriminator is the canonical ordered set of stable reaction-member
      references, each derived from authored stable identity plus semantic
      reaction role. One canonical ordered witness is evidence rather than
      identity; duplicate detection merges idempotently according to the
      code-specific exact-agreement and set-union law.
    sources: [catalogue-validation, catalogue-cycle-evidence, catalogue-cycle-laws, api-validation-coverage]

  - id: deterministic-topological-metadata
    kind: semantic
    statement: >-
      An acyclic reaction graph admits a topological ordering. The selected
      linear extension should be deterministic, using stable structural ordering
      to break ties where appropriate; the selected order is not semantic, and
      every valid order must produce equivalent settled semantic results.
    sources: [runtime-topological]

  - id: cycle-validation-verification
    kind: verification
    statement: >-
      Verification must reject every true reaction cycle, detect self-loops,
      establish exactly one diagnostic per cyclic SCC, establish that SCC
      diagnostics contain a valid witness, and verify complete diagnostic and
      witness invariance under graph construction and traversal permutations.
      For bounded generated graphs, cycle detection should be cross-checked
      against an independent reachability-based oracle.
    sources: [verification-cycles, verification-determinism]

implementation_freedom:
  - The SCC algorithm, private adjacency representation, witness-search strategy, and topological-sort algorithm are unconstrained.
  - The restricted implementation may retain deterministic topological metadata privately or within the opaque validated artifact.

open_questions: []

