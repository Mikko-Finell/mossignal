schema_version: "0.1"
id: mossignal.identity.module_fingerprint
title: Reusable module semantic fingerprint
kind: artifact
status: reviewed

source_baseline:
  commit: 9704d2e34aaafb52d75cbcdf167aa5304071a99e
  working_tree: dirty

summary: >-
  ModuleFingerprint is the opaque domain-separated identity of one validated
  reusable module's semantic public interface, explicit origin, and module-local
  primitive structure. It is stable across authored insertion order and private
  representation while excluding instance placement and presentation metadata.

scope:
  includes:
    - ModuleFingerprint public value and digest construction
    - semantic inclusion, exclusion, sensitivity, and ordering rules for user modules
    - successful ModuleDef ownership and deterministic verification
  excludes:
    - standard-module declaration and canonical expansion identity
    - module-instance placement, bindings, and containing-network identity
    - complete module-definition artifact encoding and integrity digests
    - compatibility migration and reconfiguration

known_uncovered:
  - The exact canonical field schema for the version-1 user-module semantic payload is not yet frozen by the persistence specification

aliases:
  - ModuleFingerprint
  - semantic module identity
  - reusable module fingerprint

requirements:
  - id: distinct-opaque-module-identity
    kind: public_surface
    statement: >-
      ModuleFingerprint is a public opaque fixed 32-byte value distinct and
      non-interchangeable from NetworkFingerprint, module-instance keys,
      revisions, state digests, and persisted-artifact integrity digests.
    sources: [fixed-fingerprints, concrete-modules]

  - id: domain-separated-digest
    kind: semantic
    statement: >-
      DigestSuiteVersion 1 computes ModuleFingerprint with unkeyed BLAKE3-256
      over a canonical record containing domain label
      mossignal/module_fingerprint/v1, domain version 1, and the selected
      version-1 canonical semantic module payload. No other digest type may
      reuse that domain label.
    sources: [digest-suite, domain-separation, digest-versions, module-fingerprint]

  - id: complete-user-module-projection
    kind: semantic
    statement: >-
      The semantic payload for a user module includes explicit User origin, the
      complete typed public input and output interface with stable keys, every
      output's source incidence, and the complete module-local primitive semantic
      graph: stable node, typed port, and connection identities; endpoint
      incidence; node kinds; semantic port roles; semantic parameters; declared
      initial state; and state or temporal schemas where applicable.
    sources: [api-modules, concrete-modules, module-fingerprint]
    basis: derived

  - id: representation-and-instance-exclusions
    kind: prohibition
    statement: >-
      Module identity excludes caller insertion order, dense indices, memory
      layout, caches, diagnostic names, descriptions, paths, diagnostic origin
      metadata, presentation tags and extensions, module-instance placement,
      instance metadata, network bindings, and containing-network identity.
    sources: [api-modules, module-fingerprint, metadata, canonical-ordering]

  - id: deterministic-and-sensitive-identity
    kind: semantic
    statement: >-
      Semantically equal stable-keyed user modules produce equal fingerprints
      regardless of construction order or private representation. Changing a
      public interface key or kind, output-source incidence, internal stable
      identity, primitive kind, semantic role, parameter, initial state, state
      schema, temporal schema, or internal connection incidence changes the
      canonical semantic projection.
    sources: [api-modules, concrete-modules, module-fingerprint, testing-determinism]
    basis: derived

  - id: validated-module-owner
    kind: lifecycle
    statement: >-
      Successful validation computes and stores ModuleFingerprint as intrinsic
      identity of ModuleDef<D>. A blocking-invalid unchecked module cannot
      produce ModuleDef<D>; any private candidate identity used to order or
      scope diagnostics does not establish a validated artifact.
    sources: [concrete-modules, testing-validation]
    basis: derived

implementation_freedom:
  - Because the exact version-1 module payload record is not yet frozen, implementation may choose the smallest deterministic canonical field schema consistent with every inclusion, exclusion, ordering, and domain rule above; record the exact bytes in golden tests for concrete review.
  - Reuse of the existing canonical-value encoder and primitive semantic projections is permitted and preferred over a second encoding model; complete artifact envelopes and decoding remain outside this subject.
  - Private projection types, encoder decomposition, caching, and module placement are unconstrained when the canonical bytes and public opaque value agree.

open_questions: []

