schema_version: "0.1"
id: mossignal.identity.input_schema_fingerprint
title: Input schema fingerprint
kind: artifact
status: reviewed

source_baseline:
  commit: 22c66d24e9fd2123f418a605b0eb324223351ef2
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/api_and_semantics_spec.md
    - docs/specs/concrete_rust_api_surface.md
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md
    - docs/testing_and_verification_policy.md

summary: >-
  InputSchemaFingerprint is the opaque deterministic identity of the complete
  externally supplied input schema, kept distinct from network identity so
  snapshots, deltas, and patch-target inputs can bind observations to stable
  typed endpoints rather than collection positions.

scope:
  includes:
    - InputSchemaFingerprint value identity
    - canonical external-input schema projection
    - metadata and display-order exclusions
    - relationship to future network-bound input artifacts
  excludes:
    - InputSnapshot and InputDelta contents or builder behavior
    - topology revision semantics and patch preparation
    - persistence artifact envelopes and decoding

aliases:
  - InputSchemaFingerprint
  - input schema identity
  - target input schema

requirements:
  - id: distinct-opaque-identity
    kind: public_surface
    statement: >-
      InputSchemaFingerprint is a public opaque deterministic fingerprint kept
      distinct and non-interchangeable from NetworkFingerprint and structural
      keys; as an initial fingerprint its canonical representation is exactly
      32 bytes.
    sources: [nonstructural-identities, fixed-fingerprints]

  - id: canonical-schema-projection
    kind: semantic
    statement: >-
      The restricted version-1 payload is the exact canonical inputs record
      defined by the persistence specification. Each entry contains its stable
      external-input key, level signal kind, and required establishment variant,
      ordered by signal-kind tag then stable key bytes. Required applies when no
      prior authoritative value exists and does not require later deltas to
      repeat retained values.
    sources: [input-schema-projection]

  - id: digest-construction
    kind: semantic
    statement: >-
      DigestSuiteVersion 1 computes InputSchemaFingerprint as unkeyed BLAKE3
      with a 256-bit output over the canonical wrapper with domain label
      mossignal/input_schema_fingerprint/v1, version 1, and the exact restricted
      payload. No duplicate projection-version field appears inside the payload.
    sources: [digest-suite, domain-separation, input-schema-projection]

  - id: metadata-exclusion
    kind: prohibition
    statement: >-
      InputSchemaFingerprint excludes DiagnosticMeta, names, descriptions,
      paths, origins, tags, presentation extensions, and display or authored
      collection order.
    sources: [nonstructural-identities, input-schema-projection, api-metadata]

  - id: deterministic-schema-identity
    kind: semantic
    statement: >-
      Equal complete typed external-input schemas produce equal fingerprints
      regardless of authored insertion order; changing an external-input stable
      key, signal kind, establishment requirement, other included semantic field,
      or schema-projection version changes the canonical digest input.
    sources: [nonstructural-identities, input-schema-projection, deterministic-compilation]

  - id: validated-network-owner
    kind: lifecycle
    statement: >-
      Successful validation computes InputSchemaFingerprint and exposes it on
      ValidatedNetwork; later compilation carries the same value unchanged into
      CompiledNetwork without accepting another identity context.
    sources: [api-validated, concrete-validated]

  - id: future-input-binding
    kind: lifecycle
    statement: >-
      Future InputSnapshot, InputDelta, and target-bound patch inputs carry the
      input schema fingerprint alongside network identity so stale or foreign
      endpoint observations can be rejected without positional rebinding.
    sources: [input-schema-binding]

implementation_freedom:
  - Private schema-projection and sorting representations are unconstrained when the canonical complete set and fingerprint bytes remain deterministic.
  - A narrow canonical-value encoder may be shared with NetworkFingerprint without implementing complete persistence artifacts.

open_questions: []

