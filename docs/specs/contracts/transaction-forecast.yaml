schema_version: "0.1"
id: mossignal.runtime.transaction_forecast
title: Transaction forecasting
kind: lifecycle
status: reviewed

source_baseline:
  commit: b10d2259acf725efb759c6512cce5e9dca574a38
  working_tree: clean

summary: >-
  Forecasting one transaction runs the ordinary machine transition on
  unpublished candidate state and returns an owned hypothetical result. It
  does not publish that candidate or add a second evaluator.

scope:
  includes:
    - one proposed transaction forecast through the same transition as apply
    - owned ForecastResult, read-only ForecastState, and ForecastBasis
    - non-mutation of the source machine and equivalence with cloned apply
    - structured failure identical to application failure
  excludes:
    - topology-patch preparation, multi-step speculation, and background execution
    - forecast replay marking, forecast snapshot persistence, and a second evaluator

known_uncovered:
  - Topology-patch preparation, correspondence, and attaching a prepared patch. Finalization stays inside the shared transition once a transaction carries one
  - Speculative multi-transaction branches, background execution, and caching a forecast as machine state
  - Forecast-marked replay frames whose hypothetical status stays visible
  - Persisting or restoring a forecast snapshot, and any separate forecast artifact format
  - A public machine fork, a bound-machine forecast façade, and generated long-history forecast campaigns

aliases:
  - Machine::forecast
  - ForecastResult<D>
  - ForecastState<D>
  - ForecastBasis<D>
  - Forecast(M, τ)

requirements:
  - id: shared-transition
    kind: semantic
    statement: >-
      Forecast(M, τ) = Apply(Clone(M), τ). Machine::forecast runs that same
      deterministic transition on unpublished candidate state. The transition
      includes validation, initialization rules, deadline processing, patch
      finalization, migration, reaction settlement, budget accounting,
      provenance, diagnostic episodes, and output and result construction. Forecasting must not copy those steps into a second
      evaluator. Patch preparation remains a separate structural artifact;
      an exact patch preview is this forecast of a patch-bearing transaction,
      not preparation itself.
    sources: [processor-forecast, api-forecast, api-machine, concrete-forecast, processor-patch-preview, reconfig-exact-forecast]

  - id: source-unchanged
    kind: prohibition
    statement: >-
      Forecast borrows the original machine and consumes the transaction on
      both success and failure. It does not mutate that machine. The unchanged
      semantic state includes topology, revision, logical time, external
      levels, node and temporal state, the pending-event calendar and its
      public event-identity cursor, output baselines, provenance roots,
      active diagnostic episodes, and the execution-state digest. Schedule is
      the public projection of that calendar, not a separate stored cursor.
      Observer delivery cursors live outside the semantic machine.
    sources: [concrete-forecast, api-forecast, testing-forecast, processor-transition, persistence-event-cursor, api-scheduling, processor-observer, processor-cursors]

  - id: owned-forecast-result
    kind: public_surface
    statement: >-
      Success returns an owned ForecastResult<D>, distinct from Machine<D>
      and from TransactionResult<D>. ForecastResult exposes result, state,
      basis, and into_parts. result is the transaction result the shared
      transition produced. state is the unpublished candidate. basis carries
      the base topology revision, the base execution-state digest of the
      machine before the forecast, the transaction's requested time, and that
      machine's runtime policy id. That digest is the forecast freshness
      identity, not the successor digest. The basis retains the base revision
      and the forecast's topology binding where that binding is needed.
    sources: [concrete-result, concrete-owned, concrete-revision, api-forecast, testing-forecast, processor-forecast, processor-execution-digest, reconfig-exact-forecast]

  - id: hypothetical-only
    kind: prohibition
    statement: >-
      A forecast is explicitly hypothetical. It is not a reservation, a
      commit token, or a later automatic commit, and it does not become
      committable by itself. ForecastState must not provide apply, mutation,
      or implicit commit. Equivalent commitment requires a new explicit
      transaction whose preconditions still hold, including the then-current
      revision and, where desired, the expected execution-state digest.
      Persisting or restoring a forecast snapshot is a separate explicit
      operation, not conversion of the forecast into the live machine.
    sources: [api-forecast, concrete-result, reconfig-no-commit, reconfig-exact-forecast, processor-forecast]

  - id: agreement-and-failure
    kind: semantic
    statement: >-
      A successful forecast agrees with Apply(Clone(M), τ) and with a later
      apply of that same semantic transaction to the original machine while
      that machine is still unchanged. The agreement covers the transaction
      result and the resulting semantic state. A structured failure returns
      the same RuntimeFailure<D> that apply would return for that transaction,
      returns no ForecastResult, and does not publish the failed candidate.
      Divergence from applying the same transaction to an unpublished clone is
      the library defect internal.forecast_divergence, not an ordinary caller
      RuntimeFailure.
    sources: [testing-forecast, testing-refinement, api-forecast, concrete-forecast, catalogue-divergence, catalogue-defects, catalogue-runtime, catalogue-internal-defects]

  - id: forecast-verification
    kind: verification
    statement: >-
      Tests must show that a forecast agrees with apply of the same transaction
      on an unpublished clone, that the original machine is unchanged on both
      success and structured failure, and that the basis is that original's
      revision, execution-state digest, requested time, and runtime policy id.
    sources: [testing-forecast, testing-refinement]

recommendations:
  - id: read-only-projections
    statement: >-
      ForecastState should support the same read-only inspection, explanation,
      schedule, digest, and snapshot projections as a committed machine.
      Equivalent direct inspection and explanation should exist on that state.
    sources: [concrete-result, concrete-inspection, concrete-explanation, concrete-snapshot]

  - id: private-clone-only
    statement: >-
      Machine should not implement Clone as an ordinary convenience unless the
      cost and semantic meaning are explicit. Internal forecast may use a
      private clone path. A public fork, if independent machine duplication
      becomes a supported use case, is not a forecast and not a commit.
    sources: [concrete-cloning]

implementation_freedom:
  - Private construction of the unpublished clone, and whether ForecastState owns a private machine or another candidate representation, are free when the result remains the ordinary transition, the original machine is untouched, Machine gains no ordinary Clone, and ForecastState does not expose apply, mutation, or implicit commit.
  - Basis field visibility is free when the four basis identities stay readable and the ForecastResult accessors remain available. Which recommended read-only projections are forwarded is a recorded choice under that recommendation.

open_questions: []

