schema_version: "0.1"
id: mossignal.persistence.machine_snapshot_artifact
title: Canonical machine snapshot artifact
kind: artifact
status: reviewed

source_baseline:
  commit: 2100fc027ead42e5526c81eda611443af2de8f83
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md

summary: >-
  A machine snapshot is one standalone, versioned, self-contained artifact for
  a committed machine: the MSIG prefix, one canonical CBOR envelope of kind
  machine_snapshot, and the stable-keyed payload whose envelope integrity
  digest is SnapshotDigest. Encoding produces those bytes. It does not decode
  or restore them.

scope:
  includes:
    - standalone machine_snapshot framing, envelope, version vector, and SnapshotDigest
    - payload identity, lifecycle, state, pending events, required observation, and provenance closure
    - optional history and persistence metadata only as snapshot-digest inputs
    - pure creation from a committed machine and encoding checks that avoid corrupt bytes
    - golden artifact bytes and snapshot-digest distinctions for this artifact
  excludes:
    - decoding, hostile-byte acceptance, CompiledNetwork::restore, and restoration reports
    - replay frames and logs, definition and policy artifacts, and checkpoint bundles
    - topology replacement, semantic migration, and schema-upgrade execution
    - compression, streaming, encryption, signatures, and file-system access
    - execution-state and observable-state digest projection rules except embedding their results

known_uncovered:
  - Syntactic decoding, canonicality rejection, resource limits, and header inspection of untrusted bytes
  - Restoration validation, settled-state recomputation, and snapshot round trip or sufficiency
  - Replay artifacts, transaction records, and checkpoint-bundle assembly
  - ForecastState::snapshot and any forecast digest accessor
  - A retention policy that produces optional history; absence remains representable
  - Provenance checkpoint compaction and externally resolved checkpoint dependencies
  - Payloads for artifact kinds other than machine_snapshot
  - Historical compatibility support, schema upgraders, and semantic migration reports

aliases:
  - MachineSnapshot<D>
  - MachineSnapshotArtifact
  - SnapshotDigest
  - machine_snapshot
  - encode_snapshot

requirements:
  - id: standalone-framing
    kind: persistence
    statement: >-
      One standalone machine snapshot is exactly eight prefix bytes, 4d 53 49
      47 0d 0a 1a 0a, followed by one canonical CBOR body. The body is the
      variant ["mossignal_artifact", envelope_record] and nothing follows it.
      The body is uncompressed. The prefix is framing, not a digest input.
      For one supported artifact value and version vector there is exactly one
      canonical byte sequence. The encoder must not emit a non-shortest or
      otherwise noncanonical alternate.
    sources: [encoding-foundation, artifact-prefix, canonical-bytes, compression]

  - id: envelope-and-kind
    kind: persistence
    statement: >-
      The envelope record contains artifact_kind, artifact_schema_version,
      canonical_encoding_version, core_semantics_version,
      diagnostic_schema_version, digest_suite_version, envelope_schema_version,
      integrity_digest, node_semantics_version, patch_semantics_version,
      payload, provenance_semantics_version, and time_domain_id, each exactly
      once, in ascending raw UTF-8 field-name order. artifact_kind is
      machine_snapshot. time_domain_id is the network's bound 16-byte
      TimeDomainId and is not null. Encoding through a PersistenceContext<D>
      whose TimeDomainId differs does not emit bytes.
    sources: [envelope-shape, artifact-kinds, persistence-context, scalar-domains]

  - id: recorded-version-vector
    kind: compatibility
    statement: >-
      The envelope carries the complete version vector: envelope schema,
      canonical encoding, digest suite, artifact schema, core semantics,
      built-in node semantics, topology-patch semantics, provenance semantics,
      and diagnostic schema. Each component is an unsigned 32-bit identifier.
      Numeric adjacency has no compatibility meaning. The current root-directed
      profile emits snapshot artifact schema 3, provenance semantics 3,
      and unchanged other components 2. The payload
      carries the same semantic components, which are core, built-in node,
      topology-patch, provenance, and diagnostic schema versions, and does not
      invent a second numbering. This encoder emits that exact mixed vector only
      and must not implicitly downgrade or upgrade.
    sources: [version-vector, version-representation, version-responsibilities, no-downgrade, snapshot-common, current-root-profile]

  - id: snapshot-digest-identity
    kind: semantic
    statement: >-
      SnapshotDigest is a public opaque 32-byte identity, distinct from
      ExecutionStateDigest, ObservableStateDigest, NetworkFingerprint,
      ModuleFingerprint, InputSchemaFingerprint, RuntimePolicyId, and
      NetworkRevision. The unchanged current suite computes it as unkeyed BLAKE3-256
      over the canonical domain record with label mossignal/snapshot_digest/v2,
      domain version 2, and payload equal to the canonical envelope record
      with integrity_digest omitted. The prefix is not an input. The snapshot
      payload does not contain a second digest field. The in-memory snapshot
      exposes that envelope digest as SnapshotDigest. It covers execution
      state, required observation, any retained optional history, checkpoint
      metadata, persistence metadata, presentation extensions, and the
      artifact and semantic version vector, and it excludes only its own
      digest field. It is not authenticity.
    sources: [digest-suite, domain-separation, envelope-integrity, digest-placement, snapshot-digest, fixed-digests, api-digest-scopes, concrete-identities, authenticity, current-root-profile]

  - id: payload-identity
    kind: persistence
    statement: >-
      The payload is one canonical record and contains network_key,
      network_fingerprint, time_domain_id, topology_revision, lifecycle,
      the semantic version components, execution_state_digest,
      observable_state_digest, runtime_policy_id, next_pending_event_serial,
      node_state_table, temporal_state_table, active_diagnostic_episodes,
      and provenance. Those two digests equal the committed machine's
      execution and observable digests. network_key and time_domain_id are
      16-byte unsigned big-endian strings. Fingerprints and digests are
      32-byte strings. Time, revision, and the pending-event serial use the
      unsigned integer domains. Required fields are present; empty required
      collections are empty arrays, not omitted fields.
    sources: [snapshot-common, snapshot-creation, scalar-domains, stable-keys, fixed-digests, api-snapshots]

  - id: lifecycle-shape
    kind: persistence
    statement: >-
      lifecycle is a closed variant. Awaiting initialization contains no
      fabricated current logical time, external level valuation, settled level
      facts, output baselines, pending calendar, runtime provenance roots,
      runtime diagnostic episodes, or derived schedule. Ready contains the
      current logical time, the authoritative external level valuation, the
      settled level facts, the established output baselines, the pending
      calendar, the required provenance roots, and the current explanation
      checkpoint state. The schedule is derived and is not authoritative
      payload. Every ready deadline is strictly later than snapshot time, and
      canceled events are absent.
    sources: [uninitialized-snapshot, ready-snapshot, pending-events, api-snapshots, runtime-contents]

  - id: state-and-pending-facts
    kind: persistence
    statement: >-
      Node and temporal tables are sorted entries of stable owner, expected
      node kind, state-schema variant, state value, and cause or revision
      context where that schema requires them. The initial families include
      edge-detector observation, Boolean stored level, pulse-delay temporal
      state, transport remembered input and output, inertial remembered input
      and output with its optional candidate, and periodic anchor, previous
      enable, and next eligible boundary. Pending events stay in the calendar
      and are not copied into opaque node-owned queues. Temporal state refers
      to a singular candidate or next boundary by public PendingEventKey.
      Each pending record contains that key, stable owner, event kind,
      deadline, semantic payload, multiplicity where applicable, originating
      time, originating revision, and originating CauseDigest. The initial
      payloads are pulse_delay_group with pulse count and grouped causal
      contribution records, transport_transition with target level and
      originating time, inertial_maturation with target level and
      qualification origin, and periodic_boundary with phase anchor and
      non-negative boundary ordinal. The event kind must agree with the
      owning node kind. PendingEventKey is the public monotonic serial.
      next_pending_event_serial is greater than every pending or retained public serial.
      Top-level owners stay authored keys. A module-owned state entry, pending
      event, episode, or provenance subject uses the module-internal stable
      key qualified by the full outermost-to-innermost ModuleInstanceKey path.
      Neither a single innermost key nor a compiler flat key or dense index is
      that owner. Pulse-delay payloads stay in the calendar, and temporal
      state does not copy them. A temporal entry refers to a public
      PendingEventKey only for a singular candidate or next boundary.
      Migration-relevant event metadata is encoded only when the committed
      event has it. State is ordered by owner. Pending events are ordered by
      deadline, owner, event kind, and public key. Equal-deadline storage
      order is not semantic. Instance-path order is semantic.
    sources: [state-tables, state-schemas, pending-events, event-identity, catalogue-snapshot-state, module-qualified-identity, nested-modules, canonical-ordering, scalar-domains]

  - id: required-observation
    kind: persistence
    statement: >-
      A ready snapshot contains settled level facts for external level inputs,
      node level inputs, node level outputs, and external level outputs, keyed
      by typed stable identity. External level inputs remain settled facts
      when the ready lifecycle also carries the same authoritative valuation.
      Those facts are observations, not an execution
      path. Each external level output baseline contains its key, established
      marker, published level, and current cause root. A ready machine has an
      established baseline for every such output, and an uninitialized machine
      has none. Pulse counts are not current port state. Each active episode
      contains its identity, diagnostic code, primary stable subject,
      condition discriminator, began_at, last material change, current
      structured evidence, required cause roots, and revision context.
      Completed episodes are not active state. Diagnostic codes use their
      stable code strings.
    sources: [settled-levels, output-baselines, pulse-state, episodes, canonical-enums, data-classes]

  - id: self-contained-provenance
    kind: persistence
    statement: >-
      The provenance section contains the content-addressed records for the
      required roots of stateful state, pending events, output baselines, and
      active diagnostic evidence, plus any checkpoint record and retention
      boundary the committed machine already has. An ordinary snapshot holds
      the complete backward closure of every required root and does not leave
      an unresolved external provenance record. Each persisted record is the
      canonical provenance record for its CauseDigest; the artifact does not
      give one cause a second spelling. Records are ordered by
      CauseDigest. A persisted cause reference is a 32-byte CauseDigest.
      Private CauseRef values and arena positions are not persisted.
      External artifact ownership does not select snapshot roots; additional
      machine retention of explicit last-reaction evidence is not automatically
      canonical state. Preserve any current inspection fact required by the
      observable projection and the complete source closure selected by a
      root-directed TopologyChange, under its existing declared boundary.
      The current source manifest must be recoverable for a later patch, including
      operation/port and latest module cause roles and original canonical content;
      excluded raw caches cannot be their sole representation.
      The schema's current_roots records only associations not uniquely
      represented by existing input/state/event/baseline/episode facts, with
      stable typed subjects, semantic roles and CauseDigests. Subject/role pairs
      are canonical, unique, fully qualified and never dense indices; optional
      absent roles are omitted and uninitialized roles are empty. Exact coverage,
      kind coherence and complete closure are validated. Topology-derived aliases
      need no duplicate authoritative binding, and arbitrary latest-by-storage
      reconstruction is insufficient.
    sources: [required-provenance, provenance-order, cause-references, current-root-profile]

  - id: history-and-metadata
    kind: persistence
    statement: >-
      optional_history, when present, is partitioned into named retention
      classes, each with a retention boundary and completeness claim.
      Absence claims nothing and is not empty fabricated history. The
      evaluator must not consult it. Persistence metadata may include an
      implementation identifier, human label, source correlation, or
      presentation extensions, and a caller-supplied wall-clock value is
      metadata rather than logical time. Presentation extensions are opaque,
      ordered by namespace, included in SnapshotDigest, and excluded from
      semantic fingerprints and both state digests. Optional history and
      metadata must not change either state digest. Two snapshots may share
      both state digests and differ in SnapshotDigest only because this
      retained material differs.
    sources: [optional-history, persistence-metadata, extensions, text, pulse-state, snapshot-digest, runtime-snapshot-digest]

  - id: installed-topology-and-policy
    kind: persistence
    statement: >-
      Installed topology identity in the payload is network_key plus
      network_fingerprint. The snapshot does not embed a network definition,
      module definition, standard expansion, runtime-policy body, or checkpoint
      bundle. Module-owned state uses qualified stable identity.
      runtime_policy_id is the machine's existing policy identity. A snapshot
      does not contain the compiled network or policy value; those are supplied
      outside the artifact.
    sources: [snapshot-common, checkpoint-bundle, catalogue-snapshot-state, not-serialized, api-snapshots]

  - id: pure-creation
    kind: public_surface
    statement: >-
      Machine::snapshot returns an owned MachineSnapshot<D> of one complete
      committed machine version. It must not borrow the machine, race with
      partial publication, or mutate the machine. Creation projects stable
      semantic state, uses the content-addressed provenance records, copies
      the two state digests, includes optional history only under an explicit
      retention policy, canonicalizes the payload, and computes SnapshotDigest
      by the envelope rule. Encoding validates the in-memory invariants needed
      to avoid emitting corrupt canonical bytes. The artifact must not persist
      raw memory, Rust discriminants, dense indices, pointers, arena slots, or
      platform layout.
    sources: [snapshot-creation, snapshot-contract, concrete-snapshot, encoding-apis, no-raw-memory]

  - id: encoding-verification
    kind: verification
    statement: >-
      Versioned golden vectors must retain the complete prefixed canonical
      bytes and SnapshotDigest for an uninitialized machine, a ready machine,
      every built-in state family this revision can own, pending temporal
      work, and an active diagnostic episode. Tests must show permutation
      invariance of non-semantic storage order, order sensitivity where the
      specification defines semantic order, and that metadata or optional
      history can change SnapshotDigest while both embedded state digests stay
      unchanged. They must show that the embedded digests match the machine
      and that creation and encoding leave the machine unchanged. They compare
      canonical bytes. The retained bytes must exhibit the required prefix,
      envelope fields, and payload facts, rather than being accepted only
      because this encoder emitted them. Digest equality does not replace
      semantic validation, and this subject does not require a decoder,
      restorer, or exact round trip.
    sources: [golden-vectors, canonical-vectors, permutation-invariance, order-sensitivity, digest-scope-tests, encoder-independence, snapshot-creation]

recommendations:
  - id: persistence-module
    statement: >-
      Canonical encoding should live in a persistence module that does not own
      file-system access, with an encode operation broadly equivalent to
      encode_snapshot(context, snapshot) -> Result<ArtifactBytes, EncodeFailure>.
    sources: [persistence-module, encoding-apis]

  - id: snapshot-summary-access
    statement: >-
      MachineSnapshot<D> should expose status, revision, fingerprint, both
      state digests, snapshot_digest, and runtime_policy_id without exposing
      mutable internals.
    sources: [concrete-access]

  - id: digest-value-capabilities
    statement: >-
      SnapshotDigest should provide Clone, Copy, Eq, Hash, Ord, Debug, and
      Display with a stable hexadecimal representation.
    sources: [concrete-identities]

  - id: hand-authored-goldens
    statement: >-
      Where a second encoder is impractical, hand-authored golden artifact
      bytes should supplement tests so shared field-omission defects are
      visible.
    sources: [encoder-independence]

implementation_freedom:
  - Sections 85 and 91 name payload facts and state families, not a closed nested CBOR spelling. Use the simplest deterministic spelling. Where section 54.2 already names a state or temporal schema, use that name, including edge_observation, stored_level, pending_pulse_group, remembered_input_output, pending_transport_transition, pending_inertial_candidate, periodic_anchor_previous_enable, and pending_periodic_boundary. Use the section 92 event-kind names rather than any different digest-projection tag. Reuse the existing execution-projection spelling only where it already matches those names and facts. Record the spelling in the goldens and the close-out.
  - Do not duplicate a common payload fact inside the lifecycle variant. The uninitialized variant may be payloadless when every fact it would carry is already a common field and no ready fact is fabricated.
  - Omit optional_history, persistence metadata, migration metadata, and presentation extensions when the committed machine has none. Do not add a history-retention producer. A test-only or narrowly explicit metadata input is enough to prove the snapshot-digest distinction.
  - Grouped pulse-delay contributors are the contributors the committed event still retains, ordered as provenance contributions. Do not change pulse-delay execution to recover contributors the machine did not store, and do not invent them.
  - When the committed machine has no provenance checkpoint, encode the explanation boundary as complete from initialization, using the same boundary fact as the observable-state digest. Do not omit that ready fact and do not implement checkpoint compaction.
  - Persist each CauseDigest as 32 bytes in the artifact. Do not add a public CauseDigest type in the slice that introduces snapshot encoding.
  - Reuse the existing CBOR writer and domain-separated digest function. A public schema registry is unnecessary. ArtifactBytes may be the owned prefixed Vec or an equivalent newtype. Context mismatch is the structured encode failure; projecting a committed machine that already satisfies its invariants need not fail.

