schema_version: "0.1"
id: mossignal.node.toggle
title: Pulse-controlled Toggle primitive
kind: node
status: reviewed

source_baseline:
  commit: 78de588a856c49774816e513e38326e8e714bda5
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md

summary: >-
  Toggle is a one-cell stateful Pulse-to-Level primitive whose current output
  and committed successor invert exactly when the simultaneous pulse count is odd.

scope:
  includes:
    - Toggle's port shape, configuration, parity transition law, and causality
    - typed and dynamic authoring, validation, compilation, and evaluation
    - initialization, committed-state inspection, provenance, and conformance
    - pre-stability network-fingerprint extension boundary
  excludes:
    - resettable toggles, edge detectors, latches, sample-hold, and temporal nodes
    - general state-slot ownership and atomic successor commitment
    - snapshot encoding, restoration, replay, and topology migration
    - complete explanation rendering and inspection subscriptions

known_uncovered:
  - Canonical snapshot state schema and restoration validation for Toggle
  - Compatible topology migration and reset handling for Toggle state
  - Complete current and why-not explanation rendering for even pulse batches
  - Authored Toggle cycle conformance once a Level-to-Pulse primitive is available

aliases:
  - Toggle
  - ToggleConfig
  - pulse-controlled parity state

requirements:
  - id: fixed-shape-and-explicit-initial-state
    kind: semantic
    statement: >-
      Toggle has exactly one Pulse input named toggle, one Level output, one
      stored LogicLevel state cell, and a required explicit initial LogicLevel.
      It has no optional reset port; resettable behavior belongs to a named
      module or a separately specified future node.
    sources: [toggle-law, concrete-config]

  - id: parity-output-and-successor-law
    kind: semantic
    statement: >-
      Given previous stored level s and complete simultaneous pulse count n,
      even n produces current output s and proposes s, while odd n produces
      current output not-s and proposes not-s. Pulse multiplicity is interpreted
      only by parity, and the state cell commits once after complete settlement.
    sources: [toggle-law, simultaneous-batches]

  - id: immediate-dependency-and-visibility
    kind: semantic
    statement: >-
      Toggle's conservative current-reaction signature contains its Pulse
      input-to-Level-output dependency. The settled current output is available
      downstream in the same reaction, while the proposed successor never feeds
      the same reaction; cycles through Toggle remain blocking current-reaction
      cycles when they follow its instantaneous input-to-output path.
    sources: [toggle-law, dependency-signature, api-causality]

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      The public configuration value is ToggleConfig with an initial LogicLevel.
      NetworkBuilder provides a typed toggle convenience accepting Signal<Pulse>
      and an explicit add_toggle form exposing NodeKey and metadata. Dynamic
      definitions use the closed NodeKind::Toggle(ToggleConfig) and stable typed
      fixed-shape ports; malformed direct definitions remain validation input.
    sources: [builder-toggle, builder-keyed, concrete-config, dynamic-node-kind]

  - id: validation-compilation-and-state-layout
    kind: semantic
    statement: >-
      Structural validation enforces Toggle's one-Pulse-input and one-Level-output
      shape and retains its current dependency for cycle analysis. Compilation
      preserves stable subject correspondence, assigns exactly one Toggle-family
      state slot with the declared initial value, and emits a descriptor that
      reads that slot and settled pulse input without public dense identities.
    sources: [dependency-signature, runtime-compilation, runtime-invariants]

  - id: initialization-and-ready-reactions
    kind: lifecycle
    statement: >-
      During initialization, declared initial level is the previous state and
      the initial pulse batch is processed by the ordinary Toggle law before the
      first settled output and successor commit. Every ready reaction likewise
      uses its complete same-time pulse count; a zero count does not invert
      state.
    sources: [builtin-initialization, toggle-law, first-transaction, ready-transaction]

  - id: inversion-causality-and-inspection
    kind: system_effect
    statement: >-
      Toggle retains the cause of its latest inversion. Node inspection exposes
      the declared initial level before initialization and the committed stored
      level plus applicable latest inversion cause after initialization. An even
      batch may support the current output explanation but does not replace the
      latest inversion cause.
    sources: [toggle-law, builtin-inspection, concrete-inspection]

  - id: pre-stability-toggle-identity-extension
    kind: compatibility
    statement: >-
      Network identity represents Toggle's node kind, Pulse input and Level
      output roles, one-cell state schema, and declared initial level. Before the
      first stable fingerprint baseline, adding Toggle to development projection
      version 1 does not require a historical reader, upgrader, or migration
      path, but the exact authoritative projection, affected contract, and every
      affected golden vector must change together; accidental byte drift remains
      prohibited.
    sources: [network-fingerprint, restricted-network-fingerprint, fingerprint-versions]

  - id: toggle-conformance
    kind: verification
    statement: >-
      Reusable conformance exhausts both previous levels and bounded even and odd
      pulse counts, including zero and counts greater than one, and covers
      declared-state initialization, later reactions, same-reaction downstream
      visibility, the immediate dependency signature, typed-versus-dynamic
      equivalence, state inspection, latest-inversion causal rooting,
      insertion-order invariance, fingerprint parameter sensitivity, and
      complete failure atomicity.
    sources: [builder-toggle, dynamic-node-kind, network-fingerprint, testing-validation, testing-compilation, testing-fingerprint, testing-initialization, testing-current-state, testing-primitive, testing-stateful-chain, testing-provenance, testing-current-vs-latest, testing-failure-atomicity]

implementation_freedom:
  - Exact fixed-port derivation, explicit exact-port constructor grouping, private descriptor fields, parity calculation, and Toggle state-slot representation are free when stable identity and the parity law are preserved.
  - Choose the simplest deterministic Toggle variant and state-schema spelling for the synchronized pre-stability version-1 fingerprint projection, then record it in authority, the affected contract, and golden vectors during implementation.
  - A focused owned Toggle inspection result may precede the broader generic inspection-query and subscription system.

open_questions: []

