schema_version: "0.1"
id: mossignal.runtime.initialization_transaction
title: Restricted level initialization transaction
kind: lifecycle
status: reviewed

source_baseline:
  commit: d2ca287958d9a33c4eb687dae5d589be99c9611d
  working_tree: dirty

summary: >-
  The first successful transaction initializes an AwaitingInitialization
  machine at an arbitrary logical time from one complete exact-bound level
  InputSnapshot, settles the ordinary restricted reaction graph, and publishes
  the complete Ready state and level-output establishment events atomically.

scope:
  includes:
    - owned explicit initialization transaction and exact revision expectation
    - restricted level-only initialization of Constant and Not networks
    - complete snapshot validation and ordinary full evaluation
    - correctness-oriented atomic staging, commitment, and rejection
    - authoritative external levels, settled values, and LevelEstablished events
    - minimal resolvable causal provenance for initialization output events
  excludes:
    - InputDelta and every transaction applied to an already Ready machine
    - topology patches and reconfiguration during initialization
    - pulse, stateful, temporal, pending-event, and diagnostic-episode semantics
    - persistence, replay, forecasting, observer delivery, and optimized staging

known_uncovered:
  - Complete explanation-oriented provenance beyond the initialization roots and result-owned view needed to resolve this slice's output events.
  - Execution and observable state digests in the eventual full TransactionResult surface.
  - Pulse batches, successor state, temporal obligations, schedules, runtime occurrences, and persistent diagnostic episodes during initialization.

aliases:
  - Transaction<D>::initialize
  - Machine<D>::apply
  - first transaction
  - initialization transaction
  - LevelEstablished

requirements:
  - id: owned-explicit-initialization-value
    kind: public_surface
    statement: >-
      Initialization is represented by an owned explicit Transaction<D> value,
      not primarily by a closure. Transaction::initialize takes the requested
      Time<D>, exact expected NetworkRevision, and one InputSnapshot<D>, keeps
      the lifecycle distinction visible, and is consumed by Machine::apply.
    sources: [api-transactions, concrete-transaction-values, concrete-transaction-constructors, concrete-apply]

  - id: exact-initialization-preconditions
    kind: semantic
    statement: >-
      Applying an initialization transaction requires an
      AwaitingInitialization machine, an expected revision equal to the
      machine's current revision, and a complete snapshot bound to the machine's
      exact NetworkKey, NetworkFingerprint, and InputSchemaFingerprint. A
      lifecycle, revision, network, or schema mismatch is a structured runtime
      rejection.
    sources: [api-first-transaction, api-snapshot, schema-binding, lifecycle-codes, runtime-codes, input-codes]

  - id: arbitrary-initial-time
    kind: semantic
    statement: >-
      The successful first transaction establishes its requested Time<D> as the
      machine's initial logical time. Time need not begin at zero, and this
      initialization slice has no prior due events or earlier machine time to
      advance through.
    sources: [runtime-first-transaction, runtime-time, api-first-transaction]

  - id: ordinary-restricted-evaluation
    kind: semantic
    statement: >-
      Initialization supplies the snapshot's complete authoritative external
      levels as reaction root facts and invokes the ordinary full topological
      evaluator for the restricted Constant/Not topology. It must not use a
      reduced, special, partially propagating, or initialization-only evaluator.
    sources: [runtime-first-transaction, api-first-transaction, api-settlement]

  - id: complete-ready-state-on-success
    kind: lifecycle
    statement: >-
      On success, one commit changes the lifecycle to Ready at the requested
      time while retaining the unchanged topology revision and policy identity,
      installs the snapshot as the authoritative external level valuation, and
      stores the complete settled level results and external output baselines.
    sources: [runtime-first-transaction, runtime-output-establishment, api-first-transaction, api-revision]

  - id: established-output-events
    kind: system_effect
    statement: >-
      Every external level output's first committed settled value is published
      as LevelEstablished at the initialization time and current revision. It
      must not be fabricated as LevelChanged from Low or from an unknown third
      value. The flat event collection is deterministic, including for events
      sharing the initialization time.
    sources: [runtime-output-establishment, api-output-events, concrete-output-events]

  - id: applicable-runtime-policy-budgets
    kind: semantic
    statement: >-
      Initialization validates the machine's associated runtime policy and
      enforces every semantic budget with an implemented accounting boundary.
      Exceeding an applicable budget rejects the complete transaction without
      skipping required work or publishing partial settlement.
    sources: [api-first-transaction, api-runtime-policy, runtime-budget-failure]

  - id: resolvable-initialization-causes
    kind: system_effect
    statement: >-
      Every externally observable initialization establishment carries an
      opaque CauseRef. The successful owned result retains an immutable
      ProvenanceView sufficient to resolve each returned reference to a
      structured acyclic derivation terminating in authoritative initialization
      roots such as the committed transaction and external observations; a
      private arena position must not become durable external identity.
    sources: [runtime-provenance-records, runtime-causal-provenance, api-causal-provenance, concrete-result, concrete-cause-references]

  - id: single-atomic-publication
    kind: semantic
    statement: >-
      All validation, evaluation, state staging, event construction, applicable
      runtime-budget checks, and result construction complete before one
      non-fallible publication point. Public state exposes either the complete
      old AwaitingInitialization machine or the complete new Ready machine and
      never a partial candidate.
    sources: [runtime-transition-model, runtime-commit-point, runtime-preparation, api-settlement, concrete-apply]

  - id: correctness-oriented-staging
    kind: verification
    statement: >-
      Clone-and-swap is the reference initialization strategy: execute against
      a complete private candidate and replace the published machine only on
      success. Any later optimized strategy must remain equivalent to this
      reference path.
    sources: [runtime-reference-strategy, testing-reference-transaction]

  - id: failure-preserves-complete-machine
    kind: semantic
    statement: >-
      Every structured rejection leaves the complete published machine
      semantically unchanged, including lifecycle, topology and revision,
      logical time absence, external levels, settled values, output baselines,
      policy association, and every other represented semantic field.
    sources: [runtime-transition-model, concrete-apply, testing-initialization-rejection, testing-failure-atomicity]

  - id: restricted-initialization-verification
    kind: verification
    statement: >-
      Tests cover an arbitrary nonzero initial time, complete authoritative
      snapshots, ordinary full evaluation, Ready transition, authoritative and
      settled storage, deterministic LevelEstablished events, exact revision
      retention, applicable budget boundaries, and complete unchanged-state
      comparison after each supported structured rejection.
    sources: [testing-first-transaction, testing-initialization-rejection, testing-failure-atomicity, testing-budget-boundaries]

implementation_freedom:
  - Transaction and result private storage, module placement, candidate cloning details, and stable-key event sorting mechanism are unconstrained; choose the simplest deterministic auditable forms and test them.
  - Private failure representation is unconstrained when reachable rejection
    categories preserve their catalogue distinctions and structured evidence.
  - Budgets without an implemented accounting boundary require no invented
    counter; once an accounting boundary exists, the policy and verification
    obligations apply.

open_questions: []

