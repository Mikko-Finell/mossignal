schema_version: "0.1"
id: mossignal.runtime.level_input_snapshot
title: Complete level input snapshot
kind: artifact
status: reviewed

source_baseline:
  commit: c28b14a69e283562508b956b66b34f54f8543e6e
  working_tree: clean

summary: >-
  A level InputSnapshot is an owned opaque artifact built against one exact
  compiled network and input schema. It retains their separate stable
  identities and records the complete authoritative level valuation for that
  schema without positional rebinding or implicit default levels.

scope:
  includes:
    - owned level-only InputSnapshot and its construction boundary
    - network and input-schema identity binding
    - complete authoritative external level valuation
    - invalid-observation and incomplete-snapshot rejection
  excludes:
    - pulse observations and pulse-count semantics
    - InputDelta and retained ready-machine values
    - machine lifecycle, transaction application, and evaluation
    - binding projection and caller-object-model interpretation
    - persistence artifact encoding and decoding

known_uncovered:
  - Prepared-patch target snapshots, whose target-topology binding is owned by reconfiguration work.

aliases:
  - InputSnapshot<D>
  - InputSnapshotBuilder<D>
  - complete external level valuation

requirements:
  - id: compiled-builder-origin
    kind: public_surface
    statement: >-
      CompiledNetwork exposes an input-snapshot builder for its own exact
      compiled topology, so construction obtains the network and input-schema
      identity context from that topology rather than from caller-supplied
      surrogate tokens.
    sources: [concrete-compiled]

  - id: owned-opaque-network-bound-artifact
    kind: public_surface
    statement: >-
      InputSnapshot is an owned opaque artifact, and its builder produces an
      artifact that does not borrow the compiled network or another topology
      provider.
    sources: [concrete-artifact-boundary, api-snapshot]

  - id: exact-identity-binding
    kind: compatibility
    statement: >-
      A snapshot is bound separately to the exact NetworkKey,
      NetworkFingerprint, and InputSchemaFingerprint of its compiled-network
      schema context; observations are stable typed endpoint observations and
      must not be rebound by collection position. Prepared-patch target
      snapshots additionally require their applicable target-topology context.
    sources: [schema-binding]

  - id: complete-authoritative-level-valuation
    kind: semantic
    statement: >-
      A valid level snapshot contains exactly one LogicLevel value for every
      required external level input in its bound schema. It establishes an
      authoritative external valuation, and omission must not be inferred as
      Low.
    sources: [api-snapshot, concrete-snapshot, snapshot-artifact]

  - id: rejects-invalid-observations
    kind: prohibition
    statement: >-
      Construction rejects observations for endpoints outside the bound schema
      and repeated observations for one endpoint, distinguishing equivalent
      duplicates from incompatible conflicts where the supplied values permit
      that distinction.
    sources: [api-snapshot, concrete-snapshot, input-diagnostic-codes]

  - id: finish-rejects-incomplete-snapshot
    kind: verification
    statement: >-
      Completing construction rejects a snapshot missing any required external
      level value; a successful snapshot is therefore complete before later
      lifecycle execution consumes it.
    sources: [api-snapshot, concrete-snapshot, snapshot-artifact, input-diagnostic-codes]

implementation_freedom:
  - The public builder entry point, private storage, error-type shape, and read-only inspection surface are unconstrained when the artifact remains owned, opaque, exact-identity-bound, complete, and deterministic by stable endpoint identity.
  - For the restricted level-only slice, use the simplest deterministic stable-keyed representation; record and test the concrete ordering choice without treating it as a permanent public iteration promise.

open_questions: []

