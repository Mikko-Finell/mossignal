schema_version: "0.1"
id: mossignal.reconfiguration.structural_preparation
title: Structural topology-patch preparation
kind: lifecycle
status: reviewed

source_baseline:
  commit: 28f03a775a2fdd92b2debaf0bf8a278c1b5bd1f5
  working_tree: clean

summary: >-
  Structural preparation rewrites one base topology by one explicit patch into
  a validated target and a state-independent migration program. It does not
  read or mutate a running machine and does not commit the replacement.

scope:
  includes:
    - one owned patch and its normalized all-at-once rewrite of one base topology
    - state-independent preparation of one prepared patch and static migration plan
    - stable structural, module-instance, and internal-role correspondence
    - target input-schema, binding, output, diagnostic, and potential state-loss classification
  excludes:
    - transaction-time finalization, patch commitment, and actual migration
    - choosing or enforcing a live state-loss policy
    - partial installation, incremental compilation, merge, rebase, and patch persistence

known_uncovered:
  - Patch commitment, transaction attachment, and installation of the target topology
  - Actual migration of state, pending events, valuations, baselines, episodes, and provenance at the effective time
  - A hidden or caller-omitted migration policy, and applying either reconfiguration policy to a finalized loss set
  - Partial topology installation and optimized incremental compilation
  - Collaborative editing, automatic rebasing, patch merging, and inverse patches
  - Forecasting a patch-bearing transaction
  - Replaying patch frames
  - Persisting a prepared patch, or re-preparing one from a patch wire artifact
  - Standard modules the catalogue names but this runtime does not construct, including temporal standard-module candidates
  - A future lossless migration between different temporal kinds; the initial core defines none

aliases:
  - NetworkPatch<D>
  - NetworkPatchBuilder<D>
  - PreparedPatch<D>
  - StaticMigrationPlan<D>
  - CompiledNetwork::prepare_patch
  - Machine::prepare_patch

requirements:
  - id: declarative-owned-patch
    kind: public_surface
    statement: >-
      A topology patch is an owned opaque declarative rewrite from one complete
      base definition to one target definition, not an ordered mutation script.
      It is bound to the network key, base network fingerprint, base topology
      revision, time domain, and signal-semantics version, and not to an
      execution-state digest. The closed operation language covers nodes,
      connections, external endpoints, module instances, parent assignment,
      diagnostic metadata, and explicit reassociation. Operations are data, not
      callbacks. Replacement definitions keep the operation subject's key and
      signal kind; a key change is removal, addition, and explicit
      reassociation. Finish is infallible and yields one deterministically
      normalized operation set. Equivalent operation orders produce the same
      target definition, fingerprint, current-reaction dependency graph,
      correspondence, static plan, loss classification, invalidation, and
      diagnostics, up to representation-only ordering. The patch is not
      rebased, merged, or composed across revisions.
    sources: [patch-model, order-independence, base-binding, no-rebase, operation-language, concrete-operations, patch-construction, normalization, concrete-construction]

  - id: malformed-until-ordinary-validation
    kind: semantic
    statement: >-
      The rewrite is applied all at once. No intermediate graph is semantically
      relevant, and locally incomplete structure is not repaired to make the
      patch valid. The core must not infer correspondence, cascade removals,
      reconnect dangling incidence, choose a driver, reparent orphans, reset
      state, cancel pending work, establish a new external level as Low, or
      synthesize a pulse for a topology change. Target-invalid structure that
      requires the whole graph is left for preparation, which validates the
      complete target through the ordinary network path. A target
      that would not validate and compile independently produces no prepared
      artifact. An empty effective patch, including one with no structural,
      semantic, hierarchical, endpoint, or metadata change, may exist as an
      owned patch but preparation rejects it and returns no artifact.
    sources: [order-independence, builder-checks, target-construction, dangling, structural-validation, normalization, forbidden-edits, concrete-operations]
    basis: derived

  - id: no-machine-mutation
    kind: prohibition
    statement: >-
      Canonical preparation is CompiledNetwork::prepare_patch. It depends only
      on the base topology and the normalized patch. Machine::prepare_patch
      checks that the patch base revision is the machine's current revision,
      then delegates. Machine::patch supplies an owned builder at the current
      revision and does not borrow the machine afterward. Preparation must not
      read logical time, external levels, node or temporal state, pending
      events, output baselines, diagnostic episodes, provenance roots, or an
      execution-state digest, and must not mutate the machine, its revision, or
      the compiled topology. State-dependent conditions are predicates in the
      static plan. Preparation is not a forecast and must not claim exact
      future state, pending-event outcomes, output events, or final migration
      records.
    sources: [processor-preparation, preparation-api, state-independent, freshness, concrete-placement, exact-forecast, no-host-callbacks]

  - id: prepared-identity
    kind: public_surface
    statement: >-
      Success returns one immutable PreparedPatch bound to the base network
      key, fingerprint, and revision. It exposes that base identity, the
      proposed revision a later commit would install by advancing the base
      revision exactly once, the target fingerprint, the target compiled
      topology, the normalized operations, the target input schema, and the
      static plan. A metadata-only effective patch still has a distinct
      proposed revision when its fingerprint is unchanged. Preparation does not
      install that revision. The artifact must not contain exact runtime
      migration outcomes. A foreign network, fingerprint, signal-semantics
      version, or time domain is rejected. The machine convenience also rejects
      a different base revision. State-only transactions do not invalidate the
      artifact; preparation does not retarget or rebase it.
    sources: [revision-fingerprint, prepared-patch, freshness, target-schema, concrete-plan, concrete-placement, preparation-api, api-freshness]

  - id: stable-correspondence
    kind: semantic
    statement: >-
      Correspondence is the partial injection formed only by equal stable keys
      of the same category and compatible signal kind, plus explicit same-kind,
      same-direction reassociation. A subject maps to at most one successor and
      from at most one predecessor, cannot be both preserved and reassociated,
      and cannot form a chain or cycle. The source exists only in the base
      result and the target only in the target result. Fixed-port semantic
      roles must remain compatible. Variadic ports keep their own stable
      identity; display order is not semantic. Names, descriptions, diagnostic
      paths, position, neighborhood, insertion order, dense indices, and module
      display order do not establish correspondence. One-to-many and
      many-to-one identity are outside the initial core.
    sources: [preservation, reassociation, correspondence-constraints, port-correspondence, no-matching, concrete-operations]

  - id: module-and-internal-correspondence
    kind: semantic
    statement: >-
      Module-internal continuity is the instance key plus the module-internal
      stable key, applied recursively through nested instances. Flattened or
      dense compiler positions do not decide it. Preparation expands base and
      target modules and classifies each internal subject with the ordinary
      node, port, connection, and state rules. While a standard declaration is
      retained, an edit of one internal canonical subject is rejected; the
      whole instance may be replaced, rebound, reparented, or given
      presentation metadata, or replaced by a user module. Catalogue version 1
      supplies exact-version self-compatibility only. A different module id has
      no catalogue correspondence. A changed instance key requires explicit
      module reassociation. Equal permanent role keys and qualifying public
      variadic keys correspond when category, kind, direction, and ordinary
      node compatibility allow. For the runtime catalogue, Exactly, AtMost, and
      AllEqual threshold or arity changes are stateless reevaluation: surviving
      public keys and remaining internal roles preserve identity, and absent
      roles are added or removed without state loss. Same-descriptor
      PulseResettableToggle preserves toggle and reset-baseline levels;
      LevelResettableToggle also preserves its reset-edge observation;
      LevelResettableSampleHold preserves held state and reset-edge observation.
      Changing initial preserves those values and affects only fresh state or an
      explicit module Reset. LevelResettableSampleHold reset_to is conditional:
      settled reset Low preserves held state for later captures; settled reset
      High migrates held state to the new reset_to and preserves the edge
      observation. Preparation records that `reset_to` predicate and does not
      read the settled reset level. An explicit module Reset selects Reset for
      every internal state owner, installs the target declared initial state
      only at later finalization, and classifies every discarded cell as loss.
      The static plan keeps module-level grouping and the complete internal
      correspondence.
    sources: [qualified-identity, module-expansion, module-interface, nested-modules, encapsulation, replacement-boundary, compatibility-dimensions, internal-correspondence, parameter-matrix, exactly-reconfig, at-most-reconfig, all-equal-reconfig, pulse-toggle-reconfig, level-toggle-reconfig, sample-hold-reconfig, concrete-directives]

  - id: static-migration-classes
    kind: semantic
    statement: >-
      The static plan classifies every relevant base and target subject once,
      with one primary continuity outcome of preserved, replaced in place,
      reassociated, removed, or added, plus orthogonal metadata or hierarchy
      change when present, and no contradictory primary outcome. A stateless
      subject has no state outcome. Every surviving stateful or temporal node
      has exactly one compatibility rule. Where topology alone decides the
      outcome, that rule is one of Preserve, Migrate, Reset, or Reject. Where
      the outcome depends on runtime state, the rule is a predicate whose later
      outcomes stay inside that set. Standard selects only the built-in
      rule: same or different stateless kinds have no state; the same
      edge-detector kind preserves its remembered observation and a different
      edge-detector kind migrates it; changing edge initialization does not
      alter preserved observation; the same boolean-state kind preserves its
      stored level, including across an initial-parameter or latch-conflict
      change; different boolean-state kinds reject unless TransferStoredLevel
      or Reset is explicit, and TransferStoredLevel is never inferred; the same
      temporal kind without a migration-relevant parameter change preserves
      temporal state and its standard pending rule; a different temporal kind
      has no lossless rule and rejects unless Reset reports the source state
      and pending work as loss; stateful or temporal to stateless reports
      source loss; stateless to stateful or temporal initializes the target and
      is not source loss; unrelated stateful families reject unless Reset is
      explicit. A preserved initial parameter is not reapplied unless the
      outcome is Reset. New nodes take declared initial state and no inherited
      pending work, which is not loss. Removed stateless nodes lose no internal
      state. Connection, region, and hierarchy changes do not by themselves
      reset compatible state or cancel compatible pending work. An incompatible
      directive produces no artifact.
    sources: [compatibility-outcomes, directives, compatibility-matrix, combinational, edge-detectors, boolean-state, cross-kind-temporal, new-nodes, removed-nodes, subject-outcomes, preservation-rules, shared-reconfig, family-obligations, node-initial, toggle-initial, pulse-latch-policy, level-latch-policy, sample-hold-initial, concrete-directives]

  - id: total-temporal-rules
    kind: semantic
    statement: >-
      Every temporal owner has one total pending-work rule even when no event
      exists. The rule's outcomes are PreserveDeadline, RecomputeDeadline,
      TransformPayload, Cancel, and Reject. PulseDelay and TransportDelay
      Standard on a delay change preserve existing deadlines and apply the
      target delay only to later input. Transport also preserves remembered
      input and output unless Reset, and a connectivity change does not cancel
      compatible queued transitions. InertialDelay and Periodic Standard rules
      that depend on unread runtime facts are conditional predicates, evaluated
      only at later finalization. An inertial delay change under Standard
      preserves the empty candidate and applies the target delay to later
      candidates when no candidate exists, and is insufficient when a candidate
      exists. A periodic parameter change under Standard preserves state when
      period, first-emission, and re-enable policy are unchanged; when any of
      those change, a fresh anchorless node takes the target parameters, and an
      existing anchor or schedule makes Standard insufficient. Preparation
      records those predicates and does not read candidate, anchor, or schedule
      existence, and it does not reject the artifact merely because the outcome
      is conditional. RejectIfCandidate and RejectIfAnchored remain
      caller-selected directives, distinct from that Standard conditional rule.
      The closed explicit policies are the PulseDelay, TransportDelay,
      InertialDelay, and Periodic directives. A directive that assigns no
      outcome, including no conditional outcome, to every possible pending
      obligation is an incomplete temporal policy and produces no artifact.
      Removed temporal work is Cancel rather than a transfer by name or
      similarity. The plan defines the rule and does not classify actual events.
    sources: [static-plan, pending-rules, state-dependent-finalization, pulse-delay-standard, pulse-delay-node, transport-migration, transport-standard, transport-reconfig, inertial-migration, inertial-node, inertial-standard, periodic-migration, periodic-standard, periodic-reconfig, cross-kind-temporal, catalogue-preparation, concrete-placement]
    basis: derived

  - id: schema-output-and-diagnostic-consequences
    kind: semantic
    statement: >-
      Preparation derives the target input schema. The static plan classifies
      the following consequences and does not apply them. A preserved level input
      keeps its valuation unless a later transaction sets it; a reassociated
      level input inherits the source valuation; a new level input is an
      establishment obligation and is not defaulted; a removed level input
      leaves the schema and loses its valuation unless reassociated; pulse
      absence means zero. The prepared patch exposes target-bound snapshot and
      delta builders. An initialization snapshot must be able to name every
      target level input, and a ready delta must be able to establish every new
      level input. Caller-owned binding sets are not mutated. Invalidation
      lists stale categories, including resolved handles, compiled inspection
      plans, old-revision prepared patches, old-schema binding projectors, and
      old-schema input artifacts; invalidation is not state loss, and surviving
      keys remain resolvable against the target. A preserved level output keeps
      its baseline for later comparison. A reassociated level output carries
      the source baseline as evidence, but the new key has no published
      baseline. A new level output has no baseline. A removed level output
      baseline is potential loss and a topology consequence, not a fabricated
      signal transition. Pulse outputs have no baseline. Exact level or pulse
      events are not claimed. Diagnostic-episode rules are Preserve, Transform,
      Resolve, Terminate, or Reject, and preservation requires a surviving
      owner, the same diagnostic code and condition identity, and unambiguous
      evidence. Dense identity never transfers an episode. Provenance rules
      record checkpoint, reset, retiming, or loss without reading current
      roots. Regions are weak components of the undirected structural graph;
      merges and splits are derived consequences and do not themselves change
      compatibility or become loss.
    sources: [target-schema, external-inputs, external-outputs, invalidated-artifacts, region-analysis, regions, output-establishment, episode-migration, provenance-migration, episode-family, forbidden-edits, concrete-placement, no-hidden-defaults]

  - id: explicit-loss-evidence
    kind: semantic
    statement: >-
      Preparation classifies every possible semantic loss and does not evaluate
      it. Loss is destruction, reset, truncation, or disappearance of
      information that can affect later execution or required observation,
      including removed or reset stored state, canceled pending work, lost
      deadline, origin, payload, inertial qualification, or periodic phase,
      removed level valuation, removed level-output baseline, and terminated
      episode or required provenance ancestry. A loss incurred for every
      machine over the base topology is unavoidable. A loss that depends on a
      named runtime fact is conditional. Each entry is identified by category,
      source subject, source state or event identity when statically known, and
      the migration rule or removal, and entries are not deduplicated by prose.
      Revision advance, dense reassignment, stale handles, region changes,
      metadata changes, information-preserving retiming, ordinary reevaluation,
      and new initial state with no source are not loss. Preparation does not
      select RejectStateLoss or AllowReportedStateLoss and does not invent a
      directive where the caller did not supply a total one.
    sources: [loss-definition, not-loss, loss-identity, loss-policy, catalogue-preparation, no-hidden-defaults, forbidden-edits]

  - id: preparation-report
    kind: public_surface
    statement: >-
      Compiled and machine preparation return Report of PreparedPatch.
      Locally decidable construction failures use the catalogue construction
      codes and PatchBuildFailure, not a prepared artifact. Preparation
      conditions use the catalogue preparation codes at their recorded
      severity, responsibility, delivery, and evidence. Those report conditions
      include base fingerprint or machine-revision mismatch, unknown base
      subject, invalid reassociation, non-injective reassociation, incompatible
      directive, incomplete temporal policy, unsupported cross-kind migration,
      ambiguous event migration, invalid target schema, empty patch, and
      conditional or unavoidable semantic loss. Invalid target graphs use
      ordinary validation codes. A standard internal edit uses
      standard_module.noncanonical_internal_edit. Blocking errors suppress the
      artifact. The conditional and unavoidable semantic-loss warnings may
      accompany a successful artifact. Finalization codes are not preparation
      results. Static-plan records have a deterministic order. That order is
      not causal. Preparation warnings are not machine diagnostic episodes and
      do not modify episode state.
    sources: [preparation-report, preparation-diagnostics, accumulation, episode-behavior, catalogue-preparation, catalogue-mapping, report-order, concrete-construction]

  - id: preparation-verification
    kind: verification
    statement: >-
      Tests must show that preparation depends only on the base topology and
      patch, that machines with different runtime state and the same revision
      produce equivalent prepared artifacts, and that operation-order variants
      agree on the normalized patch, target fingerprint, preparation
      diagnostics, and static plan. Correspondence must be derived independently
      of dense layout. Tests must not treat finalization, committed migration,
      or a patch-bearing forecast as preparation.
    sources: [order-test, state-independence-test, two-stage-test]

recommendations:
  - id: reject-local-contradictions
    statement: >-
      The builder should reject contradictions visible from the operation
      itself, including duplicate or conflicting edits, a replacement whose key
      differs from its subject, contradictory parents, a locally non-injective
      or kind-incompatible reassociation, and a detectable foreign artifact.
    sources: [builder-checks, concrete-construction, build-failures]

  - id: accumulate-independent-findings
    statement: >-
      Preparation should collect independent structural diagnostics where safe
      and should identify the missing companion edits that would remove
      dangling incidence.
    sources: [dangling, accumulation, preparation-report]

  - id: cheap-clone-and-rebinding-notice
    statement: >-
      PreparedPatch should be cheaply cloneable through immutable shared
      ownership. Preparation should report endpoint additions, removals, and
      reassociations that a caller would need in order to rebind, without
      mutating binding sets.
    sources: [prepared-patch, invalidated-artifacts, concrete-plan]

  - id: preservation-provenance-and-event-identity
    statement: >-
      Preserved state across a revision should be planned as a migration
      checkpoint rather than silent reuse of a revision-incompatible root. A
      one-to-one preserve, recompute, or transform rule should retain the
      source pending-event key. Where one event could match several outcomes,
      the recommended precedence is Reject, then Cancel, then TransformPayload,
      then RecomputeDeadline, then PreserveDeadline.
    sources: [provenance-migration, pending-identity, pending-rules]

implementation_freedom:
  - Private patch and prepared-patch storage, copied or rebuilt target definitions, allocation, and dense layout are free when the rewrite, correspondence, classifications, and deterministic order stay semantically equivalent.
  - Full target recompilation is sufficient. A second incremental compiler is not required.
  - The integer encoding of the one-step proposed revision is free when every effective patch exposes exactly one uninstalled successor of its base revision.
  - Exact base-fingerprint equality is a sufficient signal-semantics-version check, because that fingerprint already includes the version. A second public version field is not required.
  - Optional authoring conveniences are not required. Any convenience that is added must expand deterministically into the canonical operations before finish.
  - Region identifiers and the private layout of static-plan records are free when the required classifications and weak-component consequences remain observable.
  - Static-plan record order may follow the migration-report keys: category, source identity, target identity, state or event component, and a canonical tie-breaker.
  - The private encoding of a conditional Standard inertial or periodic rule is free when both specified arms remain observable and preparation does not read the deciding runtime fact.

