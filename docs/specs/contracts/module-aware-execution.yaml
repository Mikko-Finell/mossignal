schema_version: "0.1"
id: mossignal.module.aware_execution
title: Module-aware lowering, execution, and observation
kind: capability
status: reviewed

source_baseline:
  commit: a7e75d75699d40c65c2f4b1a092866e6d1df4e47
  working_tree: dirty

summary: >-
  Every validated user-module instance lowers recursively into the ordinary
  primitive compiled and runtime machinery while retaining stable
  instance-qualified correspondence, module hierarchy, and observable causal
  ownership.

scope:
  includes:
    - deterministic recursive executable lowering of validated user-module instances
    - module-qualified compiled correspondence and retained hierarchy
    - ordinary reaction, state, temporal, transaction, provenance, inspection, and budget integration
    - owned user-module inspection with public and expanded internal views
    - nested-module output and causal conformance
  excludes:
    - standard-catalogue discovery and typed standard-module conveniences
    - persistence, snapshots, restoration, replay, and module migration
    - module replacement, topology patches, and runtime-state migration
    - module-specialized evaluators, optimized incremental lowering, and complete explanation rendering

known_uncovered:
  - Persistent encoding and restoration of module-qualified runtime subjects
  - Compatible module replacement with state and pending-event migration
  - Standard-catalogue construction and standard-origin module conformance

aliases:
  - executable module lowering
  - flattened module execution
  - module-qualified runtime subject

requirements:
  - id: recursive-ordinary-primitive-lowering
    kind: lifecycle
    statement: >-
      Both compile forms accept every otherwise supported ValidatedNetwork that
      contains user-module instances and recursively lower each instance's
      complete validated primitive graph. Lowered nodes use the existing closed
      primitive descriptor and evaluator families; modules introduce no
      callbacks, hidden semantic state, fixed-point evaluation, or distinct
      transaction semantics.
    sources: [api-validated, concrete-instantiation, runtime-compilation, runtime-reaction, standard-purpose, standard-closed-boundary]
    basis: derived

  - id: exact-interface-and-nested-correspondence
    kind: semantic
    statement: >-
      Lowering resolves every public module input to its exact bound containing
      source and every public output to its exact internal source, preserving
      signal kind, connection incidence, fan-out, pulse multiplicity, and
      current-reaction dependencies recursively through nested instances.
      Instance paths plus module-local stable keys remain the logical identity
      of internal nodes, ports, connections, state owners, and temporal owners;
      private dense positions never establish correspondence.
    sources: [concrete-instantiation, module-qualified-identity, runtime-stable-keys, runtime-reaction, testing-signal]
    basis: derived

  - id: deterministic-module-compilation
    kind: verification
    statement: >-
      Equivalent stable-keyed module-containing definitions built with
      different insertion, traversal, or hierarchy-storage orders produce
      equivalent compiled graph views, reaction relations, descriptors, state
      schemas, temporal ownership, and externally observable behavior. A
      deterministic private flattening layout is permitted only where it does
      not affect semantic identity or observation.
    sources: [runtime-topology, runtime-compilation, testing-compilation]

  - id: retained-hierarchy-and-encapsulation
    kind: public_surface
    statement: >-
      Compiled graph access and runtime observation retain every module
      instance, parent-child relation, public interface, binding, and canonical
      expanded internal subject. Private internals remain non-connectable from
      outside but are discoverable and grouped beneath their complete instance
      path for structural inspection, diagnostics, provenance, and node or
      pending-work inspection. Owned ModuleInspection preserves the user-module
      boundary, origin, public ports and values, aggregate public state, and a
      grouped expanded view of internal subjects and their supported runtime
      facts.
    sources: [api-modules, api-graph, api-inspection, concrete-direct-inspection, concrete-graph, concrete-inspection]

  - id: ordinary-state-and-temporal-ownership
    kind: semantic
    statement: >-
      Each lowered stateful or temporal primitive receives an independent
      module-qualified owner and ordinary family-specific runtime slot. Its
      current output, previous and proposed state, future work, cancellation,
      equal-deadline processing, and schedule use the same laws as an explicit
      primitive. Separate instances and nested paths must never alias mutable
      state or pending events.
    sources: [runtime-family-storage, runtime-state, runtime-events, runtime-temporal]
    basis: derived

  - id: module-transparent-reaction-semantics
    kind: semantic
    statement: >-
      Module boundaries do not alter settlement: expanded operations execute in
      the validated acyclic current-reaction graph, after all predecessors
      settle, with glitch-free Level values and complete simultaneous Pulse
      counts. Current outputs, proposed successors, future operations,
      diagnostics, and causal derivations are the same as for the corresponding
      explicit primitive graph wherever behavioral rather than identity
      equivalence is required.
    sources: [runtime-reaction, runtime-evaluation, testing-reaction, testing-signal, testing-metamorphic]
    basis: derived

  - id: module-transparent-atomicity-and-budgets
    kind: system_effect
    statement: >-
      Module-expanded work participates in the existing explicit runtime
      policy and the single transaction publication boundary as ordinary
      primitive work. Any structured execution rejection, including overflow
      or budget exhaustion during expanded state, event, provenance,
      diagnostic, or result preparation, publishes no partial module output,
      state, event, provenance, diagnostic, time, schedule, or baseline change.
    sources: [runtime-atomicity, runtime-policy, standard-closed-boundary, testing-atomicity, testing-budgets]
    basis: derived

  - id: qualified-provenance-and-observation
    kind: public_surface
    statement: >-
      Module-generated output events, state transitions, pending obligations,
      diagnostics, and causal support identify stable module-qualified internal
      subjects and the owning hierarchy rather than collision-prone local keys
      or dense slots. Inspection remains a pure committed-state projection and
      distinguishes each instance's state and pending work even when several
      instances share one ModuleDef.
    sources: [module-qualified-identity, runtime-provenance, runtime-inspection, api-inspection, concrete-direct-inspection, concrete-inspection, testing-provenance, testing-inspection]
    basis: derived

  - id: module-execution-verification
    kind: verification
    statement: >-
      Focused and differential verification covers module-free regression,
      single and multiple instances, mixed containing and internal primitives,
      multiple nesting levels, Level and Pulse boundaries, stateful and
      temporal internals, output fan-out, exact-deadline behavior, retained
      hierarchy and qualified ownership, fingerprint stability, public
      observation, budget boundaries, and complete failure atomicity. Equivalent
      explicit and module-wrapped primitive graphs are compared after
      normalizing intentionally distinct stable identity and hierarchy.
    sources: [api-compiled, runtime-fingerprint, testing-compilation, testing-reaction, testing-temporal, testing-atomicity, testing-inspection, testing-budgets, testing-metamorphic]
    basis: derived

implementation_freedom:
  - Direct flattening and equivalent recursive descriptor building are both permitted when they deterministically reuse the ordinary primitive compiler and evaluator semantics.
  - Collision-free derived private keys, path interning, hierarchy indices, lookup tables, descriptor sharing, and deterministic dense layout remain private choices.
  - The exact typed module-qualified subject representation and owned ModuleInspection layout remain open; general query planning, subscriptions, and complete explanation rendering are outside scope.

open_questions: []

