schema_version: "0.1"
id: mossignal.standard.level_resettable_toggle
title: LevelResettableToggle standard module
kind: artifact
status: reviewed
source_baseline:
  commit: de711760a2ac0d84ea90f668affad9362bc16dc9
  working_tree: dirty
summary: >-
  Level-held resettable parity state with gated toggle pulses and a rising-reset baseline, derived entirely from canonical internal primitives.
scope:
  includes:
    - exact descriptor interface, parameters, law, and canonical expansion
    - fresh initialization, aggregate state, inspection, and explanation
    - ordinary current-reaction dependencies and bounded conformance
  excludes:
    - shared catalogue construction, key derivation, and fingerprint algorithms
    - topology replacement, parameter migration, snapshots, and replay
known_uncovered:
  - Same-descriptor state preservation, parameter changes, and whole-module migration reset
  - Snapshot restoration and validation of canonical internal state
aliases: [LevelResettableToggle, mossignal.standard.level_resettable_toggle]
requirements:
  - id: identity-interface-and-parameters
    kind: public_surface
    statement: >-
      LevelResettableToggle is mossignal.standard.level_resettable_toggle at
      semantic and expansion version 1, introduced in catalogue 1 as stateful.
      Fixed inputs are toggle: Pulse and reset: Level; state is a Level output.
      The initial LogicLevel parameter is required with no implicit default.
    sources: [module-law, parameters]
  - id: held-reset-and-parity-law
    kind: semantic
    statement: >-
      With reset High, current output and successor aggregate state are Low and
      the complete toggle batch is suppressed without accumulation. With reset
      Low, odd toggle count inverts previous aggregate q and even count retains
      q. Both inputs conservatively affect state in the current reaction,
      including simultaneous reset transitions and toggle batches.
    sources: [module-law]
  - id: canonical-expansion
    kind: semantic
    statement: >-
      Canonical roles are reset_inverter = Not(reset), accepted_toggle =
      PulseGate(toggle, reset_inverter), low_constant = Constant(Low),
      toggle_state = Toggle(accepted_toggle, initial), reset_edge =
      RisingEdge(reset, Assume(Low)), reset_baseline =
      SampleHold(toggle_state, reset_edge, Low), relative_state =
      Parity([toggle_state, reset_baseline]), and reset_select =
      Select(reset, relative_state, low_constant). State exports reset_select.
      Internal state belongs to the two stored-level owners and reset_edge;
      aggregate state outside held reset is their stored-level XOR.
    sources: [module-law]
  - id: initialization-and-reachable-state
    kind: lifecycle
    statement: >-
      Initial reset Low applies initialization toggle parity to configured
      initial. Initial reset High produces an Assume(Low) rising edge,
      suppresses all toggles, samples the toggle state into the baseline, and
      establishes aggregate Low. A settled state remembering reset High has
      equal toggle_state and reset_baseline levels. Debug verification checks
      that exactly the expected state owners exist under their correct roles,
      with no unexpected owners, and checks successful aggregate derivation,
      compatible edge observation, and this cross-internal relation.
    sources: [module-law, cross-internal]
  - id: aggregate-inspection-and-explanation
    kind: public_surface
    statement: >-
      Inspection exposes state, reset level, configured initial, held-reset
      status, latest reset transition cause, latest accepted toggle cause, and
      suppressed count when available in the transaction result. Expanded
      inspection includes all roles and remembered reset observation. High-reset
      explanations identify reset as blocker to High, suppressed toggle count,
      retained toggle state, and baseline establishing Low; Low-reset explanations
      identify previous aggregate state and accepted parity. Pulse counts remain
      reaction facts or explicitly labeled history, never persistent current values.
    sources: [module-law, pulse-activity]
  - id: exhaustive-reference-conformance
    kind: verification
    statement: >-
      Cover Low and High reset, rising/falling/steady reset, bounded toggle
      counts, simultaneous reset transitions and toggle, initial reset High,
      ignored batches during held reset, and release. Compare public law and
      canonical expansion for output, successor aggregate state, normalized
      internal state, diagnostics, and normalized provenance. Binding-change
      conformance belongs to topology migration coverage.
    sources: [verification, dual-view]

recommendations:
  - id: independent-public-reference
    statement: >-
      Implement the direct public reference law independently of the primitive
      expansion control flow for equivalence verification.
    sources: [dual-view]
implementation_freedom:
  - Private inspection and explanation types may vary if the required structured facts and primitive drill-down remain available.
  - Optional retained pulse facts must be explicitly historical; no extra semantic module state is required to provide result-owned observations.
open_questions: []
