schema_version: "0.1"
id: mossignal.module.validated_user_definition
title: Validated reusable user-module definition
kind: artifact
status: reviewed

source_baseline:
  commit: 9704d2e34aaafb52d75cbcdf167aa5304071a99e
  working_tree: dirty

summary: >-
  ModuleDef<D> is the immutable reusable user-module artifact produced only
  after complete interface, internal-graph, and current-reaction validation. It
  retains explicit User origin and an inspectable typed interface while keeping
  module-local internals encapsulated from external authoring access.

scope:
  includes:
    - validation of unchecked user-module interface claims and primitive internals
    - current-reaction dependency and cycle validation inside one reusable module
    - immutable ModuleDef ownership, User origin, and read-only definition inspection
    - private-internal encapsulation and blocking validation reports
  excludes:
    - typed ModuleBuilder authoring and module instantiation
    - nested modules and hierarchy validation
    - standard module declarations, origin, and canonical expansion checks
    - network compilation, execution, persistence envelopes, and reconfiguration

known_uncovered:
  - Module-specific diagnostic condition discriminators and evidence-merge laws beyond the catalogue's general typed-evidence requirements
  - Non-blocking module quality findings such as unused inputs and empty modules

aliases:
  - ModuleDef<D>
  - validated module
  - module validation
  - reusable user module

requirements:
  - id: one-way-module-validation
    kind: lifecycle
    statement: >-
      UncheckedModule<D> provides consuming and borrowed validation into
      Report<ModuleDef<D>, D>. ModuleDef is constructible only after every
      applicable static structural and semantic requirement succeeds; malformed
      caller-controlled input must return structured diagnostics without panic,
      and any blocking Error finding leaves the report artifact absent.
    sources: [concrete-modules, api-reports, testing-validation, testing-reports]

  - id: complete-interface-conformance
    kind: semantic
    statement: >-
      Validation must establish unique typed public input and output identities,
      declared-key existence for every interface mapping, valid private endpoint
      direction and existence, and same-kind interface incidence. Every public
      output exports exactly one internal source. Public inputs may fan out to
      several private inputs and may be unused, but an internal input still obeys
      its ordinary driver policy across internal connections and public-input
      mappings.
    sources: [api-modules, api-validation, concrete-modules, catalogue-validation]
    basis: derived

  - id: ordinary-internal-validation
    kind: semantic
    statement: >-
      User-module internals must satisfy the same stable-key uniqueness, primitive
      node shape, typed port, connection direction, signal-kind, driver, arity,
      semantic-parameter, initial-state, and dependency-signature requirements as
      ordinary authored primitive structure. Validation must not repair, default,
      deduplicate, or reinterpret malformed unchecked claims.
    sources: [runtime-validated, api-validation, concrete-modules]

  - id: internal-current-reaction-acyclicity
    kind: semantic
    statement: >-
      Validation derives the complete current-reaction dependency relation for
      the module's primitive internals, treating public inputs as typed root facts
      and public outputs as observations of their mapped internal sources. The
      resulting graph must be acyclic; every cyclic SCC, including a self-loop,
      blocks ModuleDef construction rather than being resolved by fixed-point
      iteration or traversal order.
    sources: [api-causality, api-modules, testing-cycles]
    basis: derived

  - id: immutable-user-module-artifact
    kind: lifecycle
    statement: >-
      A successful ModuleDef<D> is an owned immutable reusable definition with
      explicit User origin, its computed ModuleFingerprint, its complete typed
      public interface, and its validated module-local primitive graph. It owns
      no runtime state and does not by itself claim network instantiation or
      executability.
    sources: [api-modules, concrete-modules]

  - id: encapsulated-private-internals
    kind: prohibition
    statement: >-
      Module-local nodes, ports, and connections remain private authoring
      subjects: knowing their stable keys does not make them directly connectable
      from outside the module. Read-only inspection and diagnostics may expose
      those subjects without weakening the encapsulation boundary.
    sources: [api-modules, concrete-graph-views]

  - id: deterministic-definition-inspection
    kind: public_surface
    statement: >-
      ModuleDef must provide read-only access to its fingerprint, origin, typed
      public inputs and outputs, and immutable definition graph. Equivalent valid
      stable-keyed modules built from different unchecked claim insertion orders
      must present equivalent interface and graph content independent of dense or
      private storage identity.
    sources: [concrete-modules, concrete-graph-views, testing-determinism]

  - id: stable-structured-module-diagnostics
    kind: system_effect
    statement: >-
      Module validation uses the common deterministic Report and Problem model,
      the catalogue's validation codes, stable module-interface or internal
      subjects where available, and complete typed evidence. Independent findings
      are collected where safe, rendered prose is non-authoritative, and
      ambiguous corrections do not produce speculative suggestions.
    sources: [api-reports, catalogue-subjects, concrete-subjects, catalogue-validation, testing-validation, testing-reports]

implementation_freedom:
  - The private validation passes, candidate types, maps, SCC representation, and module storage layout are unconstrained when observable validation and inspection remain deterministic.
  - The implementation may normalize validated collections or retain raw storage behind canonical iterators; choose the simplest deterministic option, test insertion-order equivalence, and record the choice.
  - Until catalogue law fixes module-specific condition discriminators and merge rules, use the smallest deterministic private projection that preserves all semantic facts required by the selected code and evidence family; do not expose it as a compatibility promise.
  - The User-only representation of ModuleOrigin<D> may use the smallest forward-extensible shape that does not fabricate a standard declaration.

open_questions: []

