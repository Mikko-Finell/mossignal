schema_version: "0.1"
id: mossignal.runtime.machine_lifecycle
title: Machine lifecycle and semantic state ownership
kind: lifecycle
status: reviewed

source_baseline:
  commit: 87fe4c6f752aac6f34bd89d88c9395013a728aec
  working_tree: dirty

summary: >-
  Machine is one mutable semantic execution instance over an immutable compiled
  topology. It begins without fabricated runtime values in
  AwaitingInitialization and moves to Ready only through a successful
  initialization transaction.

scope:
  includes:
    - machine creation from an immutable compiled topology
    - independent mutable semantic-state ownership
    - AwaitingInitialization and Ready lifecycle states
    - lifecycle, time, revision, topology, and policy inspection
  excludes:
    - transaction construction, execution, staging, and result publication
    - ready-machine scheduling and current-runtime inspection projections
    - persistence snapshots, restoration, replay, and forecasts
    - topology replacement and state migration
    - runtime policy construction, identity semantics, and machine association

known_uncovered:
  - Complete stateful, temporal, pending-event, provenance, diagnostic-episode, and digest storage required as those subsystems are implemented.

aliases:
  - Machine<D>
  - MachineStatus<D>
  - AwaitingInitialization
  - Ready

requirements:
  - id: explicit-runtime-lifecycle
    kind: public_surface
    statement: >-
      CompiledNetwork creates a Machine that retains the immutable compiled
      topology and its semantic fingerprint, and the canonical Machine uses
      runtime lifecycle state rather than a typestate parameter.
    sources: [api-machine, concrete-compiled, concrete-machine, concrete-status]

  - id: independent-machine-state
    kind: lifecycle
    statement: >-
      Each spawned Machine owns an independent mutable semantic store. Several
      machines may share one immutable CompiledNetwork, but mutation of one
      machine must not alter another machine or corrupt compiled topology.
    sources: [runtime-running-machine, runtime-program-store]

  - id: awaiting-initialization-state
    kind: lifecycle
    statement: >-
      The canonical runtime lifecycle uses non-exhaustive MachineStatus with
      AwaitingInitialization and Ready { now: Time<D> }. A newly spawned machine
      is AwaitingInitialization, retains the declared initial node and temporal
      state applicable to its topology, and has no current logical time. It
      transitions to Ready only through a successful initialization transaction.
    sources: [runtime-lifecycle-states, api-lifecycle, api-machine, concrete-machine, concrete-status]

  - id: no-fabricated-uninitialized-values
    kind: prohibition
    statement: >-
      An AwaitingInitialization machine has no current logical time,
      authoritative external level valuation, settled current signal valuation,
      external output baseline, pending schedule, or current runtime
      explanation or runtime diagnostic episodes. It must neither infer Low nor
      introduce a third LogicLevel to represent those absent runtime facts.
    sources: [runtime-lifecycle-states, api-lifecycle, api-machine]

  - id: machine-local-revision-and-identity
    kind: semantic
    statement: >-
      NetworkRevision identifies the topology installed in one machine. A
      state-only transaction, including initialization without a topology patch,
      does not change it; only a committed topology patch advances it. The
      machine retains the compiled network fingerprint and exact runtime-policy
      identity as distinct inspectable values.
    sources: [api-revision, concrete-status]

  - id: basic-lifecycle-inspection
    kind: public_surface
    statement: >-
      Machine exposes its lifecycle status, whether initialization has occurred,
      optional current time, machine-local revision, immutable compiled
      topology, and topology fingerprint without exposing private runtime
      storage.
    sources: [concrete-status]

  - id: mutable-ownership-boundary
    kind: prohibition
    statement: >-
      Semantic mutation belongs behind exclusive mutable Machine access. The
      public machine boundary must not expose compiled mutable internals; machine
      mutation must remain unable to corrupt compiled topology invariants.
    sources: [runtime-program-store, concrete-machine, concrete-mutation]

  - id: lifecycle-verification
    kind: verification
    statement: >-
      Tests must cover both lifecycle states and establish that an uninitialized
      machine is not treated as a ready machine holding implicit Low values.
    sources: [testing-lifecycle]

  - id: ownership-verification
    kind: verification
    statement: >-
      Verification must demonstrate that machines spawned from one compiled
      topology cannot share mutable semantic state accidentally and that machine
      mutation cannot corrupt the immutable compiled program.
    sources: [testing-obligations, runtime-program-store]

recommendations:
  - id: deliberate-machine-cloning
    statement: >-
      Machine should not implement Clone as an ordinary convenience unless its
      cost and semantic meaning are explicit. Private cloning for forecast or
      reference execution may remain an implementation detail, and any public
      independent duplication should use a deliberate operation such as fork.
    sources: [concrete-cloning]

implementation_freedom:
  - Private state layout, shared-topology handle representation, accessor implementation, and lifecycle-state storage are unconstrained when ownership and observable lifecycle semantics remain exact.
  - The initial numeric NetworkRevision value is not specified; choose the simplest deterministic value, test it, and record the concrete choice without treating it as a permanent compatibility promise.
  - Unsupported semantic-state families need no placeholder storage before their owning subsystems exist.

open_questions: []

