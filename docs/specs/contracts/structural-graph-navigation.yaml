schema_version: "0.1"
id: mossignal.graph.structural_navigation
title: Structural graph navigation and regions
kind: concept
status: reviewed
source_baseline:
  commit: 6063ae23cdd6f5795e76a80f1276daa996bd6127
  working_tree: dirty
summary: >-
  Read-only graph navigation preserves stable structural subjects and module
  hierarchy. Regions partition structural connectivity, while directed slices
  describe conservative structural possibility rather than actual activation.
scope:
  includes:
    - immutable structural views, weak regions, and directed dependency slices
    - stable subject identity and retained module correspondence
  excludes:
    - reaction cycle validation and evaluator ordering
    - runtime causal support and observer subscriptions
aliases: [GraphView, RegionId, NetworkSlice, slice_between]
requirements:
  - id: immutable-hierarchical-view
    kind: public_surface
    statement: >-
      Graph views borrow immutable artifacts and preserve stable keys, module
      hierarchy, module origins, exact standard declarations, public interfaces,
      and canonical internal subjects even when execution is flattened.
    sources: [api-view, concrete-view]
  - id: weak-component-partition
    kind: semantic
    statement: >-
      Regions are automatically derived weak components of the structural graph;
      direction is ignored only for region membership. They partition structural
      subjects and do not own independent lifecycle or execution state. Region
      merges or splits alone do not reset surviving state.
    sources: [api-regions, runtime-regions]
  - id: membership-derived-identity
    kind: semantic
    statement: >-
      RegionId derives from canonical ordered component membership and identifies
      a region only with network fingerprint and topology revision. It is not
      caller allocated, merge or split operations create new region identities,
      and components need not contain a node.
    sources: [concrete-identities]
  - id: structural-possibility
    kind: semantic
    statement: >-
      Graph queries operate on authoritative structural connectivity. Directed
      dependency queries describe structural possibility, not current activation
      or actual causal support.
    sources: [runtime-structural, api-queries]
  - id: representation-independent-queries
    kind: verification
    statement: >-
      Verification checks that semantically equivalent stable-keyed definitions
      built in different insertion orders have equivalent structural views,
      region partitions, and graph-query results. Private dense layout must not
      change public query semantics.
    sources: [testing-determinism]
recommendations:
  - id: direct-regions-and-slices
    statement: >-
      Provide region membership and upstream, downstream, and source-to-destination
      slices, including relevant stateful, temporal, and module elements. Slice
      results should be owned and stable-keyed.
    sources: [api-queries, concrete-queries]
implementation_freedom:
  - Private traversal, indexing, result representation, and deterministic ordering are unconstrained beyond the represented identity and semantic requirements.
open_questions: []
