schema_version: "0.1"
id: mossignal.compile.compiled_network
title: Immutable compiled network topology
kind: artifact
status: reviewed

source_baseline:
  commit: aeacb5342e27a13f3c534d66b114ae1f096298f8
  working_tree: clean

summary: >-
  CompiledNetwork<D> is the immutable executable topology derived only from a
  successfully validated network. It retains stable semantic identity while
  resolving the restricted Constant/Not model into private dense descriptors,
  dependency adjacency, and deterministic evaluation metadata without owning
  mutable machine state.

scope:
  includes:
    - compilation from a validated restricted network into immutable topology
    - stable-key-to-dense resolution and category-safe dense index identities
    - immutable restricted node, port, endpoint, reaction-adjacency, and topological metadata
    - static compiled invariant checking and deterministic compilation verification
    - retention of validated identity and diagnostic metadata through compilation
  excludes:
    - authored structural validation and reaction-cycle analysis
    - evaluator execution, machine state, lifecycle, and runtime policy
    - resolved public handles and revision-based freshness checks
    - stateful, temporal, region, graph-query, module, and persistence layouts
    - incremental compilation and compact-layout optimization

known_uncovered:
  - Compiled layouts and invariants for stateful, temporal, module, variadic, and pulse node families
  - Public graph-query views, resolved handles, and revision-bound compiled inspection plans

aliases:
  - CompiledNetwork<D>
  - compiled topology
  - immutable executable program

requirements:
  - id: validated-only-compilation
    kind: lifecycle
    statement: >-
      Compilation transforms only a ValidatedNetwork into a CompiledNetwork;
      it must not admit unchecked or blocking-invalid definitions. The public
      validated artifact provides consuming and borrowing compile forms that
      report the compiled artifact through the common Report boundary.
    sources: [runtime-lifecycle, concrete-validated, api-validated]

  - id: immutable-topology-boundary
    kind: lifecycle
    statement: >-
      CompiledNetwork is an immutable executable specification with no mutable
      machine state, is shareable by independent machines, and retains the
      authored stable identities, hierarchy, and diagnostic metadata required
      by later inspection and diagnostics.
    sources: [runtime-compiled-topology, runtime-program-store, api-compiled]

  - id: validated-identity-retention
    kind: semantic
    statement: >-
      Compilation carries the validated network's NetworkKey, TimeDomainId,
      NetworkFingerprint, and InputSchemaFingerprint unchanged; it accepts no
      late identity context, and private dense layout or compilation metadata
      must not determine those identities.
    sources: [concrete-validated, api-compiled, runtime-fingerprint]

  - id: distinct-revision-local-dense-indices
    kind: semantic
    statement: >-
      Compilation establishes stable-key-to-dense-index resolution for direct
      execution access. Dense indices are opaque, category-distinct identities
      with meaning only in their owning compiled revision; raw integer
      interchange between node, port, state, event, and provenance categories
      is forbidden.
    sources: [runtime-dense-indices]

  - id: restricted-immutable-descriptors
    kind: semantic
    statement: >-
      For the restricted Constant/Not model, the compiled topology retains
      immutable node and typed-port descriptors, complete external endpoint
      tables, reaction dependency adjacency, and the deterministic topological
      order selected during successful validation. The internal representation
      must preserve stable-key lookup without ambiguity.
    sources: [runtime-compiled-topology, runtime-program-store, runtime-compilation, runtime-topological]

  - id: compiled-reaction-correspondence
    kind: semantic
    statement: >-
      Compiled reaction-operation descriptors and adjacency must represent the
      accepted derived current-reaction dependency relation for the restricted
      network; private evaluator fusion may not change that relation.
    sources: [runtime-reaction-graph]

  - id: compiled-static-invariants
    kind: verification
    statement: >-
      Debug and test builds must be able to check that dense references are in
      bounds, descriptors and ports agree with validated kinds, compiled
      incidence preserves driver rules, every reaction dependency is forward in
      topological order, stable-key lookup is unambiguous, and endpoint tables
      are complete and type-correct. Ordinary evaluation may rely on those
      compiled invariants without revalidating them.
    sources: [runtime-invariants, verification-invariants, catalogue-invariants]

  - id: deterministic-compilation
    kind: verification
    statement: >-
      Semantically equivalent stable-keyed definitions built in different
      insertion orders must yield equivalent externally observable compiled
      metadata and reaction relation. Representation-dependent dense layout is
      permitted only where it cannot affect machine behavior, persistence,
      diagnostics, or semantic digests.
    sources: [verification-determinism, runtime-fingerprint]

  - id: opaque-dense-private-surface
    kind: public_surface
    statement: >-
      CompiledNetwork may be cheaply cloned through hidden immutable sharing,
      but its public API must not expose internal dense indices, adjacency
      storage, arenas, or worklists.
    sources: [concrete-compiled]

implementation_freedom:
  - Exact dense-index widths, private descriptor and lookup-table shapes, adjacency storage, and immutable sharing mechanism are unconstrained.
  - The first restricted compilation may favor a straightforward deterministic layout over compactness; it need not introduce incremental compilation, state layouts, temporal descriptors, regions, graph-query indices, or public resolved handles.
  - The implementation may retain or rebuild the validated authored definition internally when it preserves the compiled boundary and stated invariants.

open_questions: []

