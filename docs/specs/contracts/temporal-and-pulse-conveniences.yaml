schema_version: "0.1"
id: mossignal.authoring.temporal_and_pulse_conveniences
title: Debounce alias and any_pulse composition
kind: family
status: reviewed

source_baseline:
  commit: 96de43eddf6d3bc0264ddf314b709b94ea81adfd
  working_tree: dirty

summary: >-
  debounce is a primitive alias for one caller-configured InertialDelay, and
  any_pulse is a builder-only Merge followed by Coalesce. Both are authoring
  conveniences over ordinary primitives, with no module, identity, migration,
  or diagnostic boundary of their own.

scope:
  includes:
    - catalogue classification and exact lowering of debounce and any_pulse
    - debounce parameter exposure and any_pulse composition order
    - authoring failure, identity, inspection, and conformance consequences
  excludes:
    - xor, level_gate, majority, nand, nor, and xnor
    - standard modules and user ModuleDef wrappers
    - annotate_signal and other metadata-only authoring
    - InertialDelay, Merge, and Coalesce primitive laws
    - deferred pulse multiplication, pulse cap, pulse parity, and low-enabled spellings
    - persistence codecs, topology patches, and migration implementation

known_uncovered:
  - Optional retention of the convenience spelling as non-semantic authoring metadata
  - InertialDelay duration-change and topology-migration policy, which debounce does not define

aliases:
  - debounce
  - any_pulse
  - AnyPulse

requirements:
  - id: exact-convenience-classification
    kind: semantic
    statement: >-
      debounce and any_pulse each belong to exactly one convenience category.
      debounce is a primitive alias for InertialDelay. any_pulse is a
      builder-only operation. Neither is a standard module, a metadata-only
      operation, a new primitive kind, or an independent semantic object, and
      an expansion of more than one primitive does not by itself make any_pulse
      a module.
    sources: [classification, initial-aliases, initial-builder-operations, any-pulse-candidate, classification-summary]

  - id: debounce-alias-lowering
    kind: semantic
    statement: >-
      debounce creates exactly one InertialDelay whose Level input is the
      supplied signal and whose semantic configuration is the caller-supplied
      positive delay and explicit initial LogicLevel. It exposes every semantic
      InertialDelay parameter, invents neither an initial level nor a migration
      policy, and creates no other node and no ModuleInstance.
    sources: [classification, initial-aliases, primitive-alias-api, inertial-parameters]

  - id: any-pulse-lowering
    kind: semantic
    statement: >-
      any_pulse(inputs) authors exactly Merge(inputs) connected, in caller
      iterator order, to one Coalesce, and its result is that Coalesce output.
      Empty and unary input lists remain valid. The checked Merge sum occurs
      before the presence bound. The operation creates no ModuleInstance or
      additional node and defines no separate multiplicity, ordering, or
      overflow law, so Merge's checked sum and Coalesce's presence bound apply
      unchanged.
    sources: [classification, initial-builder-operations, any-pulse-candidate, coalesce-composition, merge-law, pulse-counts, variadic-construction]

  - id: ordinary-primitive-boundary
    kind: system_effect
    statement: >-
      debounce uses InertialDelay's compatibility, diagnostics, inspection,
      identity, and runtime behavior, and inspection exposes the InertialDelay
      kind. any_pulse is inspected, diagnosed, persisted, and identified only as
      its Merge node, its Coalesce node, and the connection between them.
      Neither convenience adds a descriptor, version, hierarchy, independent
      fingerprint field, migration rule, runtime state, or convenience-owned
      diagnostic, and neither suppresses diagnostics of the authored primitives.
    sources: [classification, primitive-alias-api, initial-builder-operations]

  - id: typed-builder-scope-preservation
    kind: public_surface
    statement: >-
      Convenience methods offered on NetworkBuilder and ModuleBuilder consume
      typed signals under the same builder-scope rules as their underlying
      constructors. A foreign signal returns AuthoringFailure::ForeignSignal
      rather than panicking or connecting that signal. Successful calls lower
      into the same canonical primitive graph as direct construction.
    sources: [builder-signal-scope, module-builder-parity, primitive-alias-api]
    basis: derived

  - id: exact-lowering-conformance
    kind: verification
    statement: >-
      Verification must show each convenience's classification, exact node
      kinds, configuration, caller-iterator incidence, and absence of a
      ModuleInstance. Where a typed builder offers the method, the same inputs
      and parameters must be semantically equivalent to direct inertial_delay,
      or to direct merge followed by coalesce. Coverage includes both explicit
      debounce initial levels and empty, unary, and sum-overflowing any_pulse
      inputs, and it must not suppress primitive diagnostics or replace Merge
      overflow with a successful presence pulse. When both paths allocate the
      same stable keys, the network or user-module fingerprint matches the
      direct construction because the convenience adds no fingerprint of its own.
    sources: [semantic-equivalence, initial-aliases, initial-builder-operations, any-pulse-candidate, network-fingerprint, module-fingerprint]
    basis: derived

recommendations:
  - id: concise-builder-methods
    statement: >-
      The typed builders should expose a concise any_pulse method. The crate
      should not add a separate named convenience for every inversion, polarity,
      priority, or branch permutation.
    sources: [initial-builder-operations]

  - id: no-misleading-keyed-form
    statement: >-
      any_pulse should not provide a keyed form that presents the two-primitive
      composition as one semantic object. A caller who needs durable composition
      identity should author the primitives explicitly or wrap them in a user module.
    sources: [classification, initial-builder-operations]

implementation_freedom:
  - Offer debounce as a concise method. Accept InertialDelayConfig or separate delay and initial arguments. Both semantic parameters remain required and neither receives a default. Prefer passing the existing InertialDelayConfig through to the ordinary inertial_delay constructor.
  - Implement any_pulse by delegating to the existing Merge and Coalesce constructors in that order. Share private helpers between NetworkBuilder and ModuleBuilder when that preserves builder scope and call order.
  - Concise calls use the ordinary local key allocator. No explicit keyed convenience form is required; callers who need stable keys use the primitive constructors. Reject a foreign signal before creating any of the convenience's nodes, or fail at the same point as the underlying constructor. Both conform when the foreign signal is not connected. The first avoids a partial expansion.
  - The convenience spelling need not be retained as metadata. If retained, it remains non-semantic and follows the existing metadata fingerprint exclusions.

open_questions: []

