schema_version: "0.1"
id: mossignal.runtime.policy
title: Immutable runtime policy and identity
kind: artifact
status: reviewed

source_baseline:
  commit: 97cf5b2ad9561b13e4c0133d7026dc63c1914c81
  working_tree: dirty

summary: >-
  RuntimePolicy is the explicit immutable set of validated limits that may
  change execution success or failure. RuntimePolicyId is its distinct,
  deterministic canonical identity for machine association and exact replay.

scope:
  includes:
    - RuntimePolicy construction, validation, immutability, and inspection
    - semantically relevant named execution limits
    - RuntimePolicyId value and canonical digest construction
    - budget-failure and verification obligations
  excludes:
    - performance-only tuning that cannot affect semantic outcomes
    - persistence artifact encoding, decoding, and restoration
    - machine lifecycle and transaction implementation
    - subsystem-specific accounting mechanisms and private counters

aliases:
  - RuntimePolicy
  - RuntimePolicyBuilder
  - RuntimePolicyId
  - execution budgets

requirements:
  - id: explicit-immutable-validated-policy
    kind: public_surface
    statement: >-
      RuntimePolicy is an explicit validated immutable value. Construction uses
      RuntimePolicyBuilder and returns Result<RuntimePolicy, PolicyFailure>;
      there must be no invisible process-global runtime policy.
    sources: [api-policy, concrete-policy, runtime-policy]

  - id: initial-semantic-limits
    kind: public_surface
    statement: >-
      The initial public policy fields are maximum internal reactions, maximum
      evaluated operations, maximum pending events, maximum events created per
      transaction, and maximum required provenance growth, each supplied as a
      u64 limit. Performance-only tuning is excluded from semantic policy.
    sources: [concrete-policy, runtime-policy]

  - id: complete-builder-validation
    kind: semantic
    statement: >-
      The plain builder must require every semantically relevant limit present
      in its supported policy schema and reject completion when one is absent.
      Any supplied value outside its declared domain must likewise be rejected;
      named policy constructors may provide explicit bundles only when the
      resulting exact policy and identifier remain inspectable.
    sources: [concrete-policy, policy-codes]

  - id: policy-failure-model
    kind: public_surface
    statement: >-
      PolicyFailure maps missing limits one-to-one to
      runtime.policy_missing_limit and invalid values one-to-one to
      runtime.policy_invalid_limit. Both are Error/CallerInput failures with
      ParameterEvidence identifying the policy subject, parameter key, expected
      domain, and encountered value.
    sources: [failure-enums, policy-codes, policy-failure-mapping, parameter-evidence]

  - id: distinct-opaque-identity
    kind: public_surface
    statement: >-
      RuntimePolicyId is a public opaque fixed 32-byte identity distinct and
      non-interchangeable from revisions, fingerprints, and other digests, while
      keeping the selected digest algorithm out of ordinary semantic use.
    sources: [concrete-identities, fixed-digests]

  - id: canonical-policy-identity
    kind: semantic
    statement: >-
      DigestSuiteVersion 1 computes RuntimePolicyId with unkeyed BLAKE3-256 over
      a canonical record containing domain label mossignal/runtime_policy_id/v1,
      domain version 1, and the canonical policy payload. The payload contains
      every policy field capable of changing operation success or failure as a
      named limit independent of builder or insertion order, and excludes
      performance-only tuning.
    sources: [digest-suite, domain-separation, digest-versions, policy-identifier]

  - id: explicit-machine-association
    kind: lifecycle
    statement: >-
      Machine creation requires an explicit validated RuntimePolicy, and the
      associated RuntimePolicyId remains observable; exact operational replay
      requires the same identifier in addition to compatible semantic versions,
      initial state, topology, and transaction sequence.
    sources: [api-policy, api-machine, concrete-compiled, runtime-policy-identity]

  - id: atomic-budget-failure
    kind: semantic
    statement: >-
      Exceeding a semantic budget rejects the complete outer transaction,
      preserves the published machine, identifies the exceeded named budget,
      reports its configured limit and consumed amount where practical, and
      must not skip required work or publish partial settlement.
    sources: [api-policy, runtime-budget-failure]

  - id: policy-identity-verification
    kind: verification
    statement: >-
      Tests must establish equal identifiers for equal semantic policies,
      construction-order independence, identity sensitivity to each semantic
      limit, exclusion of performance-only tuning, and a deliberately versioned
      representative golden RuntimePolicyId vector.
    sources: [policy-identity-tests, canonical-vectors]

  - id: implemented-budget-boundaries
    kind: verification
    statement: >-
      Every budget when its accounting is implemented must be tested one below,
      exactly at, and one above its configured limit where representable; budget
      failure must preserve atomicity and agree between direct and reference
      execution paths.
    sources: [budget-boundaries, budget-atomicity]

recommendations:
  - id: identity-value-capabilities
    statement: >-
      RuntimePolicyId should provide Clone, Copy, Eq, Hash, Ord, and Debug;
      Display should use a stable hexadecimal representation.
    sources: [concrete-identities]

implementation_freedom:
  - Private policy and builder storage, setter consumption style, digest caching, helper names, and module placement are unconstrained.
  - The specifications do not declare narrower numeric domains for the initial u64 limits; implementation may choose the simplest deterministic validation rule, test and record it, and must not present that local choice as a stabilized compatibility promise.
  - RuntimePolicyId's canonical payload record shape and named-field spelling are not fixed beyond canonical named limits and order independence; the initial implementation may choose the simplest deterministic version-1 projection, retain a golden vector, and record the choice for concrete review.

open_questions: []

