schema_version: "0.1"
id: mossignal.persistence.replay_artifacts
title: Deterministic replay artifacts
kind: artifact
status: reviewed

source_baseline:
  commit: 1b8d87b81555ee6285f9f0313c0c099346e2ca2a
  working_tree: clean

summary: >-
  Replay is the ordered fold of the ordinary machine transition from an exact
  starting machine or restored snapshot. Persisted replay_frame and replay_log
  artifacts checkpoint that fold. They do not add a second evaluator.

scope:
  includes:
    - owned frames, a recording path through Machine::apply, and ordered replay on one machine
    - replay_frame and replay_log artifacts, plus the transaction_record and input_snapshot or input_delta artifacts they embed
    - starting identity, per-frame digest and revision checkpoints, and mismatch localization
    - concatenation, corruption, unsupported-version rejection, and exact canonical bytes
    - direct-jump versus stepwise temporal equivalence and module-aware equivalence for the current patch-free transaction model
  excludes:
    - topology-patch preparation, commitment, and patch-bearing execution
    - forecast-marked frames, checkpoint bundles, chunk storage, streaming decode, and log compaction
    - standalone transaction_result, migration_report, definition, runtime_policy, and network_patch artifacts
    - schema upgraders, historical version corpora, and any replay-format or snapshot-format freeze
    - machine_snapshot field spelling, SnapshotDigest construction, and execution or observable digest projections
    - distributed consensus, live replication, event-sourcing frameworks, and host callbacks

known_uncovered:
  - Patch-bearing replay steps, including target-fingerprint verification, standard-module replacement, and concatenation boundaries at topology patches
  - Forecast-marked frames and a frame whose hypothetical status must stay visible
  - Chunk sequence and link validation, streaming decode, and checkpoint-bundle assembly
  - An optional transaction_result child and replay.recorded_result_mismatch
  - SubjectRef variants ReplayLog, ReplayFrame, and ReplayChunk beyond ReplayEvidence
  - Scheduled coverage-guided fuzz of replay bytes
  - A retention policy that changes optional history during replay

aliases:
  - ReplayFrame<D>
  - ReplayLog<D>
  - replay_frame
  - replay_log
  - transaction_record
  - ReplayFailure<D>

requirements:
  - id: ordinary-fold
    kind: semantic
    statement: >-
      Replay is Replay(M, T) = foldl(δ, M, T), where δ is the ordinary
      deterministic transition used by Machine::apply and not a second
      evaluator, forecast implementation, or host callback. Each frame carries
      the transaction, the expected previous execution digest, the expected
      topology revision, the runtime policy id, and the resulting execution
      digest. A persisted v1 frame also carries frame_index and
      resulting_observable_digest. The same compatible starting machine,
      semantic versions, runtime policy, and frame sequence must reproduce
      output events, state changes, topology revisions, diagnostic events and
      active episodes, provenance roots and checkpoints, schedules, and the
      final execution and observable digests. Recording execution must use that
      same transition: the caller either clones the transaction before apply
      or uses a helper equivalent to apply_recorded that returns the committed
      result and the frame. The helper must not implement a second apply.
      Ordinary logs record committed transactions only.
    sources: [processor-replay, processor-transition, api-replay, api-replayability, concrete-frames, concrete-creation, concrete-no-callbacks, frame-payload, frame-construction]

  - id: starting-identity
    kind: persistence
    statement: >-
      A replay log records starting network key and fingerprint, starting
      topology revision, starting execution and observable digests, runtime
      policy id, the semantic version vector, and ordered frames. Optional
      final digests and presentation metadata may be present. Frame order is
      semantic and must not be sorted or otherwise rewritten by content.
      Exact replay identity is the time domain, network fingerprint, semantic
      version vector, starting execution digest, starting observable digest,
      runtime policy id, and the ordered transaction sequence. Replay may
      start from a live machine or from a machine restored by the ordinary
      snapshot path. Before the first frame, that machine matches the
      checkpoint and the log on time domain, network fingerprint, execution
      digest, observable digest, topology revision, and runtime policy id.
      The first frame expects that machine through its expected previous
      execution digest, expected revision, and runtime policy id. Observable
      digest and network fingerprint are log and machine identities, not
      additional frame fields.
    sources: [log-payload, replay-identity-appendix, field-summary, checkpoint-resume, processor-policy, api-replay, replay-compatibility-level, family-compatibility]

  - id: chain-and-localization
    kind: semantic
    statement: >-
      Before applying frame i, the current execution digest, topology
      revision, and runtime policy id must equal that frame. After a
      successful apply, the resulting execution and observable digests must
      equal the frame. Replay stops at the first failed or divergent frame
      and reports the frame index, logical time where available, expected and
      actual identities, and the structured underlying failure. Unless the
      operation promises whole-sequence atomicity, the caller-visible machine
      retains the state reached by all prior successfully applied frames. A
      failed apply leaves the machine as ordinary transaction atomicity left
      it. An ordinary
      runtime failure keeps its underlying catalogue code and adds replay
      frame context. It does not become a generic replay.frame_failed code.
      Digest equality remains a consistency check, not acceptance of a wrong
      canonical record.
    sources: [chain-validation, execution-failure, concrete-execution, failure-enums, replay-mapping, processor-transition, digest-equality]

  - id: concatenation
    kind: semantic
    statement: >-
      Where every transaction is valid at its application point,
      Replay(M, A ++ B) equals Replay(Replay(M, A), B). Two logs concatenate
      only when the first final execution digest, observable digest, and
      revision equal the second start, and the network fingerprint, time
      domain, runtime policy id, and semantic version vectors are
      replay-compatible. Otherwise concatenation fails as
      replay.logs_not_concatenable. Concatenation preserves frame order.
      It must not cross a semantic version change silently.
    sources: [concatenation-law, processor-concatenation, family-compatibility, semantic-migrations, prohibited-outcomes]

  - id: temporal-and-module-equivalence
    kind: semantic
    statement: >-
      Direct advancement to a later time and the stepwise sequence through
      the same strictly earlier deadlines are observationally equivalent.
      Caller transactions still use strictly increasing times, and
      equal-deadline events are one unordered batch. Replay uses that same
      transition, so the two advancement styles remain equivalent when
      replayed. Replay of a module or standard-module network uses the
      ordinary flattened transition and reproduces that transition's events
      and both digests. It requires the same standard module references and
      expansion meanings, and it must not silently cross a standard semantic
      version, expansion version, internal key derivation, parameter meaning,
      or migration-rule change.
    sources: [api-jumps, processor-jumps, api-replay, processor-replay, standard-replay]
    basis: derived

  - id: canonical-artifacts
    kind: persistence
    statement: >-
      replay_frame, replay_log, transaction_record, input_snapshot, and
      input_delta are canonical artifact kinds. Each standalone artifact is
      the eight-byte MSIG prefix plus one uncompressed canonical CBOR
      envelope of kind mossignal_artifact. Each envelope carries the complete
      version vector. Semantic version components stored in a payload agree
      with the corresponding envelope components. Integrity uses
      mossignal/artifact_integrity/v1 over the envelope with the digest field
      omitted, and it is not a SnapshotDigest and not authenticity. For one
      supported value and version vector there is one canonical byte sequence.
      Decode rejects a noncanonical alternate rather than normalizing it.
      A child artifact is embedded as a byte string of that child's complete
      standalone bytes, including its prefix, and is validated before
      cross-artifact checks. A frame embeds one transaction_record. That
      record embeds one input_snapshot or input_delta. A log embeds its
      frames in semantic order. A support table that accepts only the vector
      this implementation emits is not a replay-format freeze. The encoder
      must not upgrade, downgrade, or migrate, and must not claim continuity
      across an unacknowledged version change.
    sources: [artifact-classes, artifact-kinds, encoding-foundation, artifact-prefix, envelope-shape, envelope-integrity, content-identity, domain-separation, version-vector, exact-round-trip, no-downgrade, semantic-migrations, prohibited-outcomes, axioms]

  - id: embedded-transaction
    kind: persistence
    statement: >-
      A transaction record carries the requested logical time, expected
      topology revision, network and input-schema binding, and either one
      complete input snapshot or one input delta. The snapshot contains one
      level for every required external level input; pulse counts appear only
      when positive. The delta contains explicit level observations and
      positive pulse counts and does not itself prove lifecycle compatibility.
      Observations are stable typed endpoints, not collection positions, and
      are ordered by signal kind and stable key. Transaction metadata, when
      present, is exact and must not affect evaluator behavior or the
      execution digest. A metadata difference may change the observable or
      snapshot digest when it changes required provenance content. A decoded
      record becomes a Transaction only by
      materialization against the machine: time domain, network, revision,
      input-schema binding, and lifecycle shape must match. Patch-free
      materialization must not compile a new topology. Private dense indexes
      are not identity. Replaying a private PreparedPatch byte image is
      forbidden.
    sources: [input-binding, input-snapshot-artifact, input-delta-artifact, transaction-record, transaction-materialization, transaction-metadata, persisted-forms, not-serialized, stable-keys, scalar-domains, canonical-ordering, prohibited-outcomes, patch-frames]

  - id: hostile-and-version-gate
    kind: prohibition
    statement: >-
      Malformed replay bytes fail structurally, without panic, unchecked
      arithmetic, unbounded recursion, allocation from an unvalidated length,
      a host callback, mutation of caller bytes, or publication of a partial
      machine. Syntactic success is not replay compatibility. Replay
      compatibility additionally requires a compatible start, exact
      transaction semantics, the same runtime policy id, a valid digest
      chain, and a valid frame sequence. DecodePolicy limits apply, including
      maximum replay frames, and a limit failure is
      persistence.decode_limit_exceeded rather than a runtime-policy failure.
      The decoder distinguishes persistence.invalid_prefix,
      persistence.truncated_artifact, persistence.noncanonical_encoding,
      persistence.integrity_digest_mismatch, and
      persistence.unsupported_version. An unsupported version component
      identifies artifact kind, stage, component, encountered version, the
      required version, and that no upgrader exists. Unknown fields and
      variants inside a known schema are persistence.unknown_schema_field
      and persistence.unknown_schema_variant. Human-readable projections are
      not replay evidence.
    sources: [hostile-input, resource-limits, integrity-classes, decode-policy, decode-limits, syntactic-decoding, replay-compatibility-level, family-compatibility, compatibility-failure, support-table, unknown-fields, no-silent-repair, human-readable, malformed-fuzz, decode-codes]

  - id: catalogue-failures
    kind: public_surface
    statement: >-
      ReplayEvidence carries log and frame identity, frame index and logical
      time where available, expected and actual revision, fingerprint,
      policy, and digests, and the underlying operation code where
      applicable. In this patch-free unchunked model the replay conditions
      are replay.starting_execution_digest_mismatch and
      replay.starting_observable_digest_mismatch at the log-to-machine
      boundary, replay.expected_revision_mismatch whenever the machine
      revision differs from that frame's expected revision,
      replay.runtime_policy_mismatch when the machine policy differs from
      the log or a frame, replay.time_domain_mismatch,
      replay.network_fingerprint_mismatch,
      replay.resulting_execution_digest_mismatch and
      replay.resulting_observable_digest_mismatch after apply,
      replay.frame_missing when a declared sequence omits a required frame,
      replay.frame_reordered when order contradicts sequence, digest, or
      prior-state linkage, replay.frame_duplicated when one frame is
      repeated where it cannot validly occur twice, and
      replay.logs_not_concatenable. An expected previous execution digest
      that disagrees with the current machine after the log boundary is
      prior-state linkage failure and uses replay.frame_reordered. A log
      starting execution digest or starting revision that disagrees with the
      first frame's expectation is the same linkage failure. Severity,
      responsibility, and delivery stay as the catalogue fixes them. The
      catalogue also names target-fingerprint, patch-preparation,
      recorded-result, and chunk conditions; this record does not execute
      those paths. Semantic-version, schema, and framing failures keep their
      persistence codes. Compatibility failures must not collapse into
      InvalidData. A wrapper may add the frame index only as non-semantic
      location context.
    sources: [replay-codes, replay-evidence, failure-enums, replay-mapping, api-replay, compatibility-failure, decode-codes]

  - id: optional-history
    kind: semantic
    statement: >-
      Replay reproduces execution and required observable state. It does not
      have to reproduce optional history unless the log explicitly records
      and applies the same retention policy. Two final snapshots may
      therefore share both state digests and differ in SnapshotDigest.
    sources: [optional-history]

  - id: history-and-verification
    kind: verification
    statement: >-
      Tests cover a valid chain and the patch-free failures for a wrong
      starting execution digest, a wrong starting observable digest, a wrong
      revision, a wrong runtime policy, a wrong time domain, a corrupted
      frame, a missing frame, reordered frames, and a duplicated frame. They
      keep golden canonical bytes for representative frames and logs, prove
      that a supported frame or log round-trips to the same bytes, prove that
      frame order changes bytes, and prove that non-semantic input insertion
      order does not. They compare direct advancement with the stepwise
      deadline sequence, including a concatenation boundary immediately
      before and after a temporal deadline, and replay a module or
      standard-module network through the ordinary transition. The reference
      path is the ordinary sequential fold with digest checks. A long
      coverage-guided fuzz campaign is not this obligation.
    sources: [chain-tests, golden-vectors, order-sensitivity, permutation-invariance, canonical-uniqueness, reference-fold, direct-jump-tests, concatenation-tests, replay-equivalence]

recommendations:
  - id: success-constructor
    statement: >-
      A successful result should support ReplayFrame::from_success from the
      retained transaction and that result, returning a structured frame
      failure rather than an unstructured string.
    sources: [concrete-creation]

  - id: materialize-shape
    statement: >-
      Transaction materialization should be an owned method equivalent to
      TransactionRecord::materialize against the machine, and replay should
      reuse it rather than a private second binding check.
    sources: [materialization-api]

  - id: log-content-digest
    statement: >-
      A replay log may expose ReplayLogContentDigest under
      mossignal/replay_log_content/v1 over the starting identities, the
      ordered canonical frame content digests, any final expected identities,
      and the semantic version vector. Presentation metadata stays out of
      that digest.
    sources: [log-digest]

  - id: nonexhaustive-failure
    statement: >-
      ReplayFailure should remain non_exhaustive while the diagnostic schema
      is experimental, without an unregistered fallback variant.
    sources: [nonexhaustive-enums]

implementation_freedom:
  - Use one owned frame type that includes resulting_observable_digest and frame_index in addition to the concrete API fields, so persisted and in-memory replay share one checkpoint. Do not keep a second frame type that drops the observable digest.
  - Apply each frame in place with Machine::apply. On digest mismatch after Ok, leave that published machine and return the mismatch. Treat the successful apply as retained partial progress and the digest failure as the stop condition. Do not add per-frame rollback or ordinary Machine::Clone. Omit the optional whole-sequence atomic helper.
  - Give Transaction and InputSnapshot Clone only if the recording helper must retain the transaction. The helper calls the existing apply path.
  - Choose snake_case payload keys for the log and for fields whose specification text is conceptual rather than a literal key. Required spellings that the persistence text already writes in snake_case stay as written, including frame_index, expected_previous_execution_digest, expected_revision, runtime_policy_id, resulting_execution_digest, and resulting_observable_digest. Sort record fields by the canonical profile. Test the round trip and record the chosen keys. Those keys are not a format freeze.
  - Number frame_index from zero by position in that log and treat it as the non-semantic display index. Concatenation may renumber it and does not keep a second audit index. Renumbering changes embedded frame bytes and their integrity digests. Exact replay identity remains the ordered transaction sequence.
  - Detect replay.frame_missing and replay.frame_duplicated from the declared frame_index sequence: a gap is missing and a repeat is duplicated. Emit one replay code for each log or frame checkpoint. Do not also emit the restoration persistence code of the same general name for that same checkpoint.
  - Compute ReplayLogContentDigest under mossignal/replay_log_content/v1 over starting identities, each embedded frame's artifact integrity digest in order, any final identities, and the semantic version vector. The digest suite defines no separate frame-content domain, so the frame's artifact integrity digest is the frame content digest. Exclude presentation metadata from that content digest and include it in the envelope integrity digest when present. Omit presentation metadata from the encoder unless a test needs it. Do not invent a new domain label.
  - Omit the optional recorded transaction result and any patch attachment from the encoder. A decoded frame that contains either child fails closed before apply and without mutation. Map a transaction_result child to persistence.unsupported_version of that child's artifact schema version, with kind transaction_result and no upgrader. Map a patch attachment to replay.patch_preparation_diverged. Do not implement result comparison or patch preparation in order to produce those failures. Test the mapping and record it. It is not a promise that a later implementation must keep the rejection.
  - Accept only the version vector the current machine_snapshot encoder emits for the shared version components. Every other component is persistence.unsupported_version and has no upgrader. Do not treat that table as a maintainer freeze.
  - Replay failures use the existing Operation subject for persistence together with ReplayEvidence. Do not add ReplayLog, ReplayFrame, or ReplayChunk subject variants.
  - Reuse PersistenceContext, ArtifactBytes, DecodePolicy, the CBOR profile, and the diagnostic registry. A recognized artifact kind other than the kind being decoded is persistence.malformed_envelope. An unrecognized kind string is persistence.unknown_artifact_kind.

