schema_version: "0.1"
id: mossignal.identity.network_fingerprint
title: Network semantic fingerprint
kind: artifact
status: reviewed

source_baseline:
  commit: 22c66d24e9fd2123f418a605b0eb324223351ef2
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/api_and_semantics_spec.md
    - docs/specs/concrete_rust_api_surface.md
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md
    - docs/testing_and_verification_policy.md

summary: >-
  NetworkFingerprint is the opaque, domain-separated 256-bit identity of a
  canonical semantic network projection, stable across construction order and
  private compiled representation while changing with semantic topology,
  parameters, versions, or time domain.

scope:
  includes:
    - NetworkFingerprint value and digest construction
    - canonical semantic projection for stable network structure
    - inclusion and exclusion rules for network identity
    - deterministic identity verification
  excludes:
    - complete definition-artifact encoding and integrity digests
    - module fingerprints beyond their future contribution to network identity
    - execution, observable-state, snapshot, policy, and patch digests

aliases:
  - NetworkFingerprint
  - semantic topology identity
  - compiled fingerprint

requirements:
  - id: distinct-opaque-value
    kind: public_surface
    statement: >-
      NetworkFingerprint is a public opaque fixed 32-byte identity type distinct
      and non-interchangeable from revisions, other fingerprints, and state or
      artifact digests; ordinary API use must not expose the selected digest
      algorithm as part of its semantic type.
    sources: [fixed-fingerprints, concrete-fingerprint]

  - id: digest-construction
    kind: semantic
    statement: >-
      DigestSuiteVersion 1 computes NetworkFingerprint as unkeyed BLAKE3 with a
      256-bit output over the canonical record containing domain label
      mossignal/network_fingerprint/v1, domain version 1, and the version-1
      canonical semantic payload. CoreSemanticsVersion and
      BuiltInNodeSemanticsVersion are initially 1;
      TopologyPatchSemanticsVersion does not participate in the restricted
      projection.
    sources: [digest-suite, domain-separation, digest-version-inputs, restricted-projection]

  - id: canonical-restricted-projection
    kind: semantic
    statement: >-
      The restricted version-1 payload uses the exact network, node, port,
      connection, external-input, external-output, source, target, signal-kind,
      direction, semantic-role, node-kind, and logic-level record and variant
      schemas fixed by the persistence specification. Collections use the
      specified stable semantic order and never Rust layout, discriminants, or
      debug text.
    sources: [restricted-projection, canonical-ordering, canonical-enums]

  - id: validated-network-owner
    kind: lifecycle
    statement: >-
      Successful validation computes NetworkFingerprint and makes
      ValidatedNetwork its first public owner. Compilation accepts no identity
      context and later carries the identical fingerprint into CompiledNetwork.
    sources: [api-validated, concrete-validated]

  - id: representation-exclusions
    kind: prohibition
    statement: >-
      NetworkFingerprint excludes topology revision, dense indices, derived
      reaction-operation allocation, construction and insertion order, hash
      iteration, memory layout, compiled caches, and all presentation-only
      diagnostic metadata including names, descriptions, paths, origins, tags,
      and extensions.
    sources: [network-projection, restricted-projection, api-fingerprint, runtime-fingerprint, api-metadata]

  - id: deterministic-semantic-identity
    kind: semantic
    statement: >-
      Semantically equivalent stable-keyed definitions produce equal network
      fingerprints regardless of construction order, while changes to an
      included structural key, kind, typed role, connection, endpoint source,
      semantic parameter, applicable semantics version, or TimeDomainId change
      the canonical digest input.
    sources: [network-projection, restricted-projection, runtime-fingerprint, deterministic-compilation]

  - id: golden-vector-verification
    kind: verification
    statement: >-
      Representative NetworkFingerprint values require versioned golden vectors;
      tests also establish insertion-order invariance, metadata exclusion, and
      sensitivity to every included restricted semantic category.
    sources: [canonical-vectors, digest-scope-verification, deterministic-compilation]

recommendations:
  - id: value-capabilities
    statement: >-
      NetworkFingerprint should provide Clone, Copy, Eq, Hash, Ord, Debug, and
      Display with a stable hexadecimal representation.
    sources: [concrete-fingerprint]

implementation_freedom:
  - The private semantic-projection types, encoder decomposition, caching, and module placement are unconstrained when canonical bytes and the public opaque value agree exactly.
  - A narrow canonical-value encoder may serve the two fingerprint projections without implementing artifact envelopes, prefixes, decoding, or other persistence formats.

open_questions: []

