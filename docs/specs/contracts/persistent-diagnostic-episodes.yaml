schema_version: "0.1"
id: mossignal.diagnostics.persistent_episodes
title: Persistent diagnostic episode identity and lifecycle
kind: lifecycle
status: reviewed

source_baseline:
  commit: cc3d74809c44dd9aab2bd27b662b600fe9abff65
  working_tree: dirty

summary: >-
  An active diagnostic episode is machine-owned semantic state for one continuous
  catalogue-defined condition. Stable condition and episode identities support
  owned current inspection and atomic lifecycle changes without repeated warnings
  for an unchanged condition.

scope:
  includes:
    - catalogue-safe condition keys, episode identities, and owned public records
    - active-state ownership, material changes, and successful-result publication
    - initialized inspection, causal retention, determinism, and rollback
  excludes:
    - primitive-specific conflict laws and transient runtime occurrences
    - observer subscriptions, host delivery, rendering, and retained completed history
    - persistence encodings, restoration, replay, digests, and topology migration algorithms

known_uncovered:
  - Snapshot and replay encoding, restoration validation, and digest projections of active episodes
  - Compatible preservation, subject reassociation, policy changes, and resolution or termination during topology replacement

aliases:
  - DiagnosticConditionKey
  - DiagnosticEpisodeId
  - ActiveDiagnosticEpisode<D>
  - DiagnosticEpisodeChange<D>
  - PersistentEpisode

requirements:
  - id: catalogue-safe-condition
    kind: public_surface
    statement: >-
      PersistentEpisode is a distinct catalogue-declared delivery form, not a
      severity inference. DiagnosticConditionKey is the opaque canonical identity
      of code, primary subject, and code-defined condition discriminator. An active
      episode's current Problem must agree with that code and subject and permit
      PersistentEpisode delivery; lifecycle changes retain the condition code.
    sources: [delivery, condition-key, episode-records]

  - id: stable-episode-identity
    kind: semantic
    statement: >-
      A fresh opaque DiagnosticEpisodeId derives from network identity, condition
      code, primary structural subject, and condition discriminator. Identity is
      stable across compatible state transitions and does not derive from rendered
      wording, provenance arena identities, or dense runtime positions. Dense-slot
      reuse must not transfer an episode to another subject.
    sources: [catalogue-identity, runtime-identity, episode-records]

  - id: owned-active-and-change-records
    kind: public_surface
    statement: >-
      Owned ActiveDiagnosticEpisode<D> inspection exposes identity, condition key,
      current Problem<D>, began_at, and last_material_change. The non-exhaustive
      DiagnosticEpisodeChangeKind distinguishes Began, Changed, Resolved, and
      Terminated. Owned DiagnosticEpisodeChange<D> exposes identity, kind, exact
      change time, and optional before and after Problem<D> values. Rendered text
      is not authoritative episode data.
    sources: [episode-records]

  - id: continuous-condition-lifecycle
    kind: lifecycle
    statement: >-
      An episode begins when its persistent condition becomes active and emits a
      change when its evidence materially changes. An unchanged active condition
      remains inspectable without repeated events on unrelated transactions.
      Resolution ends active state; a resolution event is optional under the
      general episode model. Begin, change, resolution, and termination are event
      kinds, not new condition codes.
    sources: [catalogue-episodes, runtime-lifecycle, episode-records]

  - id: material-change-versus-reevaluation
    kind: semantic
    statement: >-
      Mere reevaluation of an unchanged condition at a later transaction time
      must not count as material evidence change or restart began_at or
      last_material_change. Materiality must preserve the catalogue-defined
      evidence meaning while satisfying unchanged-condition suppression.
    sources: [catalogue-episodes, episode-records, runtime-lifecycle]
    basis: derived

  - id: candidate-owned-atomic-state
    kind: lifecycle
    statement: >-
      Active episodes belong to semantic machine state because they affect future
      emission. Initialization establishes them through ordinary settlement;
      chronological deadline reactions and the requested-time reaction update
      candidate episode state inside the same outer transaction. Rejection commits
      no creation, evidence change, resolution, or termination.
    sources: [runtime-state, transaction-ordering, catalogue-episodes]

  - id: committed-ordered-publication
    kind: public_surface
    statement: >-
      Successful owned TransactionResult<D> publishes diagnostic_episode_changes
      as part of its semantic changes with deterministic collection order. Changes
      from intervening reactions retain their actual logical times and are not
      independently published before the complete outer transaction commits.
      Public fields may be private when equivalent accessors preserve ownership
      and structured access.
    sources: [result, change-set, transaction-ordering, episode-records]

  - id: ready-inspection-and-causal-retention
    kind: system_effect
    statement: >-
      Current active-episode inspection is a read-only projection of committed
      Ready state and returns a structured not-initialized failure before
      initialization. The machine retains enough provenance to explain active
      diagnostic evidence where causally relevant, including historical facts
      that cannot be reconstructed from current values. Any CauseRef exposed in
      result changes resolves through that result's owned provenance view.
    sources: [inspection, provenance, result]

  - id: episode-conformance
    kind: verification
    statement: >-
      Verification covers inactive-to-active, unchanged continuation, material
      evidence change, resolution, and rejection with candidate episode changes;
      compares structured problems and episode identities; exercises applicable
      primary-subject, discriminator, and evidence merge rules; and demonstrates
      stable semantic identity independent of prose, dense slots, and provenance
      arena identifiers. Tests of preservation, reassociation, removal, snapshots,
      restoration, and replay belong with those supported integration contexts.
    sources: [testing-structure, testing-lifecycle, testing-identity, catalogue-tests]

implementation_freedom:
  - Private active-state tables, identity encoding, discriminator representation, materiality comparison, and candidate staging helpers remain free within the represented semantic rules.
  - Narrow inspection helpers and private record fields with equivalent accessors may precede general inspection plans and observer APIs.
  - Completed episode history is optional and need not be retained in execution state.

open_questions: []

