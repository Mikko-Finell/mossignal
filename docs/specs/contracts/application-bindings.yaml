schema_version: "0.1"
id: mossignal.binding.application_adapter
title: Application endpoint bindings and bound execution adapter
kind: family
status: reviewed

source_baseline:
  commit: c808ff7017d86a2b7a51a17ab9bcbc70554ec3f7
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/api_and_semantics_spec.md
    - docs/specs/concrete_rust_api_surface.md
    - docs/specs/exhaustive_diagnostic_code_catalogue.md
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md
    - docs/specs/processor_and_runtime_architecture.md
    - docs/testing_and_verification_policy.md

summary: >-
  Application bindings are immutable, compiled-topology-bound adapters between
  typed stable external endpoints and opaque caller-owned identifiers. They may
  project caller observations and machine outputs or support an ergonomic bound
  machine, but never participate in network or machine semantics.

scope:
  includes:
    - BindingSet and validated bidirectional endpoint lookup
    - InputProjector construction of ordinary InputSnapshot and InputDelta values
    - output-event and current-level projection to caller-owned output identifiers
    - optional BoundMachine delegation to the canonical Machine
    - structured binding failures and semantic-equivalence verification
  excludes:
    - module-instance bindings and authored graph connections
    - callbacks, subscriptions, delivery cursors, acknowledgement, and observer state
    - caller object-model interpretation and domain-specific entities
    - binding persistence, codecs and replay identity
    - live patch/rebind lifecycle, owned by live-bindings.yaml

known_uncovered:
  - Bound projections for general inspection, explanation, state changes, and observer subscriptions

aliases:
  - BindingSet<I, O>
  - BindingSetBuilder<'a, D, I, O>
  - InputProjector<D, I>
  - BoundMachine<D, I, O>
  - external bindings

requirements:
  - id: caller-owned-nonsemantic-identifiers
    kind: semantic
    statement: >-
      Input and output binding identifiers are supplied and owned by the caller,
      are opaque to mossignal, remain distinct from stable structural keys, and
      must not affect behavior. Application-specific meaning belongs in these
      bindings or diagnostic metadata rather than signals or evaluator callbacks.
    sources: [api-bindings, api-closed-evaluator]

  - id: immutable-compiled-schema-adapter
    kind: public_surface
    statement: >-
      BindingSet<I, O> is an immutable adapter constructed against one
      CompiledNetwork<D>. Its builder accepts typed ExternalInputKey<S> and
      ExternalOutputKey<S> values, validates them against that compiled input and
      output schema, and retains exact NetworkKey, NetworkFingerprint and
      InputSchemaFingerprint compatibility, independently of runtime revision.
      A current-definition map accepts a patched or restored machine; transaction
      revision and freshness checks remain core responsibilities.
    sources: [api-bindings, concrete-binding-sets, concrete-compiled, concrete-shared-identity, concrete-revision]
    basis: derived

  - id: unambiguous-bidirectional-mapping
    kind: semantic
    statement: >-
      Within each input or output direction, a usable binding projection maps
      each represented endpoint to at most one caller identifier and each caller
      identifier to at most one endpoint. Bindings support lookup in both
      directions while preserving the endpoint's signal kind and stable key.
    sources: [api-bindings, concrete-binding-sets, binding-codes]

  - id: binding-construction-failures
    kind: public_surface
    statement: >-
      Binding construction and compatibility checks use structured
      BindingFailure conditions for unknown endpoints, wrong signal kinds,
      duplicate endpoints, duplicate or ambiguous caller keys, missing bindings
      required by a requested projection, wrong networks, and stale semantic definitions or schemas.
      Binding evidence identifies the network context, binding slot, caller key
      where representable, conflicts or omissions, and expected signal kind. A
      diagnostic binding slot is identified by network fingerprint plus its
      kind-aware endpoint; arbitrary caller identifier values do not become core
      semantic identity.
    sources: [binding-evidence, binding-codes, binding-failure-mapping, concrete-binding-subjects, concrete-shared-failure]

  - id: exact-input-projection
    kind: system_effect
    statement: >-
      An InputProjector<D, I> is an immutable adapter validated against the same
      compiled topology as its bindings. It converts caller-keyed level and pulse
      observations into the ordinary exact-bound InputSnapshot<D> and
      InputDelta<D> builders and artifacts, preserving complete-snapshot,
      delta-retention, pulse-multiplicity, duplicate, missing, wrong-kind,
      unknown, network, and schema rules without interpreting caller objects.
    sources: [api-input-projection, api-snapshot, api-delta, concrete-input-projection, concrete-input-artifacts, concrete-snapshot, concrete-delta]

  - id: lossless-output-projection
    kind: system_effect
    statement: >-
      Projecting an OutputEvent<D> associates its stable external-output key with
      the uniquely bound caller output identifier while retaining its exact
      variant, level values or pulse count, reaction stamp and its physical
      time, CauseRef, revision, and
      stream order. Current bound output observation is a pure reverse lookup and
      ordinary Machine inspection of established level-output state; it does not
      invent persistent current pulse values.
    sources: [api-bindings, api-output-events, api-inspection, concrete-output-events]
    basis: derived

  - id: bindings-outside-machine-semantics
    kind: prohibition
    statement: >-
      Bindings, projectors, and projected caller identifiers do not contribute to
      authored or compiled topology, network fingerprints, input-schema identity,
      machine state, runtime policy, scheduling, provenance, transaction or replay
      identity, or persistence. The evaluator never invokes host bindings.
    sources: [api-bindings, concrete-binding-sets, runtime-layering, persistence-scope]

  - id: bound-machine-is-equivalent-delegation
    kind: semantic
    statement: >-
      If BoundMachine<D, I, O> is provided, it combines an ordinary Machine<D>
      with compatible bindings and delegates through the canonical input,
      transaction, inspection, scheduling, and provenance paths. It introduces
      no callbacks or alternate evaluator behavior and cannot become the only
      supported machine API.
    sources: [api-bindings, concrete-bound-machine, concrete-ergonomics, concrete-no-callbacks]

  - id: adapter-equivalence-verification
    kind: verification
    statement: >-
      Tests must compare direct structural-key execution with binding/projector
      and bound-machine execution over initialization and ready transactions.
      After normalizing only caller-key projection, complete semantic outcomes,
      output ordering, scheduling, provenance, structured failures, and machine
      failure atomicity must agree; binding insertion order cannot affect the
      resulting mappings or projected input artifacts.
    sources: [testing-observation, testing-equivalence, testing-input-order, testing-failure-atomicity]

  - id: binding-diagnostic-verification
    kind: verification
    statement: >-
      Every implemented binding condition is verified through its stable code,
      fixed classification, binding subject and related subjects where
      applicable, typed BindingEvidence, and deterministic behavior rather than
      rendered prose.
    sources: [testing-diagnostics, binding-codes]

recommendations:
  - id: safe-independent-finding-collection
    statement: >-
      Binding validation should collect independent safe findings when a report
      boundary is used; atomic projection or compatibility operations may use a
      single structured BindingFailure.
    sources: [testing-report-behavior, concrete-shared-failure]

implementation_freedom:
  - BindingSet storage, hashing strategy, iteration types, and the point at which a missing binding is rejected are free, provided every requested projection is complete, unique, deterministic, and schema-compatible.
  - Exact caller-observation builders, projected event and current-output wrapper types, method names, borrowing, and iterator shapes are free beyond the named public responsibilities; choose the smallest typed owned surface and test the concrete choice.
  - BoundMachine naming and convenience grouping may vary within the mandatory live-binding ownership and atomic publication responsibilities.

open_questions: []

