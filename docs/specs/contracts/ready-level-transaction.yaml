schema_version: "0.1"
id: mossignal.runtime.ready_level_transaction
title: Restricted ready-machine level transaction
kind: lifecycle
status: reviewed

source_baseline:
  commit: 27d343c64e3176ebccb7383c3cb268427d6d38cb
  working_tree: clean

summary: >-
  A ready-machine level transaction advances one initialized restricted machine
  to a strictly later caller-supplied time, overlays one exact-bound InputDelta
  on its authoritative external levels, fully settles the Constant/Not graph,
  and atomically publishes changed level outputs without changing topology.

scope:
  includes:
    - owned explicit level-only advancement transaction and exact preconditions
    - strict ready-machine time progression without temporal deadlines
    - retained omitted inputs and complete restricted full reevaluation
    - atomic Ready-state replacement and unchanged topology revision
    - deterministic LevelChanged events with resolvable causes
    - correctness-oriented staging, rejection, and applicable runtime budgets
  excludes:
    - initialization and InputSnapshot application
    - pulse, stateful, temporal, pending-event, and diagnostic-episode semantics
    - topology patches, reconfiguration, migration, and revision advancement
    - persistence, replay, forecasting, observers, and optimized sparse execution

known_uncovered:
  - Ready-machine execution across temporal deadlines and same-time pending events.
  - Complete explanation-oriented provenance beyond the roots and result-owned view needed to resolve this slice's changed-output events.
  - Execution and observable state digests, schedules, and the eventual complete SemanticChangeSet surface.

aliases:
  - Transaction<D>::advance
  - Machine<D>::apply
  - ready-machine transaction
  - LevelChanged

requirements:
  - id: owned-explicit-advance-value
    kind: public_surface
    statement: >-
      Ready advancement is represented by an owned explicit Transaction<D>
      value. Transaction::advance takes the requested Time<D>, exact expected
      NetworkRevision, and one InputDelta<D>; the transaction remains
      inspectable before execution and is consumed by Machine::apply.
    sources: [api-transactions, concrete-transaction-values, concrete-transaction-constructors, concrete-apply]

  - id: exact-ready-preconditions
    kind: semantic
    statement: >-
      Applying an advance transaction requires a Ready machine, an expected
      revision equal to the current revision, and a delta bound separately to
      the machine's exact NetworkKey, NetworkFingerprint, and
      InputSchemaFingerprint. Lifecycle, revision, network, and schema
      mismatches are structured runtime rejections.
    sources: [api-ready-transaction, api-delta, schema-binding, concrete-transaction-constructors, lifecycle-codes, runtime-codes, input-codes]

  - id: strictly-later-caller-time
    kind: semantic
    statement: >-
      The requested time of every successful ready-machine transaction is
      strictly later than the machine's current time. Equal or earlier times
      receive a structured rejection so call order cannot become hidden same-time
      semantics; the library supplies no wall clock or automatic advancement.
    sources: [api-caller-time, api-time-progression, runtime-codes]

  - id: delta-overlay-retention
    kind: semantic
    statement: >-
      The delta's explicit level observations replace the corresponding values
      in the candidate authoritative external valuation. Every unmentioned
      external level retains its prior authoritative value, including Low or
      High, and omission is never interpreted as a default.
    sources: [api-ready-transaction, api-delta, api-atomic-input]

  - id: ordinary-restricted-settlement
    kind: semantic
    statement: >-
      After forming the complete candidate external valuation, the restricted
      level-only transaction evaluates the complete Constant/Not reaction graph
      and settles all immediate consequences at the requested time. Each
      operation observes only settled predecessors, and the transaction must not
      expose partial propagation or evaluator glitches. A full topological pass
      is the correctness reference, while equivalent private staging remains
      implementation freedom.
    sources: [runtime-reaction-io, runtime-glitch-freedom, runtime-full-evaluation, api-ready-transaction, api-settlement]

  - id: complete-ready-state-on-success
    kind: lifecycle
    statement: >-
      One successful commit keeps the machine Ready, advances its current time
      to the request, installs the complete candidate external valuation and
      complete settled level state, replaces external output baselines, and
      retains the same compiled topology, NetworkRevision, and runtime policy.
      A state-only transaction does not advance topology revision.
    sources: [runtime-transition-model, api-time-progression, api-revision, concrete-apply]

  - id: changed-output-events
    kind: system_effect
    statement: >-
      Each preserved external level output whose newly settled value differs
      from its prior published baseline emits exactly one LevelChanged event
      containing the output, prior value, new value, requested time, current
      revision, and cause. An unchanged output emits no event. The flat event
      collection is deterministic and is published only with successful commit.
    sources: [runtime-output-publication, api-output-events, api-causal-provenance, concrete-output-events]

  - id: resolvable-ready-causes
    kind: system_effect
    statement: >-
      Every returned LevelChanged cause resolves through the successful owned
      result's immutable ProvenanceView to an acyclic derivation terminating in
      authoritative roots such as the committed transaction and applicable
      external observations. Later machine updates must not invalidate causes
      retained by an earlier result, and private arena positions are not durable
      external identity.
    sources: [runtime-provenance-records, runtime-causal-provenance, runtime-causal-order, runtime-authoritative-roots, api-causal-provenance, concrete-result, concrete-cause-references]

  - id: applicable-runtime-policy-budgets
    kind: semantic
    statement: >-
      Ready advancement enforces every associated runtime-policy budget whose
      accounting boundary exists in this restricted path, including full
      operation evaluation, created output events, and required provenance
      growth. Exceeding a budget rejects the complete transaction rather than
      skipping required work or publishing partial settlement.
    sources: [api-runtime-policy, runtime-budget-failure]

  - id: single-atomic-publication
    kind: semantic
    statement: >-
      Precondition checks, delta overlay, full evaluation, candidate state,
      output-event and provenance construction, applicable budget checks, and
      result construction all complete before one non-fallible publication
      point. Public inspection observes either the complete old Ready machine
      or the complete new Ready machine.
    sources: [runtime-transition-model, runtime-commit-point, runtime-preparation, runtime-output-publication, api-settlement, concrete-apply]

  - id: correctness-oriented-staging
    kind: verification
    statement: >-
      Clone-and-swap is the reference transaction strategy: execute against a
      complete private candidate and replace the published machine only on
      success. Any later optimized staging must remain equivalent to this path.
    sources: [runtime-reference-strategy, testing-reference-transaction, testing-candidate-equivalence]

  - id: failure-preserves-complete-machine
    kind: semantic
    statement: >-
      Every structured rejection leaves the complete published machine
      semantically unchanged, including lifecycle, topology and revision,
      logical time, external levels, settled levels, output baselines and
      causes, provenance roots, policy association, and every other represented
      semantic field.
    sources: [runtime-transition-model, concrete-apply, testing-failure-atomicity]

  - id: restricted-ready-verification
    kind: verification
    statement: >-
      Tests cover empty, partial, complete, and explicit-reassertion deltas;
      strict time increase; retained omitted levels; complete reevaluation;
      changed and unchanged output behavior; deterministic event order and
      resolvable causes; unchanged revision; applicable budget boundaries; and
      complete unchanged-state comparison after each supported rejection.
      Every applicable budget is checked one below, exactly at, and one above
      its limit where representable. Equivalent unordered batches must remain
      behaviorally equivalent.
    sources: [api-atomic-input, api-output-events, concrete-result, testing-transaction-history, testing-full-reaction, testing-input-order, testing-failure-atomicity, testing-rejections, testing-provenance-acyclicity, testing-budget-boundaries]

implementation_freedom:
  - Transaction variant storage, lifecycle-aware transaction inspection accessors, module placement, candidate-cloning details, and stable-key event sorting are unconstrained; choose the simplest deterministic auditable forms and do not preserve an initialization-only accessor through a panic or compatibility shim.
  - Private failure representation is unconstrained when reachable rejection categories retain their catalogue distinctions and structured evidence.
  - Provenance storage may share immutable prior records or build a private replacement view when every returned cause remains resolvable and the published machine preserves required current causal roots.
  - Budgets without an implemented accounting boundary require no invented counter; once an accounting boundary exists, the policy and verification obligations apply.

open_questions: []

