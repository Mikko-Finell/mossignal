schema_version: "0.1"
id: mossignal.runtime.temporal_event_execution
title: Ordered temporal event execution
kind: family
status: reviewed

source_baseline:
  commit: c808ff7017d86a2b7a51a17ab9bcbc70554ec3f7
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/api_and_semantics_spec.md
    - docs/specs/built_in_node_semantics.md
    - docs/specs/concrete_rust_api_surface.md
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md
    - docs/specs/processor_and_runtime_architecture.md
    - docs/testing_and_verification_policy.md

summary: >-
  Ready-machine temporal execution owns a stable-identified pending-event
  calendar whose exact deadlines are processed chronologically as complete
  unordered batches inside one failure-atomic outer transaction.

scope:
  includes:
    - semantic event calendar, stable pending-event identity, and next deadline
    - strictly future scheduling and checked deadline creation
    - chronological ready-machine advancement across internal deadlines
    - equal-deadline batching, schedule reporting, and atomic publication
    - ordered reference calendar and temporal-foundation verification
  excludes:
    - node-specific event kinds, payload laws, and cancellation policies
    - topology-patch migration and reconfiguration-time deadline handling
    - snapshot encoding, restoration, replay, and semantic digest encoding
    - forecast execution, observer delivery, and optimized calendar structures

known_uncovered:
  - Generic pending-event inspection and complete temporal explanation rendering
  - Persistent reconstruction and validation of event identity allocation state
  - Topology-patch migration of pending events, including work due at patch time

aliases:
  - semantic event calendar
  - pending event calendar
  - PendingEventKey
  - chronological deadline advancement

requirements:
  - id: ordered-deadline-unordered-batches
    kind: semantic
    statement: >-
      The semantic calendar maps each exact Time<D> deadline to one complete
      finite unordered batch of pending events. Deadlines are totally ordered,
      the next deadline is the least calendar key, and events sharing a deadline
      have no semantic internal order.
    sources: [runtime-calendar, simultaneous-batches]

  - id: stable-machine-local-event-identity
    kind: public_surface
    statement: >-
      Every pending event has a public PendingEventKey distinct from private
      arena, heap, or ordered-map position. Its value is a machine-local u64
      monotonic serial that is never reused within one machine history; private
      storage movement or removal cannot retarget a surviving public key.
    sources: [runtime-event-records, persisted-event-identity]

  - id: complete-pending-event-facts
    kind: semantic
    statement: >-
      A pending record retains its stable key, owner node, kind, exact deadline,
      semantic payload, applicable multiplicity, immutable originating reaction stamp,
      originating revision, causal origin, and migration-relevant metadata.
      Pending work is machine-owned temporal state separate from reaction-scoped
      signal values and from private node-owned queues.
    sources: [builtin-pending-events, persisted-event-calendar, persisted-event-records, distinct-state]

  - id: strictly-future-checked-scheduling
    kind: semantic
    statement: >-
      Every event created by a reaction at time T has a deadline strictly later
      than T. Immediate behavior is represented directly in the current
      reaction, never as same-time calendar work, and checked time arithmetic
      rejects overflow without wrapping.
    sources: [api-time-progression, runtime-future-scheduling, exact-time-tests]

  - id: chronological-ready-advancement
    kind: lifecycle
    statement: >-
      A ready-machine transaction requested at T processes each least pending
      deadline strictly before T in chronological order as one complete
      reaction, then combines surviving events due exactly at T with the single
      current-time external stimulus batch. Internal deadline reactions remain
      private steps of the one outer transaction rather than independent commits.
    sources: [api-ready-ordering, runtime-advancement]

  - id: equal-deadline-batch-invariance
    kind: semantic
    statement: >-
      Every due event at one deadline participates in one unordered semantic
      batch. Reaction results must be invariant under event storage order,
      calendar representation, evaluator traversal order, and any arbitrary
      ordering among simultaneous events.
    sources: [runtime-calendar, simultaneous-batches, equal-deadline-tests]

  - id: direct-jump-equivalence
    kind: semantic
    statement: >-
      Direct advancement from a ready state to target T is observationally
      equivalent to chronological advancement through every meaningful pending
      deadline before T followed by the reaction at T. Distinct logical times
      remain distinct reactions even when crossed by one caller transaction.
      Comparison preserves meaningful reaction partition; additionally inserted
      explicit settlements need not retain identical stamps or freshness digests.
    sources: [api-large-jumps, runtime-jump-equivalence, jump-tests]

  - id: single-atomic-publication
    kind: system_effect
    statement: >-
      All internal deadline reactions and the requested-time reaction prepare
      one candidate machine and one immutable result. Failure in deadline
      arithmetic, reaction evaluation, event creation, provenance, a runtime
      budget, or any later preparation rejects the complete outer transaction
      and preserves logical time, event calendar, public event-serial cursor,
      signals, state, output baselines, and prior published provenance.
    sources: [api-settlement, runtime-transition, persisted-event-identity, failure-atomicity]

  - id: schedule-and-chronological-result
    kind: public_surface
    statement: >-
      On a ready machine, next_deadline returns the least pending deadline and
      schedule returns Dormant or WakeAt(the same least deadline), without
      mutation. Successful results expose the resulting schedule and retain
      output events in one deterministic chronological network-wide stream at
      their actual reaction times. Pre-initialization schedule access fails as
      not initialized rather than reporting Dormant.
    sources: [api-scheduling, api-results, concrete-schedule, concrete-results, concrete-output-events]

  - id: explicit-runtime-budgets
    kind: system_effect
    statement: >-
      Temporal advancement observes the existing explicit limits for internal
      reactions, pending events, events created per transaction, evaluated
      operations, and required provenance growth. Exceeding a named limit is a
      structured atomic rejection and cannot skip required work.
    sources: [concrete-policy, api-policy]

  - id: ordered-reference-calendar
    kind: verification
    statement: >-
      Ordinary tests retain a simple ordered mapping from exact deadlines to
      complete equal-deadline batches as the semantic reference calendar.
      Optimized calendars, if introduced, are differentially checked against
      it after semantic removal of canceled work.
    sources: [reference-calendar, calendar-cancellation-tests]

  - id: temporal-execution-verification
    kind: verification
    statement: >-
      Verification covers arbitrary initial times, non-unit spans, checked
      arithmetic boundaries, strictly future work after every reaction,
      equal-deadline permutation invariance, multiple internal deadlines,
      exact-target deadlines, dormant and wake schedules, direct-jump versus
      stepwise equivalence, deterministic public event identity, budget edges,
      and complete before/after failure atomicity.
    sources: [exact-time-tests, future-tests, jump-tests, equal-deadline-tests, calendar-cancellation-tests, failure-atomicity]

recommendations:
  - id: separated-event-access-and-deadline-index
    statement: >-
      Runtime storage should separate stable access to event records from
      chronological extraction by deadline.
    sources: [runtime-event-records]

implementation_freedom:
  - The first implementation may use the ordered reference map directly; private event-record, batch, and index types are unconstrained.
  - Choose one deterministic stable-subject order for simultaneous public event-key allocation, test insertion-order independence, and record the concrete choice without presenting it as a compatibility promise.
  - Focused temporal-node inspection may establish pending-key observability before the generic inspect_pending, explanation, subscription, snapshot, and replay surfaces are implemented.

open_questions: []

