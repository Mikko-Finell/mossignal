schema_version: "0.1"
id: mossignal.diagnostics.runtime_occurrences
title: Committed runtime diagnostic occurrences
kind: artifact
status: reviewed

source_baseline:
  commit: bc39319ad596752b53380445d26bc5b98f51635a
  working_tree: dirty

summary: >-
  DiagnosticOccurrence<D> is the owned successful-runtime delivery of one
  catalogue-backed transient condition at an exact logical time and topology
  revision, published only through a committed transaction result.

scope:
  includes:
    - RuntimeOccurrence catalogue delivery and safe construction
    - owned occurrence problem, time, revision, and result publication
    - deterministic successful-transaction staging and failure rollback
    - the initial pulse-latch retained-conflict occurrence
  excludes:
    - validation report findings and operation failures
    - persistent diagnostic episode state and lifecycle transitions
    - observer subscriptions, logging, notification delivery, and host callbacks
    - retained occurrence history, snapshot encoding, replay, and persistence formats

known_uncovered:
  - Optional retained diagnostic history and observer cursor semantics
  - Canonical persistence or replay representation for result-owned occurrences

aliases:
  - DiagnosticOccurrence<D>
  - RuntimeOccurrence
  - runtime.pulse_latch_conflict_retained

requirements:
  - id: distinct-catalogue-delivery
    kind: public_surface
    statement: >-
      ProblemDelivery includes RuntimeOccurrence as a distinct successful-runtime
      form. Delivery is fixed by the authoritative catalogue rather than inferred
      from severity, and safe occurrence construction accepts only codes whose
      registry entry permits RuntimeOccurrence.
    sources: [catalogue-delivery, concrete-occurrence]

  - id: owned-occurrence-record
    kind: public_surface
    statement: >-
      DiagnosticOccurrence<D> owns one Problem<D>, exact Time<D>, and
      NetworkRevision and exposes them through borrowed structured access. It is
      distinct from Diagnostic<D>, RuntimeFailure, persistent episode changes,
      and InternalDefect<D>; rendered text is not authoritative occurrence data.
    sources: [catalogue-distinct-forms, concrete-occurrence, concrete-delivery-boundaries]

  - id: committed-result-publication
    kind: lifecycle
    statement: >-
      Runtime occurrences produced by committed reactions appear in the successful
      owned TransactionResult<D>. Distinct earlier deadline reactions remain in
      chronological order before the current-time reaction. Occurrences do not
      appear in RuntimeFailure, invoke host effects during preparation, become
      machine-retained state, or survive a rejected transaction as published
      machine or result state.
    sources: [catalogue-runtime-occurrences, catalogue-failure-boundary, concrete-result, api-transaction-ordering, api-settlement, testing-no-host-effects]
    basis: derived

  - id: transient-reaction-identity
    kind: semantic
    statement: >-
      A transient condition creates an occurrence for the reaction in which it
      exists and does not create active diagnostic state. Separate later pulse
      conflicts are separate occurrences even when their structural subject and
      evidence are otherwise equal.
    sources: [builtin-occurrences-and-episodes, catalogue-runtime-occurrences, pulse-latch]

  - id: initial-pulse-latch-condition
    kind: semantic
    statement: >-
      The initial occurrence-capable code is
      runtime.pulse_latch_conflict_retained, fixed as Warning and Advisory with
      exact ConflictEvidence. One PulseSetResetLatch using RetainAndDiagnose emits
      one occurrence when both complete pulse controls are present in a reaction
      while retaining its previous stored level.
    sources: [pulse-latch, conflict-evidence, runtime-codes]

  - id: structured-stable-evidence
    kind: semantic
    statement: >-
      An occurrence uses the common catalogue-backed Problem<D> with a stable
      primary node subject and exact typed evidence. Pulse-latch conflict evidence
      includes the policy, previous stored state, exact set and reset counts,
      logical time, and revision without parsing prose or exposing dense runtime
      positions.
    sources: [conflict-evidence, runtime-codes, concrete-occurrence]

  - id: module-transparent-occurrences
    kind: system_effect
    statement: >-
      Ordinary-primitive lowering and retained qualified identity mean that a
      primitive occurrence arising inside a supported user module retains its
      primitive code and canonical instance-qualified internal subject. A
      primitive occurrence inside a standard expansion does the same, and its
      presentation grouping must not emit a duplicate module-level warning for
      that condition.
    sources: [api-validated, api-modules, concrete-occurrence]
    basis: derived

  - id: deterministic-occurrence-conformance
    kind: verification
    statement: >-
      Verification compares occurrences structurally and proves deterministic
      ordering independent of authoring, connection, input, and evaluator work
      order. It covers absence and presence, initialization and later reactions,
      separate later conflicts, multiple latch subjects, exact evidence,
      module-qualified subjects, and complete rollback when any
      candidate transaction fails.
    sources: [simultaneous-batches, concrete-required-guarantees, testing-work-order, testing-input-order, testing-failure-atomicity, testing-diagnostics]

implementation_freedom:
  - Occurrence staging may use any private deterministic collection or reaction-local builder; TransactionResult fields may remain private when equivalent accessors expose the owned ordered occurrences.
  - Exact ordering among multiple simultaneous occurrences may use the simplest deterministic stable-subject-aware rule consistent with existing subject-order scope; implementation must test and record the chosen order without implying a broader canonical occurrence-order promise.
  - No machine-retained recent-occurrence history is required by this opening slice.

open_questions: []

