schema_version: "0.1"
id: mossignal.node.edge_detector_family
title: Transition-sensitive edge-detector family
kind: family
status: reviewed

source_baseline:
  commit: 5ffde87853fd17dc5e094bfd8f645d79db3ebda0
  working_tree: dirty
  modified_spec_paths:
    - docs/specs/persistence_canonical_encoding_and_compatibility_spec.md

summary: >-
  RisingEdge, FallingEdge, and AnyEdge are fixed-shape Level-to-Pulse stateful
  primitives that compare one settled current level with a shared remembered
  observation schema, emit zero or one pulse under distinct transition laws,
  and remember the current level for the next reaction.

scope:
  includes:
    - family port shape, initialization policy, observation state, and transition laws
    - typed and dynamic authoring, validation, compilation, and evaluation
    - current-reaction causality, committed-state inspection, provenance, and conformance
    - pre-stability network- and module-fingerprint extension boundary
  excludes:
    - debounce, temporal filtering, retained pulse history, and arbitrary callbacks
    - latches, Toggle, SampleHold, counters, and temporal primitives
    - general state-slot ownership and atomic successor commitment
    - snapshot encoding, restoration, replay, and topology migration

known_uncovered:
  - Canonical snapshot encoding and restoration validation for remembered observations
  - Compatible same-kind and cross-kind topology migration of established observations
  - Complete current-support and why-not explanation rendering for non-emitting reactions

aliases:
  - RisingEdge
  - FallingEdge
  - AnyEdge
  - EdgeConfig
  - EdgeInitialization
  - previous observation

requirements:
  - id: fixed-shape-and-shared-observation-schema
    kind: semantic
    statement: >-
      Each detector has exactly one Level input, one Pulse output, and one
      remembered-observation state cell whose closed values are unestablished,
      established Low, and established High. All three kinds use EdgeConfig
      with an explicit EdgeInitialization of Baseline or Assume(LogicLevel);
      there is no hidden initialization default.
    sources: [edge-initialization, rising-edge, falling-edge, any-edge, concrete-config, persistence-state-schema]

  - id: exact-transition-and-successor-laws
    kind: semantic
    statement: >-
      On every reaction, the detector compares its previous observation with
      the complete settled current input, emits a PulseCount of one exactly for
      its named transition and zero otherwise, and proposes the current input
      as the next established observation. RisingEdge emits only for Low to
      High, FallingEdge only for High to Low, and AnyEdge for either unequal
      established pair; an unestablished previous observation never emits.
    sources: [edge-initialization, rising-edge, falling-edge, any-edge, api-edge-detection]

  - id: explicit-first-reaction-policy
    kind: lifecycle
    statement: >-
      Baseline begins with an unestablished previous observation, so the first
      settled input only establishes memory. Assume(level) begins with that
      configured level as the previous observation, so the ordinary detector
      law applies during initialization and may emit. A successful first
      reaction proposes and atomically commits its current input through the
      ordinary stateful transaction model.
    sources: [transducer-model, machine-initialization, edge-initialization, runtime-edge-initialization]

  - id: immediate-dependency-and-glitch-free-visibility
    kind: semantic
    statement: >-
      Every detector has a conservative current Level-input to Pulse-output
      dependency. It observes only the fully settled current input, exposes its
      zero-or-one result to downstream operations in the same reaction, and
      never observes evaluator intermediates; only the previous observation,
      not the proposed successor, is available to its current law.
    sources: [transducer-model, glitch-freedom, dependency-signatures, runtime-glitch-freedom]

  - id: typed-and-dynamic-authoring
    kind: public_surface
    statement: >-
      NetworkBuilder and ModuleBuilder provide rising_edge, falling_edge, and
      any_edge conveniences accepting Signal<Level> and EdgeConfig, together
      with explicit keyed add_* forms exposing stable NodeKey and metadata.
      Dynamic definitions use the three corresponding closed NodeKind variants
      with stable typed fixed-shape ports.
    sources: [rising-edge, falling-edge, any-edge, builder-keyed, constructor-family, module-builder, dynamic-node-kind, dynamic-ports]

  - id: validation-compilation-and-family-state
    kind: semantic
    statement: >-
      Structural validation enforces each detector's one-Level-input and
      one-Pulse-output shape and retains the immediate dependency for cycle
      analysis. The compiled representation preserves stable subject
      correspondence and enough kind, configuration, dependency, and state-cell
      information to execute the detector law; every descriptor and port must
      agree with its validated kind, and dense identity remains private.
    sources: [api-ports, api-stateful-nodes, api-validation-coverage, dependency-signatures, runtime-compilation, runtime-compiled-invariants]

  - id: observation-inspection-and-pulse-provenance
    kind: system_effect
    statement: >-
      Before initialization, structural inspection exposes the declared
      initialization policy. After initialization, node inspection exposes the
      committed remembered observation separately from current port values and
      reaction-scoped pulse activity. Every emitted edge pulse retains acyclic
      causal support from the current settled observation and the remembered
      prior observation; non-emission does not create retained pulse state.
    sources: [api-pulse, node-inspection, causal-provenance, runtime-derivation, runtime-causal-order, runtime-current-support]
    basis: derived

  - id: pre-stability-identity-extension
    kind: compatibility
    statement: >-
      NetworkFingerprint and ModuleFingerprint distinguish all three detector
      kinds and represent their stable typed port incidence, explicit
      initialization policy including an assumed level, and closed remembered
      observation schema. Before an explicit frozen baseline, the accepted
      implementation may extend the provisional version-1 network projection
      in place. The network projection follows its exact authoritative schema;
      the authoritative projection, implementation, applicable contract
      evidence, and every affected exact golden vector remain synchronized in
      one revision.
    sources: [network-fingerprint, restricted-fingerprint, module-fingerprint, fingerprint-versions]
    basis: derived

  - id: edge-family-conformance
    kind: verification
    statement: >-
      Reusable conformance covers both initialization policies and assumed
      levels; every previous-observation condition crossed with both current
      levels; the applicable common-matrix fields for ports, dependency,
      output, successor state, inspection, explanation, and transition
      causality; and current-state isolation. Because the detector domain is
      finite and small, accepted core coverage exhaustively enumerates its
      transition cases. Focused glitch and stateful-chain cases confirm that
      only settled inputs can emit and that an emitted pulse is visible
      downstream in the same reaction.
    sources: [testing-edge-initialization, testing-glitch-freedom, testing-current-state, testing-conformance, testing-exhaustive, testing-stateful-chain, testing-bounded-exploration, testing-new-builtins]
    basis: derived

recommendations:
  - id: semantic-family-storage
    statement: >-
      Runtime storage should group detector observations in an edge-detector
      semantic family rather than allocate one heap object per node; exact
      descriptors, tables, and layouts remain provisional.
    sources: [runtime-family-storage]

implementation_freedom:
  - Fixed-port key derivation, exact keyed argument grouping, shared private detector-kind representation, descriptor fields, and edge-family state-slot layout are free when stable identity and the complete laws are preserved.
  - Private canonical-encoder helper decomposition and reuse remain free; NetworkFingerprint follows its exact authoritative projection, while ModuleFingerprint follows its separately governed semantic inclusion and ordering rules.
  - A focused owned edge-detector inspection result may precede the broader generic inspection-query, subscription, snapshot, and migration systems.

open_questions: []

