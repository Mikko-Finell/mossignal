schema_version: "0.1"
id: mossignal.authoring.typed_network_builder
title: Typed network builder foundation
kind: artifact
status: reviewed

source_baseline:
  commit: dc8a2e64db7be7002a1e6329f81ab44027c3943d
  working_tree: clean

summary: >-
  NetworkBuilder<D> is the owning strongly typed Rust authoring surface. It
  gives callers builder-scoped typed Signal<S> handles and lowers its authored
  structure into the canonical dynamic UncheckedNetwork<D> boundary.

scope:
  includes:
    - builder-owned network and time-domain identity
    - builder-scoped typed signal handles and foreign-signal rejection
    - level external-endpoint authoring
    - Constant and Not primitive authoring
    - completion into unchecked and validated network artifacts
  excludes:
    - dynamic unchecked-definition storage and validation semantics
    - pulse endpoint authoring
    - primitive families other than Constant and Not
    - modules, hierarchy, binding, persistence, and reconfiguration

known_uncovered:
  - Pulse endpoint authoring
  - Typed support for variadic, stateful, temporal, and module primitives

aliases:
  - NetworkBuilder<D>
  - Signal<S>
  - typed authoring

requirements:
  - id: owning-identity-boundary
    kind: lifecycle
    statement: >-
      NetworkBuilder<D> owns its authored state, one network identity, and one
      caller-supplied TimeDomainId; it must not borrow external storage and
      cannot lower or finish without the identity already bound.
    sources: [api-typed-builder, concrete-builder]

  - id: typed-builder-scoped-signals
    kind: public_surface
    statement: >-
      Signal<S> carries its signal kind, builder identity, and source reference;
      it is an opaque builder-only authoring handle, not a persistent structural
      key or a value that may appear in snapshots, bindings, replay frames, or
      persisted definitions.
    sources: [api-typed-builder, concrete-signals]

  - id: foreign-signal-is-structured-failure
    kind: prohibition
    statement: >-
      A consuming builder operation supplied a Signal from another builder must
      return AuthoringFailure::ForeignSignal, rather than panic or silently
      connect an unrelated source.
    sources: [concrete-signals, catalogue-authoring]

  - id: typed-endpoint-authoring
    kind: public_surface
    statement: >-
      The foundation provides typed level external-input and external-output
      authoring forms. Its explicit level-input form accepts an
      ExternalInputKey<Level> and DiagnosticMeta and rejects immediately
      determinable duplicate keys; its output forms accept only Signal<Level>.
    sources: [api-typed-builder, concrete-inputs, concrete-outputs]

  - id: primitive-authoring-contract
    kind: public_surface
    statement: >-
      The foundation offers signal-free Constant construction and signal-taking
      Not construction. Constant construction is infallible and every call
      creates a distinct Constant with its own stable identity; Not returns a
      structured authoring result. Explicit keyed Constant and Not forms accept
      NodeKey and DiagnosticMeta and expose the authored node identity.
    sources: [concrete-primitives, concrete-explicit-keyed, concrete-constant-rules]

  - id: completion-boundary
    kind: lifecycle
    statement: >-
      Builder completion consumes the builder. into_unchecked materializes its
      canonical dynamic definition, while finish materializes it, runs complete
      validation, and returns the common Report boundary.
    sources: [concrete-completion]

implementation_freedom:
  - Constructor spelling and argument grouping are free when identity is bound before lowering.
  - Private builder identity, signal representation, allocation mechanics, lowering decomposition, and module placement are free.
  - Initial bounded slices may support only selected typed node and endpoint families without placeholder semantics for later families.

open_questions: []

