schema_version: "0.1"
id: mossignal.verification.optimized_paths
title: Verification of optimized runtime and projection paths
kind: concept
status: reviewed
source_baseline:
  commit: 207cd9758682f49ad6457776560972512c669a56
  working_tree: clean
summary: >-
  Optimizations refine maintained, executable correctness references. Their
  evidence identifies semantic normalization, exercised inputs, assumptions,
  rollback observations, and independent debug recomputation.
scope:
  includes:
    - refinement and reference availability for runtime and projection optimizations
    - optimization-specific evidence and failure-atomicity verification
  excludes:
    - individual node laws and artifact schemas
    - storage choices, work-counter targets, and benchmark thresholds
requirements:
  - id: executable-refinement
    kind: verification
    statement: >-
      Candidate and reference agree after semantic normalization for their valid
      shared input domain. Relevant references are clone-and-swap transaction
      execution, stable-keyed canonical encoding and digest generation, fresh
      inspection projection, applying a forecast transaction to an unpublished
      clone, and replay through repeated ordinary application. A production
      replacement requires continuous enforcement of its applicable refinement
      obligation in tests.
    sources: [refinement, reference-paths]
  - id: maintained-independent-references
    kind: verification
    statement: >-
      References exist in ordinary test configuration, are callable by property
      and differential tests, and remain maintained as semantics evolve. They
      share semantic definitions without sharing the optimized algorithm under
      verification and are simple enough to audit. Public exposure and production
      performance are unnecessary.
    sources: [reference-availability]
  - id: optimization-evidence
    kind: verification
    statement: >-
      Each optimization identifies its reference, semantic normalization,
      exercised generator domain, assumptions and exclusions, and retained debug
      checks. Without an executable equivalence strategy it requires explicit
      architectural justification and stronger alternative verification.
    sources: [new-optimized-paths]
  - id: complete-rejection-observation
    kind: verification
    statement: >-
      For each structured failure category, capture complete semantic observation
      before execution and compare it after rejection: lifecycle, topology,
      revision, time, external and settled levels, node and temporal state,
      pending events, output baselines, provenance roots, active episodes, and
      execution and observable digests. Candidate-versus-clone comparisons cover
      both success and structured failure.
    sources: [failure-observation, candidate-equivalence]
  - id: limited-reference-independence
    kind: verification
    statement: >-
      Where full reference/candidate independence is impractical, the limitation
      must be documented and supplemented by another verification method.
    sources: [reference-independence]
recommendations:
  - id: independent-algorithms
    statement: >-
      Reference and candidate should avoid sharing the exact logic under
      comparison.
    sources: [reference-independence]
  - id: recompute-dynamic-invariants
    statement: >-
      Debug and test configurations should independently recompute affected
      invariants, including provenance acyclicity and authoritative-root
      reachability, calendar membership, episode ownership, canonical digests,
      and snapshot round trips at meaningful semantic boundaries.
    sources: [debug-invariants]
  - id: preparation-fault-injection
    statement: >-
      Test-only injection should cover applicable fallible preparation stages
      through the ordinary rollback boundary, including evaluation, migration,
      provenance, result construction, encoding, digest calculation, and budgets.
    sources: [fault-injection]
open_questions: []
